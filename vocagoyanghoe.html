<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#160826">
<title>Heart of English · 보카고양 ✦</title>
<style>
:root{
  --bg1:#160826; --bg2:#2a0c40; --bg3:#3a1054;
  --ink:#ffffff; --muted:#cdbcef;
  --panel:#1d0c2e; --panel2:#26103a;
  --line:#5a2d7a;
  --pink:#ff4fa3; --pink2:#ff8ac6; --pinkpale:#ffd0e7;
  --cyan:#5ce6ff; --mint:#7cffb2; --gold:#ffd34d; --gold2:#f5b301;
  --bad:#ff5d6c;
  --radius:14px;
  --shadow:0 0 30px rgba(255,79,163,.28), inset 0 0 24px rgba(255,138,198,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;margin:0;}
body{
  font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 16% 14%, rgba(255,79,163,.30), transparent 30%),
    radial-gradient(circle at 84% 10%, rgba(92,230,255,.16), transparent 26%),
    radial-gradient(circle at 78% 84%, rgba(124,255,178,.10), transparent 26%),
    linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 60%, var(--bg3) 100%);
  background-attachment:fixed;
  overflow-x:hidden;
}
/* starfield */
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    radial-gradient(2px 2px at 20% 30%,#fff,transparent),
    radial-gradient(2px 2px at 70% 80%,#fff,transparent),
    radial-gradient(1px 1px at 40% 60%,var(--gold),transparent),
    radial-gradient(1px 1px at 85% 22%,var(--cyan),transparent),
    radial-gradient(2px 2px at 12% 82%,var(--pink2),transparent),
    radial-gradient(1px 1px at 52% 12%,#fff,transparent),
    radial-gradient(2px 2px at 34% 88%,var(--pink),transparent);
  opacity:.7;animation:tw 3s steps(2) infinite;
}
@keyframes tw{50%{opacity:.3;}}
button,input{font:inherit;}
.app{position:relative;z-index:1;width:min(100%,560px);min-height:100dvh;margin:0 auto;
  padding:max(10px,env(safe-area-inset-top)) 13px max(14px,env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:12px;}

/* ---------- header / map ---------- */
.appbar{display:flex;align-items:center;gap:10px;}
.appbar h1{margin:0;font-size:1.12rem;line-height:1.2;letter-spacing:-.3px;
  text-shadow:0 0 12px rgba(255,79,163,.5);}
.appbar h1 b{color:var(--gold);}
.appbar .spacer{flex:1;}
.iconbtn{width:40px;height:40px;border-radius:11px;border:2px solid var(--line);
  background:var(--panel2);color:#fff;font-size:1.05rem;cursor:pointer;display:grid;place-items:center;}
.iconbtn:active{transform:translateY(1px);}

/* map progress (Ilsan -> Seoul) */
.maproute{order:5;border:2px solid var(--line);border-radius:var(--radius);background:
   linear-gradient(135deg,rgba(255,255,255,.05),transparent 40%),var(--panel);
  box-shadow:var(--shadow);padding:11px 13px 13px;}
.maproute .ends{display:flex;justify-content:space-between;font-size:.74rem;font-weight:800;
  color:var(--muted);margin-bottom:7px;}
.maproute .ends .seoul{color:var(--gold);}
.track{position:relative;height:20px;}
.track .rail{position:absolute;top:50%;left:6px;right:6px;height:6px;transform:translateY(-50%);
  border-radius:99px;background:#3a1f55;overflow:hidden;
  box-shadow:inset 0 0 6px rgba(0,0,0,.5);}
.track .rail i{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--cyan),var(--mint),var(--gold),var(--pink2),var(--pink));
  box-shadow:0 0 10px var(--pink2);transition:width .5s cubic-bezier(.2,1,.3,1);}
.track .marker{position:absolute;top:50%;left:0;width:24px;height:24px;transform:translate(-50%,-50%);
  transition:left .5s cubic-bezier(.2,1,.3,1);z-index:2;}
.track .marker img{width:100%;height:auto;image-rendering:pixelated;
  filter:drop-shadow(0 0 5px rgba(255,79,163,.6));}
.track .pin{position:absolute;top:50%;width:11px;height:11px;border-radius:50%;
  transform:translate(-50%,-50%);background:#2a0a3a;border:2px solid var(--line);}
.track .pin.lit{background:var(--gold);border-color:var(--gold2);box-shadow:0 0 8px var(--gold);}
.maproute .pct{margin-top:8px;text-align:center;font-size:.78rem;color:var(--muted);}
.maproute .pct b{color:var(--gold);}

/* ---------- cat companion bubble (home) ---------- */
.catrow{display:grid;grid-template-columns:auto 1fr;gap:11px;align-items:end;
  border:2px solid var(--line);border-radius:var(--radius);
  background:linear-gradient(135deg,rgba(255,255,255,.05),transparent 40%),var(--panel);
  box-shadow:var(--shadow);padding:12px;}
.catimg{width:clamp(78px,21vw,104px);}
.catimg img{width:100%;height:auto;image-rendering:pixelated;display:block;
  filter:drop-shadow(0 0 8px rgba(255,255,255,.7)) drop-shadow(0 0 16px rgba(255,79,163,.4));
  animation:bob 2.6s ease-in-out infinite;}
@keyframes bob{50%{transform:translateY(-4px) rotate(-1deg);}}
.bubble{position:relative;border:2px solid var(--pink2);border-radius:12px;padding:11px 13px;
  background:rgba(34,16,58,.96);font-size:clamp(.86rem,3.6vw,1.02rem);line-height:1.5;
  box-shadow:0 0 16px rgba(255,79,163,.22);min-height:3em;display:flex;align-items:center;}
.bubble::before{content:"";position:absolute;left:-9px;bottom:18px;width:15px;height:15px;
  background:rgba(34,16,58,.96);border-left:2px solid var(--pink2);border-bottom:2px solid var(--pink2);
  transform:rotate(45deg);}
.bubble .nm{color:var(--pink2);font-weight:900;}

/* ---------- screens ---------- */
.screen{display:none;flex-direction:column;gap:12px;flex:1;animation:lift .18s ease-out;}
.screen.active{display:flex;}
/* game: 단어카드+입력창을 위로, 진행/정보 패널은 아래로 */
#gameScreen .inpanel{order:0;}
#gameScreen .quiz{order:1;}
#gameScreen .gtop{order:2;}
@keyframes lift{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

.panel{border:2px solid var(--line);border-radius:var(--radius);
  background:linear-gradient(135deg,rgba(255,255,255,.05),transparent 42%),var(--panel);
  box-shadow:var(--shadow);}
.phead{display:flex;align-items:center;gap:10px;padding:13px;}
.phead h2{margin:0;font-size:1.05rem;}
.phead p{margin:3px 0 0;color:var(--muted);font-size:.82rem;}

/* lesson + exercise grids */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;align-items:start;}
.lessonbtn,.exbtn{border:2px solid var(--line);border-radius:12px;cursor:pointer;color:#fff;
  text-align:left;padding:13px;display:flex;flex-direction:column;gap:9px;
  background:linear-gradient(160deg,#3a1555,#26103a 62%,#170824);
  text-shadow:1px 1px 0 rgba(0,0,0,.4);transition:transform .12s,border-color .12s,box-shadow .12s;}
.lessonbtn:active,.exbtn:active{transform:translateY(1px);}
.lessonbtn:hover,.exbtn:hover{border-color:var(--pink);box-shadow:0 0 18px rgba(255,79,163,.4);}
.lessonbtn .t,.exbtn .t{font-size:1.18rem;font-weight:900;}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;
  color:var(--muted);font-size:.78rem;}
.bar{height:7px;border-radius:99px;background:#2a1340;overflow:hidden;
  border:1px solid rgba(184,168,255,.25);}
.bar i{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--cyan),var(--mint),var(--gold),var(--pink));
  transition:width .3s;}
.lessonbtn{padding:9px 11px !important;gap:5px !important;}
.lessonbtn .lh{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;line-height:1.12;}
.lessonbtn .lid{font-size:1rem;font-weight:900;color:#fff;}
.lessonbtn .lname{font-size:.8rem;font-weight:700;color:var(--pink2);letter-spacing:-.3px;}
.lessonbtn .lmeta{font-size:.72rem;color:var(--muted);}
.lessonbtn .lmeta b{color:var(--gold);}
.lessonbtn.done{border-color:var(--gold2);}
.exgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;padding:0 13px 13px;}
.exbtn .done{color:var(--gold);font-weight:800;}
.exbtn.cleared{border-color:var(--gold2);}
.exbtn.cleared::after{content:"★";color:var(--gold);position:absolute;}

/* ---------- game ---------- */
.gtop{display:grid;gap:9px;padding:11px 13px;}
.gtoprow{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.kick{color:var(--mint);font-size:.74rem;font-weight:900;}
.gtitle{font-size:.98rem;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.roundpill{flex:none;border:2px solid var(--pink);border-radius:99px;color:var(--gold);
  font-weight:900;font-size:.82rem;padding:5px 11px;background:var(--panel2);
  box-shadow:0 0 10px rgba(255,79,163,.3);}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;}
.stat{border:1px solid var(--line);border-radius:10px;background:var(--panel2);text-align:center;padding:7px 4px;}
.stat b{display:block;font-size:.96rem;line-height:1.1;}
.stat span{color:var(--muted);font-size:.66rem;}
.stat.t-time b{color:var(--cyan);} .stat.t-err b{color:var(--bad);} .stat.t-lim b{color:var(--gold);}

/* quiz card with cat sidekick */
.quiz{flex:0 0 auto;display:flex;flex-direction:column;justify-content:flex-start;gap:10px;
  min-height:min(46dvh,320px);padding:16px;position:relative;overflow:hidden;isolation:isolate;}
.quiz .qcat{position:absolute;right:8px;bottom:6px;width:clamp(58px,16vw,84px);opacity:.96;z-index:6;pointer-events:none;}
.quiz .qcat img{width:100%;image-rendering:pixelated;filter:drop-shadow(0 0 6px rgba(255,79,163,.5));}
.meaning{margin:0;text-align:center;font-weight:900;line-height:1.18;word-break:keep-all;
  font-size:clamp(1.7rem,8vw,3.2rem);
  text-shadow:0 0 10px var(--cyan),0 0 18px rgba(255,79,163,.3),2px 2px 0 #4a0a72;position:relative;z-index:1;}
.mhint{display:none;position:relative;z-index:1;text-align:center;color:var(--cyan);
  font-size:.82rem;font-weight:800;line-height:1.3;word-break:keep-all;
  text-shadow:0 0 8px rgba(92,230,255,.35);}
.qmini{position:relative;z-index:1;text-align:center;color:var(--muted);font-size:.78rem;min-height:1.1em;}
.timewrap{position:relative;z-index:1;height:8px;border-radius:99px;background:#2a1340;overflow:hidden;
  border:1px solid rgba(184,168,255,.25);}
.qoverlay{position:absolute;inset:0;z-index:5;display:none;flex-direction:column;justify-content:flex-start;
  align-items:center;gap:8px;padding:14px 16px;border-radius:inherit;text-align:center;overflow:auto;
  background:linear-gradient(160deg,rgba(38,16,58,.97),rgba(22,8,38,.98));animation:ovin .18s ease-out;}
.qoverlay.show{display:flex;}
.qoverlay.good{background:linear-gradient(160deg,rgba(20,44,30,.96),rgba(14,30,22,.98));}
@keyframes ovin{from{opacity:0;transform:scale(.97);}to{opacity:1;transform:scale(1);}}
.ov-cat{width:clamp(46px,12vw,64px);}
.ov-cat img{width:100%;image-rendering:pixelated;filter:drop-shadow(0 0 7px rgba(255,79,163,.5));}
.ov-say{color:var(--pink2);font-weight:900;font-size:clamp(.92rem,4vw,1.12rem);line-height:1.35;}
.qoverlay.good .ov-say{color:var(--mint);}
.ov-ans{color:var(--gold);font-weight:900;line-height:1.08;font-size:clamp(1.8rem,9vw,3rem);
  overflow-wrap:anywhere;text-shadow:0 0 12px #fff,0 0 26px var(--gold),3px 3px 0 #4a0a72;}
.ov-ko{color:var(--muted);font-size:.84rem;}
.ov-ghost{font-family:ui-monospace,monospace;font-size:clamp(1.5rem,8vw,2.4rem);font-weight:900;
  letter-spacing:2px;word-break:break-all;color:#6a4c86;}
.ov-ghost b{color:var(--mint);} .ov-ghost .x{color:var(--bad);}
.ov-hint{color:var(--muted);font-size:.78rem;}
.qoverlay.wrong{animation:sh .3s;}
.timewrap i{display:block;height:100%;width:100%;border-radius:99px;background:var(--mint);
  transition:width .15s linear, background .3s;}
.timewrap.warn i{background:var(--gold);} .timewrap.danger i{background:var(--bad);}

/* input */
.inpanel{padding:12px;display:grid;gap:9px;grid-template-columns:1fr auto;
  grid-template-areas:"inp cat" "row cat";align-items:center;}
.inpanel .ainput{grid-area:inp;}
.inpanel #submitBtn{display:none;}
.inpanel .fb{display:none;}
.inpanel .row2{grid-area:row;}
.catbtn{grid-area:cat;background:none;border:0;padding:0 2px;cursor:pointer;
  align-self:stretch;display:flex;align-items:center;justify-content:center;
  -webkit-tap-highlight-color:transparent;}
.catbtn img{height:100%;width:auto;max-height:120px;image-rendering:pixelated;display:block;
  filter:drop-shadow(0 0 8px rgba(255,255,255,.6)) drop-shadow(0 0 14px rgba(255,79,163,.4));
  animation:bob 2.6s ease-in-out infinite;}
.catbtn:active{transform:translateY(2px);}
.ainput{min-width:0;min-height:56px;border:2px solid var(--line);border-radius:11px;background:#160a24;
  color:#fff;padding:0 14px;font-size:1.2rem;letter-spacing:.4px;outline:none;caret-color:var(--gold);
  box-shadow:inset 0 0 12px rgba(0,0,0,.55);}
.ainput:focus{border-color:var(--pink2);box-shadow:0 0 0 2px rgba(255,255,255,.12),0 0 18px rgba(255,79,163,.4);}
.ainput.ok{border-color:var(--mint);} .ainput.bad{border-color:var(--bad);animation:sh .35s;}
@keyframes sh{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}50%{transform:translateX(6px);}75%{transform:translateX(-4px);}}
.btn{min-height:56px;border-radius:11px;border:2px solid var(--gold2);cursor:pointer;font-weight:900;
  padding:0 18px;background:linear-gradient(180deg,#ffe06b,#e0a92a 60%,#7d4f06);color:#1a0820;
  box-shadow:0 0 12px rgba(255,211,77,.5),0 4px 0 #4a2d06;}
.btn:active{transform:translateY(2px);box-shadow:0 0 12px rgba(255,211,77,.5),0 2px 0 #4a2d06;}
.btn:disabled{opacity:.5;}
.ghost{min-height:44px;border-radius:11px;border:2px solid var(--line);background:var(--panel2);color:#fff;
  cursor:pointer;font-weight:800;padding:0 12px;}
.ghost:active{transform:translateY(1px);}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}

/* feedback / copy mode */
.fb{display:none;border:2px solid var(--line);border-radius:12px;background:var(--panel2);padding:12px;}
.fb.show{display:block;}
.fb.good{border-color:var(--mint);background:rgba(124,255,178,.08);}
.fb.bad{border-color:var(--bad);background:rgba(255,93,108,.08);}
.reveal{display:block;text-align:center;color:var(--gold);font-weight:900;line-height:1.1;
  font-size:clamp(2rem,11vw,4.4rem);overflow-wrap:anywhere;
  text-shadow:0 0 12px #fff,0 0 26px var(--gold),3px 3px 0 #4a0a72;}
.reveal small{display:block;font-size:.9rem;color:var(--muted);margin-top:6px;text-shadow:none;letter-spacing:0;}
.copywrap{display:grid;grid-template-columns:auto 1fr;gap:11px;align-items:center;}
.copywrap .cc{width:clamp(64px,17vw,90px);}
.copywrap .cc img{width:100%;image-rendering:pixelated;filter:drop-shadow(0 0 7px rgba(255,79,163,.5));}
.copybox{min-width:0;}
.copybox .say{color:var(--pink2);font-weight:900;margin-bottom:6px;font-size:.92rem;}
.ghosttar{font-family:ui-monospace,monospace;font-size:clamp(1.5rem,8vw,2.6rem);font-weight:900;
  letter-spacing:2px;word-break:break-all;color:#6a4c86;}
.ghosttar b{color:var(--mint);} .ghosttar .x{color:var(--bad);}
.copyhint{color:var(--muted);font-size:.74rem;margin-top:6px;}
.copywrap.wrong{animation:sh .3s;}

/* summary */
.sum{padding:16px;display:grid;gap:13px;}
.sum h2{margin:0;font-size:clamp(1.4rem,6vw,2rem);}
.sumcat{display:grid;grid-template-columns:auto 1fr;gap:11px;align-items:center;}
.sumcat .cc{width:clamp(70px,18vw,96px);}
.sumcat .cc img{width:100%;image-rendering:pixelated;filter:drop-shadow(0 0 8px rgba(255,211,77,.6));}
.sumgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.sumitem{border:2px solid var(--line);border-radius:11px;background:var(--panel2);padding:11px;}
.sumitem b{display:block;font-size:1.15rem;} .sumitem span{color:var(--muted);font-size:.78rem;}

/* fx layer */
.fxlayer{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:40;}
.quiz.flash{animation:cardPulse .5s ease-out;}
@keyframes cardPulse{0%{box-shadow:var(--shadow);}45%{box-shadow:0 0 0 2px #fff,0 0 26px 8px var(--pink2),var(--shadow);}100%{box-shadow:var(--shadow);}}
.spark{position:absolute;left:var(--x,50%);top:var(--y,50%);width:var(--sz,30px);height:var(--sz,30px);
  transform:translate(-50%,-50%);animation:fly 1.25s cubic-bezier(.18,.9,.3,1) forwards;
  filter:drop-shadow(0 0 5px #fff) drop-shadow(0 0 12px var(--glow,#ff4fa3));will-change:transform,opacity;}
.spark svg{width:100%;height:100%;display:block;}
@keyframes fly{0%{transform:translate(-50%,-50%) translate(0,0) scale(.25) rotate(0);opacity:0;}
  18%{opacity:1;}
  100%{transform:translate(-50%,-50%) translate(var(--dx),var(--dy)) scale(1.05) rotate(var(--rot,360deg));opacity:0;}}
.ring{position:absolute;left:var(--x,50%);top:var(--y,50%);width:24px;height:24px;border-radius:50%;
  border:6px solid var(--gold);transform:translate(-50%,-50%);animation:rg .85s ease-out forwards;
  box-shadow:0 0 24px #fff,0 0 50px var(--pink);}
.ring.b{border-color:var(--pink);animation-delay:.08s;} .ring.c{border-color:var(--cyan);animation-delay:.16s;}
@keyframes rg{0%{width:20px;height:20px;opacity:1;}100%{width:440px;height:440px;opacity:0;border-width:1px;}}
.heartburst{position:absolute;left:var(--x,50%);top:var(--y,50%);width:120px;height:120px;
  transform:translate(-50%,-50%) scale(.2);transform-origin:center;opacity:0;
  animation:hburst .95s cubic-bezier(.16,1,.3,1) forwards;
  filter:drop-shadow(0 0 24px #fff) drop-shadow(0 0 60px #ff4fa3);will-change:transform,opacity;}
.heartburst svg{width:100%;height:100%;display:block;}
@keyframes hburst{0%{transform:translate(-50%,-50%) scale(.2);opacity:0;}
  22%{opacity:1;}
  55%{transform:translate(-50%,-50%) scale(2.6);opacity:.95;}
  100%{transform:translate(-50%,-50%) scale(3.4);opacity:0;}}
body.shake{animation:bshake .3s;}
@keyframes bshake{0%,100%{transform:translate(0,0);}33%{transform:translate(-3px,2px);}66%{transform:translate(3px,-2px);}}

/* toast */
.toast{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));z-index:60;
  transform:translate(-50%,14px);opacity:0;pointer-events:none;width:min(calc(100% - 26px),420px);
  padding:11px 14px;border-radius:12px;background:var(--panel);border:2px solid var(--pink);
  text-align:center;font-weight:800;box-shadow:var(--shadow);transition:.16s;}
.toast.show{opacity:1;transform:translate(-50%,0);}

@media (max-width:640px){
  .grid,.exgrid{grid-template-columns:1fr 1fr;}
  .stats{grid-template-columns:repeat(4,1fr);}
}
@media (max-width:380px){
  .stat span{font-size:.6rem;}
  .meaning{font-size:clamp(1.5rem,8.5vw,2.6rem);}
}

/* ---------- ending (100% 탈출) ---------- */
.ending{position:fixed;inset:0;z-index:60;display:none;place-items:center;padding:20px;
  background:radial-gradient(circle at 50% 28%,rgba(255,79,163,.28),rgba(8,3,16,.93));
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);}
.ending.show{display:grid;animation:endfade .45s ease;}
@keyframes endfade{from{opacity:0;}}
.ending-card{width:min(100%,420px);border:2px solid var(--gold2);border-radius:18px;
  background:linear-gradient(160deg,#2c0d44,#160826);box-shadow:0 0 44px rgba(255,211,77,.45),inset 0 0 30px rgba(255,138,198,.08);
  padding:22px 20px 18px;text-align:center;}
.ending-card .ec{width:114px;margin:0 auto;}
.ending-card .ec img{width:100%;image-rendering:pixelated;filter:drop-shadow(0 0 12px rgba(255,211,77,.65));animation:bob 2.6s ease-in-out infinite;}
.ending-card h2{margin:8px 0 6px;color:var(--gold);text-shadow:0 0 12px rgba(255,211,77,.5);font-size:1.3rem;}
.ending-card p{color:var(--muted);font-size:.9rem;line-height:1.55;margin:0 0 15px;}
.ending-form{display:flex;flex-direction:column;gap:10px;}
.ending-form input{padding:12px 14px;border-radius:12px;border:2px solid var(--line);
  background:var(--panel2);color:#fff;font-size:1.06rem;text-align:center;}
.ending-form input:focus{outline:none;border-color:var(--pink);box-shadow:0 0 12px rgba(255,79,163,.4);}
.ending-result{display:none;margin-top:6px;font-size:1.18rem;font-weight:800;color:var(--gold);line-height:1.55;animation:endpop .5s cubic-bezier(.2,1.4,.4,1);}
.ending-result .nm{color:var(--pink2);}
@keyframes endpop{from{transform:scale(.7);opacity:0;}}

/* ===== HoE 리치 카드/리빌 ===== */
.hoectx .ex{margin-top:9px;font-size:1rem;color:var(--pinkpale);line-height:1.55;word-break:keep-all;text-align:center;}
.hoectx .blanks{display:inline-flex;gap:6px;margin:0 4px;vertical-align:-2px;}
.hoectx .slot{width:15px;height:1.05em;border-bottom:3px solid var(--gold);box-shadow:0 3px 8px rgba(255,211,77,.35);}
.ov-ipa{font-size:1.02rem;color:var(--cyan);font-weight:600;letter-spacing:.3px;margin-top:4px;}
.ov-ipa b{color:var(--gold);font-weight:900;font-size:1.55rem;}
.ov-ex{margin-top:10px;font-size:1.02rem;color:#fff;line-height:1.5;word-break:keep-all;}
.ov-ex .fill{color:var(--gold);font-weight:900;text-shadow:0 0 10px var(--gold2);}
.ov-tr{margin-top:5px;font-size:.9rem;color:var(--muted);}
.ov-c{margin-top:12px;font-size:1.05rem;color:#fff;line-height:1.6;text-align:left;overflow-wrap:anywhere;
  background:rgba(124,255,178,.09);border:1px solid var(--mint);border-radius:12px;padding:11px 13px;}
.ov-say{font-size:.86rem;opacity:.85;}
.qoverlay.show{overflow-y:auto;}
</style>
</head>
<body>
<div class="app">
  <div class="appbar">
    <h1>꽃과 단어의 도시를 <b>벗어나고양!</b></h1>
    <span class="spacer"></span>
    <button class="iconbtn" id="muteBtn" title="소리">🔊</button>
    <button class="iconbtn" id="resetBtn" title="기록 초기화">↺</button>
  </div>

  <!-- map route -->
  <div class="maproute">
    <div class="ends"><span>🌹 일산</span><span class="seoul">전설의 BIG MOUNTAIN 🌳</span></div>
    <div class="track">
      <div class="rail"><i id="routeFill"></i></div>
      <div class="marker" id="routeMarker"><img id="routeCat" alt=""></div>
    </div>
    <div class="pct" id="routePct">탈출률 <b>0%</b></div>
  </div>

  <main style="flex:1;display:flex;flex-direction:column;">
    <!-- HOME -->
    <section class="screen active" id="homeScreen">
      <div class="catrow">
        <div class="catimg"><img id="homeCat" alt="고양고양이"></div>
        <div class="bubble" id="homeBubble"></div>
      </div>
      <div class="panel">
        <div class="phead">
          <div style="flex:1;">
            <h2>Heart of English · 기초 영단어</h2>
            <p id="homeMeta">불러오는 중…</p>
          </div>
        </div>
        <div class="grid" id="lessonGrid" style="padding:0 13px 13px;"></div>
      </div>
    </section>

    <!-- LESSON -->
    <section class="screen" id="lessonScreen">
      <div class="panel">
        <div class="phead">
          <button class="iconbtn" id="backHome">‹</button>
          <div style="flex:1;min-width:0;">
            <h2 id="lessonTitle">강</h2>
            <p id="lessonMeta"></p>
          </div>
        </div>
        <div class="exgrid" id="exList"></div>
      </div>
    </section>

    <!-- GAME -->
    <section class="screen" id="gameScreen">
      <div class="panel gtop">
        <div class="gtoprow">
          <div style="min-width:0;">
            <div class="kick" id="gKick">01강</div>
            <div class="gtitle" id="gTitle">Exercise 1</div>
          </div>
          <div class="roundpill" id="gRound">1회독</div>
        </div>
        <div class="bar"><i id="gProg"></i></div>
        <div class="stats">
          <div class="stat"><b id="sDone">0/0</b><span>진행</span></div>
          <div class="stat t-time"><b id="sTime">00:00</b><span>시간</span></div>
          <div class="stat t-err"><b id="sErr">0</b><span>오답</span></div>
          <div class="stat t-lim"><b id="sLim">12초</b><span>제한</span></div>
        </div>
      </div>

      <div class="panel quiz" id="quizCard">
        <p class="meaning" id="meaning">-</p>
        <div class="mhint" id="mHint"></div>
        <div class="hoectx" id="hoeCtx"></div>
        <div class="qmini" id="qmini"></div>
        <div class="timewrap" id="timeWrap"><i id="timeFill"></i></div>
        <div class="qoverlay" id="quizOverlay" aria-live="polite"></div>
      </div>

      <form class="panel inpanel" id="aform" autocomplete="off">
        <input class="ainput" id="ainput" type="text" inputmode="text" enterkeyhint="done"
               autocapitalize="none" autocomplete="off" autocorrect="off" spellcheck="false"
               placeholder="빈칸에 들어갈 영단어…" aria-label="영어 정답">
        <button class="btn" id="submitBtn" type="submit" aria-hidden="true" tabindex="-1">확인</button>
        <div class="fb" id="fb" aria-live="polite"></div>
        <div class="row2">
          <button class="ghost" id="hintBtn" type="button">💡 힌트</button>
          <button class="ghost" id="exitBtn" type="button">연습 선택</button>
        </div>
        <button class="catbtn" id="catSubmit" type="submit" aria-label="확인 (고양고양이 탭)">
          <img id="quizCat" alt="고양고양이">
        </button>
      </form>
    </section>

    <!-- SUMMARY -->
    <section class="screen" id="sumScreen">
      <div class="panel sum">
        <div class="sumcat">
          <div class="cc"><img id="sumCat" alt=""></div>
          <div>
            <h2 id="sumTitle">연습 완료!</h2>
            <p class="meta" id="sumSub" style="margin-top:4px;"></p>
          </div>
        </div>
        <div class="bubble" id="sumBubble" style="border-color:var(--gold2);"></div>
        <div class="sumgrid">
          <div class="sumitem"><b id="sumTime">00:00</b><span>총 수행 시간</span></div>
          <div class="sumitem"><b id="sumAtt">0</b><span>입력 횟수</span></div>
          <div class="sumitem"><b id="sumErr">0</b><span>오답·시간초과</span></div>
          <div class="sumitem"><b id="sumFirst">0%</b><span>첫 시도 정답률</span></div>
        </div>
        <div class="row2">
          <button class="btn" id="nextEx" type="button">다음 연습 ▶</button>
          <button class="ghost" id="sumList" type="button">연습 선택</button>
        </div>
        <button class="ghost" id="retryEx" type="button">이 연습 다시</button>
      </div>
    </section>
  </main>
</div>

<div class="ending" id="ending" aria-hidden="true">
  <div class="ending-card">
    <div class="ec"><img id="endCat" alt="고양고양이"></div>
    <h2 id="endTitle">BIG MOUNTAIN 등정 성공이고양! 🌳</h2>
    <p>단어를 전부 외웠다고양… 진심으로 인정한다고양.<br>가고 싶은 대학을 적어보라고양!</p>
    <form id="endForm" class="ending-form">
      <input id="endInput" type="text" placeholder="예) 가고 싶은 대학 이름" autocomplete="off" maxlength="24">
      <button class="btn" type="submit">쌉가능 받기 ✦</button>
    </form>
    <div id="endResult" class="ending-result"></div>
    <button class="ghost" id="endClose" type="button" style="margin-top:12px;">닫기</button>
  </div>
</div>

<div class="fxlayer" id="fxLayer" aria-hidden="true"></div>
<div class="toast" id="toast"></div>

/* ===== 헷갈리는 유사단어 보조 힌트 (필요한 단어만 등록) =====
   키 = 영어 정답(소문자), 값 = 뜻 아래 시안색으로 뜨는 안내 문구.
   데이터 교체와 무관하게 유지됨. 새 항목은 "단어":"문구", 형식으로 추가. */
const HINTS = {
  "time-honored":"traditional 아님 — ‘오래되어 존중받는’ 뉘앙스라고양",
};
function hintFor(term){return HINTS[(term||"").trim().toLowerCase()]||"";}

/* ===== A) 유사어 감지 → 멘트만 다르게(판정은 그대로 오답) ===== */
function splitGloss(ko){return (ko||"").split(/[,/·]|또는/)
  .map(g=>g.replace(/\(.*?\)/g,"").replace(/\s+/g," ").trim()).filter(g=>g.length>=2);}
const GLOSS=new Map();  // 뜻조각 -> Set(정규화된 영단어)
DATA.forEach(L=>L.exercises.forEach(e=>e.words.forEach(w=>{
  splitGloss(w.ko).forEach(g=>{if(!GLOSS.has(g))GLOSS.set(g,new Set());GLOSS.get(g).add(normalize(w.en));});
})));
function isSynonymMiss(typed,w){
  const g=normalize(typed);if(!g||g===normalize(w.term))return false;
  for(const gl of splitGloss(w.meaning)){const set=GLOSS.get(gl);if(set&&set.has(g))return true;}
  return false;
}
/* 철자 변형(영/미 철자 등) 판별: 같은 단어, 다른 철자 → 정답 처리하되 안내 */
function variantKey(s){return normalize(s).replace(/\s/g,"").replace(/z/g,"s");}
function isSpellingVariant(typed,term){
  const a=variantKey(typed),b=variantKey(term);
  return !!a && a===b && normalize(typed)!==normalize(term);
}
const SYNLINES=[
  "‘{w}’도 한글 뜻은 같다고양. 근데 영어에선 쓰임이 다르다고양 — 여기선 이 단어라고양!",
  "‘{w}’? 뜻은 겹치는데 영어 맥락이 다르다고양. 지문에서 어떻게 쓰였는지 기억하라고양!",
  "한글론 ‘{w}’도 맞다고양. 근데 영어는 단어마다 자리가 있다고양. 이번엔 이 단어라고양!",
  "‘{w}’랑 뜻은 비슷해도 바꿔 쓰면 어색하다고양. 여기선 이 단어라고양!",
];

/* set cat images */

function buildLessons(){

    name:L.name||"",

      title:(ex.scope==='prev'?"이전기출 ":"Exercise ")+ex.ex+(ex.name?" · "+ex.name:""),
      ex:ex.ex, scope:ex.scope||'2026',
      words:ex.words.map(w=>({term:w.en,meaning:w.ko,ex:w.ex,tr:w.tr,c:w.c,ipa:w.ipa,pos:w.pos,word:w.word,si:w.si,sn:w.sn}))
    }))
  }));
}
state.lessons=buildLessons();
function visEx(L){return state.prevOn?L.exercises:L.exercises.filter(e=>e.scope!=='prev');}
function nextLessonIndex(li){for(let i=li+1;i<state.lessons.length;i++){if(visEx(state.lessons[i]).length>0)return i;}return -1;}

/* ===== progress / route ===== */
function loadProgress(){try{return JSON.parse(localStorage.getItem(STORAGE))||{};}catch{return{};}}
function saveProgress(){localStorage.setItem(STORAGE,JSON.stringify(state.progress));}
function getRec(lid,t){return state.progress?.[lid]?.[t]||null;}
function setRec(lid,t,rec){
  state.progress[lid]=state.progress[lid]||{};
  const ex=state.progress[lid][t];
  state.progress[lid][t]={completed:true,bestMs:ex?.bestMs?Math.min(ex.bestMs,rec.timeMs):rec.timeMs,
    lastMs:rec.timeMs,attempts:rec.attempts,errors:rec.errors,first:rec.first};
  saveProgress();
}
function totalExercises(){return state.lessons.reduce((s,L)=>s+visEx(L).length,0);}
function clearedExercises(){
  let n=0;state.lessons.forEach(L=>visEx(L).forEach(ex=>{if(getRec(L.id,ex.title)?.completed)n++;}));return n;
}
function updateRoute(){
  const total=totalExercises(),done=clearedExercises();
  const pct=total?Math.round(done/total*100):0;
  $("#routeFill").style.width=pct+"%";
  $("#routeMarker").style.left=`calc(6px + ${pct}% - ${pct*0.12}px)`;

/* ===== game ===== */
function fmt(ms){const s=Math.max(0,Math.floor(ms/1000));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");}
function limitFor(term){
  const letters=term.replace(/[^a-zA-Z]/g,"").length;
  const words=term.trim().split(/\s+/).filter(Boolean).length;
  return Math.min(45,Math.max(14,Math.round(8+letters*1.6+Math.max(0,words-1)*4)));
}
function normalize(v){
  return v.toLowerCase().replace(/[’‘`´]/g,"'").replace(/[‐‑‒–—−]/g,"-")
    .replace(/&/g," and ").replace(/[~().,!?;:"“”\[\]{}]/g," ").replace(/['’]/g,"")
    .replace(/[-/]/g," ").replace(/\s+/g," ").trim();
}
function isCorrect(inp,ans){
  const g=normalize(inp),t=normalize(ans);if(!g||!t)return false;
  return g===t||g.replace(/\s/g,"")===t.replace(/\s/g,"");
}
function shuffle(a){const c=[...a];for(let i=c.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[c[i],c[j]]=[c[j],c[i]];}return c;}

function startExercise(i){
  const L=state.lessons[state.li],ex=visEx(L)[i];state.ei=i;
  // anti-unfair: same lesson same meaning -> any matching english accepted
  const koToEn={};
  L.exercises.forEach(e=>e.words.forEach(w=>{(koToEn[w.meaning]=koToEn[w.meaning]||new Set()).add(normalize(w.term));}));
  state.session={
    lesson:L,exercise:ex,koToEn,
    words:ex.words.map((w,id)=>({...w,id,attempts:0,corrects:0,errors:0,
      firstWrong:false,wrongEver:false,roundStreak:0,needed:1,passed:false})),
    round:0,roundName:"",queue:[],roundTargets:[],currentId:null,
    cardStart:0,cardLimit:12,totalStart:Date.now(),pausedAt:0,
    attempts:0,errors:0,firstSeen:0,firstCorrect:0,seenSet:new Set(),
    answered:false,fbMode:false,copyMode:false,copyAns:""
  };
  $("#gKick").textContent=L.id;$("#gTitle").textContent=ex.title;
  $("#ainput").value="";$("#fb").className="fb";$("#fb").innerHTML="";
  setCat('quizCat','evil');
  show("game");startRound(1);startTicker();
  toast(pick(LINES.start));
}

function startRound(n){
  const s=state.session;s.round=n;
  if(n===1){
    // 1회독: 전체 단어, 순서대로, 1회 정답이면 통과
    s.words.forEach(w=>{w.roundStreak=0;w.passed=false;w.needed=1;});
    s.roundName="1회독";
    s.roundTargets=s.words.map(w=>w.id);
    s.queue=[...s.roundTargets];
  } else {
    // 2회독 이후: "틀린 적 있고(wrongEver) 아직 통과 못 한" 단어만 대상.
    // -> 한 번도 안 틀린 단어, 이미 2연속 맞혀 통과한 단어는 절대 다시 나오지 않음.
    const targets=s.words.filter(w=>w.wrongEver && !w.passed).map(w=>w.id);
    if(!targets.length){ return finishExercise(); }   // 더 굳힐 단어 없으면 종료
    // 이번 회독 대상 단어들의 연속 정답 카운터만 초기화(통과 상태는 유지)
    targets.forEach(id=>{const w=s.words[id];w.roundStreak=0;w.needed=2;});
    s.roundName=n+"회독";
    s.roundTargets=(n>=3)?shuffle(targets):targets;   // 3회독부터 무작위
    s.queue=[...s.roundTargets];
  }
  $("#gRound").textContent=s.roundName;nextCard();
}

function nextCard(){
  const s=state.session;if(!s)return;
  while(s.queue.length){
    const id=s.queue.shift();const w=s.words[id];
    if(s.round!==1&&w.passed)continue;
    s.currentId=id;s.answered=false;s.fbMode=false;s.copyMode=false;s.copyAns="";
    s.cardLimit=limitFor(w.term);s.cardStart=Date.now();s.hintLevel=0;
    $("#meaning").textContent=w.meaning;
    $("#mHint").style.display="none";
    $("#hoeCtx").innerHTML=hoeCtxHtml(w);
    $("#qmini").textContent = s.round>=2 ? ((w.roundStreak>=1)?"한 번 더 맞히면 통과 (2/2)":"2연속 정답이면 통과 (1/2)") : (w.sn>1?`뜻 ${w.si}/${w.sn} · 빈칸에 들어갈 단어를 입력`:"빈칸에 들어갈 단어를 입력");
    $("#ainput").value="";$("#ainput").className="ainput";$("#ainput").disabled=false;
    $("#submitBtn").disabled=false;$("#hintBtn").disabled=false;
    $("#fb").className="fb";$("#fb").innerHTML="";
    $("#ainput").oninput=null;
    const ov=$("#quizOverlay");ov.className="qoverlay";ov.innerHTML="";
    setCat('quizCat','evil');
    updateStats();
    requestAnimationFrame(()=>$("#ainput").focus({preventScroll:true}));
    return;
  }
  // 회독 종료: 다음 회독으로. startRound가 남은 단어 없으면 알아서 finishExercise 호출.
  startRound(s.round+1);
}

function submit(opt={}){
  const s=state.session;if(!s||s.currentId===null)return;
  if(s.copyMode){submitCopy();return;}
  if(s.answered)return;
  const w=s.words[s.currentId];
  const typed=$("#ainput").value;
  let correct=!opt.forced&&!opt.timeout&&isCorrect(typed,w.term);
  let variantHit=false;
  if(!correct&&!opt.forced&&!opt.timeout&&typed.trim()&&isSpellingVariant(typed,w.term)){correct=true;variantHit=true;}

  s.answered=true;s.fbMode=true;s.attempts++;w.attempts++;
  // first-try accuracy
  if(!s.seenSet.has(w.id)){s.seenSet.add(w.id);s.firstSeen++;if(correct&&s.hintLevel===0&&!opt.timeout)s.firstCorrect++;}
  $("#ainput").disabled=true;$("#submitBtn").disabled=true;$("#hintBtn").disabled=true;

  if(correct){
    w.corrects++;$("#ainput").classList.add("ok");
    applyCorrect(w);fx(true);beep("ok");setCat('quizCat','win');
    const passed=w.passed;
    const line= variantHit ? ("‘"+typed.trim()+"’도 맞다고양! 근데 이 책은 ‘"+w.term+"’로 쓴다고양 ✦")
      : (passed ? ((s.streak||0)>=3?pick(LINES.correctStreak):pick(LINES.correct)) : "정답이라고양! 한 번 더 가자고양.");
    showReveal("good",w,line);
    s.streak=(s.streak||0)+1;
    armReveal(w);
  } else {
    s.errors++;w.errors++;w.wrongEver=true;s.streak=0;
    if(s.round===1)w.firstWrong=true;
    applyWrong(w);fx(false);beep("bad");setCat('quizCat','evil');
    let wline=opt.timeout?pick(LINES.timeout):pick(LINES.wrong);
    if(!opt.timeout&&isSynonymMiss(typed,w))wline=pick(SYNLINES).replace("{w}",typed.trim());
    startCopy(w,wline);
  }
  updateStats();
}
function applyCorrect(w){const s=state.session;if(s.round===1){w.passed=true;return;}
  w.roundStreak++;if(w.roundStreak>=w.needed)w.passed=true;else defer(w.id);}
function applyWrong(w){const s=state.session;if(s.round===1)return;w.roundStreak=0;w.needed=2;defer(w.id);}
function defer(id){const s=state.session;s.queue.splice(Math.min(3,s.queue.length),0,id);}

function slots(n){let x="";for(let i=0;i<(n||3);i++)x+='<span class="slot"></span>';return `<span class="blanks">${x}</span>`;}
function maskBlank(ex,ans){const n=(ans||"").replace(/[^A-Za-z]/g,"").length;return esc(ex||"").split("{{BLANK}}").join(slots(n));}
function fillBlank(ex,ans){return esc(ex||"").split("{{BLANK}}").join(`<b class="fill">${esc(ans)}</b>`);}
function hoeCtxHtml(w){return w.ex?`<div class="ex">${maskBlank(w.ex,w.term)}</div>`:"";}
function catNote(c){return `<div class="ov-c">${esc(c)}</div>`;}
function hoeMid(w){let h="";if(w.ex)h+=`<div class="ov-ex">${fillBlank(w.ex,w.term)}</div>`;if(w.tr)h+=`<div class="ov-tr">${esc(w.tr)}</div>`;return h;}
function revealDelay(w){return w.c?Math.min(15000,Math.round(1900+w.c.length*75)):2200;}
function onRevealKey(e){if(e.key==="Enter"){const s=state.session;if(s&&s.answered&&!s.copyMode){e.preventDefault();doNext();}}}
function doNext(){const s=state.session;if(!s||!s.answered||s.copyMode)return;if(s.revealTimer){clearTimeout(s.revealTimer);s.revealTimer=null;}document.removeEventListener("keydown",onRevealKey);const ov=$("#quizOverlay");if(ov)ov.onclick=null;nextCard();}
function armReveal(w){const s=state.session;s.revealTimer=setTimeout(doNext,revealDelay(w));document.addEventListener("keydown",onRevealKey);const ov=$("#quizOverlay");if(ov)ov.onclick=doNext;}
function fmtIpa(ipa){if(!ipa)return"";return ipa.split(".").map(function(sy){var st=sy.indexOf("ˈ")>=0;var c=sy.replace(/[ˈˌ]/g,"");return st?"<b>"+esc(c)+"</b>":esc(c);}).join("");}
function showReveal(type,w,line){
  const ov=$("#quizOverlay");ov.className="qoverlay show "+(type==="good"?"good":"");
  ov.innerHTML=`<div class="ov-ans">${esc(w.term)}</div>
    ${w.ipa?`<div class="ov-ipa">/${fmtIpa(w.ipa)}/</div>`:""}
    <div class="ov-ko">${esc(w.meaning)}</div>
    ${hoeMid(w)}
    ${w.c?catNote(w.c):`<div class="ov-say">${esc(line)}</div>`}`;
}
function startCopy(w,line){
  const term=w.term;const s=state.session;s.copyMode=true;s.copyAns=term;
  const ov=$("#quizOverlay");ov.className="qoverlay show";
  ov.innerHTML=`<div class="ov-ko">${esc(w.meaning)}</div>
    ${hoeMid(w)}
    ${w.c?catNote(w.c):`<div class="ov-say">${esc(line)}</div>`}
    <div class="ov-hint">뜻·예문 보고 <b>${esc(term)}</b> 따라 쓰면 넘어간다고양</div>
    <div class="ov-ghost" id="ghostTar">${term.split('').map(c=>`<span>${c===' '?'&nbsp;':esc(c)}</span>`).join('')}</div>`;
  $("#ainput").value="";$("#ainput").className="ainput";$("#ainput").disabled=false;
  $("#submitBtn").disabled=false;$("#hintBtn").disabled=true;
  // live highlight on overlay ghost text
  $("#ainput").oninput=()=>{
    const v=$("#ainput").value,t=$("#ghostTar");if(!t)return;
    t.innerHTML=term.split('').map((c,i)=>{const d=c===' '?'&nbsp;':esc(c);
      if(i<v.length)return v[i].toLowerCase()===c.toLowerCase()?`<b>${d}</b>`:`<span class="x">${d}</span>`;
      return `<span>${d}</span>`;}).join('');
    if(isCorrect(v,term)){$("#ainput").oninput=null;submitCopy();}
  };
  requestAnimationFrame(()=>$("#ainput").focus({preventScroll:true}));
}
function submitCopy(){
  const s=state.session;if(!s||!s.copyMode)return;
  if(!isCorrect($("#ainput").value,s.copyAns)){
    const p=$("#quizOverlay");if(p){p.classList.remove("wrong");void p.offsetWidth;p.classList.add("wrong");}
    return;
  }
  s.copyMode=false;s.copyAns="";$("#ainput").oninput=null;
  $("#ainput").disabled=true;$("#submitBtn").disabled=true;
  fx(true);beep("ok");setTimeout(nextCard,650);
}

function giveHint(){
  const s=state.session;if(!s||s.answered)return;const w=s.words[s.currentId];s.hintLevel=(s.hintLevel||0)+1;
  const en=w.term,m=$("#qmini");
  if(s.hintLevel===1)m.innerHTML=`힌트① 첫 글자 <b style="color:var(--gold)">${esc(en[0])}</b> · ${en.replace(/\s/g,'').length}자`;
  else{let pat='';for(let i=0;i<en.length;i++){const ch=en[i];pat+=/[a-zA-Z]/.test(ch)?(i<Math.ceil(en.length/2)?ch:'_'):ch;}
    m.innerHTML=`힌트② <b style="color:var(--gold);letter-spacing:2px">${esc(pat)}</b>`;$("#hintBtn").disabled=true;}
}

function updateStats(){
  const s=state.session;if(!s)return;
  $("#sTime").textContent=fmt(Date.now()-s.totalStart);
  $("#sErr").textContent=s.errors;
  $("#sLim").textContent=remain()+"초";
  const done=roundDone(),total=s.roundTargets.length||s.words.length;
  $("#sDone").textContent=`${done}/${total}`;
  $("#gProg").style.width=(total?Math.round(done/total*100):0)+"%";
  if(!s.fbMode&&s.currentId!==null){
    const left=remain();const pct=Math.max(0,left/s.cardLimit*100);
    const tw=$("#timeWrap");$("#timeFill").style.width=pct+"%";
    tw.className="timewrap"+(pct<25?" danger":(pct<50?" warn":""));
    if(left<=0)submit({timeout:true});
  } else {$("#timeFill").style.width="100%";$("#timeWrap").className="timewrap";}
}
function remain(){const s=state.session;if(!s||s.fbMode)return 0;
  return Math.max(0,Math.ceil(s.cardLimit-(Date.now()-s.cardStart)/1000));}
function roundDone(){const s=state.session;if(!s)return 0;
  if(s.round===1)return s.roundTargets.length-s.queue.length-(s.answered||s.currentId===null?0:1);
  return s.roundTargets.filter(id=>s.words[id].passed).length;}
function startTicker(){stopTicker();state.ticker=setInterval(updateStats,150);}
function stopTicker(){if(state.ticker)clearInterval(state.ticker);state.ticker=null;}

function finishExercise(){
  const s=state.session;if(!s)return;stopTicker();
  const timeMs=Date.now()-s.totalStart;
  const first=s.firstSeen?Math.round(s.firstCorrect/s.firstSeen*100):0;
  setRec(s.lesson.id,s.exercise.title,{timeMs,attempts:s.attempts,errors:s.errors,first});
  // lesson fully cleared?
  const lessonCleared=visEx(s.lesson).every(e=>getRec(s.lesson.id,e.title)?.completed);
  const allCleared=clearedExercises()>=totalExercises();
  $("#sumSub").textContent=`${s.lesson.id} · ${s.exercise.title}`;
  $("#sumTime").textContent=fmt(timeMs);$("#sumAtt").textContent=s.attempts;
  $("#sumErr").textContent=s.errors;$("#sumFirst").textContent=first+"%";
  let line=pick(LINES.exerciseDone),expr='evil';
  if(allCleared){line=pick(LINES.allDone);expr='win';$("#sumTitle").textContent="BIG MOUNTAIN 입성! 🎓";}
  else if(lessonCleared){const _cnt=visEx(s.lesson).reduce((a,e)=>a+e.words.length,0);line=_cnt+"개 단어를 다 확인했다고양! "+(LESSONCLEAR[s.lesson.lesson]||"한 강을 통째로 정복했다고양!");expr='win';$("#sumTitle").textContent=s.lesson.id+" 완전 정복!";}
  else $("#sumTitle").textContent="연습 클리어 ✦";
  if(allCleared)setTimeout(showEnding,750);
  setCat('sumCat',expr);
  $("#sumBubble").innerHTML=`<span><span class="nm">고양고양이</span> ${line}</span>`;
  const L=state.lessons[state.li];const ev=visEx(L);
  const lastInLesson=state.ei>=ev.length-1;const _ni=nextLessonIndex(state.li);
  $("#nextEx").disabled=lastInLesson&&_ni<0;
  $("#nextEx").textContent=lastInLesson&&_ni>=0?"다음 강 ▶":"다음 연습 ▶";
  renderHome();renderExList();show("sum");
}

/* ===== fx + audio ===== */
let actx=null;
function beep(t){if(state.muted)return;try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();
  const o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);
  const n=actx.currentTime;
  if(t==="ok"){o.frequency.setValueAtTime(660,n);o.frequency.setValueAtTime(990,n+.09);}
  else{o.type="sawtooth";o.frequency.setValueAtTime(200,n);o.frequency.setValueAtTime(150,n+.12);}
  g.gain.setValueAtTime(.1,n);g.gain.exponentialRampToValueAtTime(.001,n+.3);o.start(n);o.stop(n+.32);}catch(e){}}
function roseSVG(){return '<svg viewBox="0 0 24 24" aria-hidden="true">'+
  '<g stroke-linejoin="round" stroke-linecap="round">'+
  '<path d="M12 22c0-4 0-6 0-9" fill="none" stroke="#4faf68" stroke-width="2"/>'+
  '<path d="M12 17c-3-2-5-1-6 1 2 1.5 4.5 1 6-1z" fill="#5fbf7a" stroke="#fff" stroke-width=".8"/>'+
  '<path d="M12 6.5c4.2-2.5 8.2.8 7 4.8-.6 3.4-3.6 5.2-7 5.2s-6.4-1.8-7-5.2c-1.2-4 2.8-7.3 7-4.8z" fill="#e8327f" stroke="#fff" stroke-width="1.2"/>'+
  '<path d="M12 8c2.8-1.3 5 .8 4.2 3.4-.5 2.3-2.4 3.4-4.2 3.4s-3.7-1.1-4.2-3.4C7 8.8 9.2 6.7 12 8z" fill="#ff5fa8"/>'+
  '<path d="M12 9.4c1.8-.6 3 .8 2.4 2.4-.4 1.4-1.5 2-2.4 2s-2-.6-2.4-2c-.6-1.6.6-3 2.4-2.4z" fill="#ff95cc"/>'+
  '<path d="M12 10.8c.9 0 1.5.8 1.1 1.7-.3.7-.8 1-1.1 1s-.8-.3-1.1-1c-.4-.9.2-1.7 1.1-1.7z" fill="#ffd34d"/>'+
  '<path d="M9.6 11.4c.5-1.4 2-2.2 3.4-1.8" fill="none" stroke="#b81e5e" stroke-width="1"/>'+
  '</g></svg>';}
function heartSVG(){return '<svg viewBox="0 0 24 24" aria-hidden="true">'+
  '<path d="M12 21C5 16 3 12 3 8.5 3 6 5 4 7.5 4 9.4 4 11 5.2 12 7c1-1.8 2.6-3 4.5-3C19 4 21 6 21 8.5 21 12 19 16 12 21z" '+
  'fill="#ff4fa3" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/>'+
  '<path d="M9 8c-1 0-1.6.7-1.6 1.6" fill="none" stroke="#ffd0e7" stroke-width="1.6" stroke-linecap="round"/>'+
  '</svg>';}
function bigHeartSVG(){return '<svg viewBox="0 0 100 100" aria-hidden="true">'+
  '<defs>'+
  '<radialGradient id="hgrad" cx="50%" cy="42%" r="62%">'+
  '<stop offset="0%" stop-color="#ffffff"/><stop offset="35%" stop-color="#ff9ed4"/>'+
  '<stop offset="70%" stop-color="#ff4fa3"/><stop offset="100%" stop-color="#d6248a"/>'+
  '</radialGradient>'+
  '<radialGradient id="hhalo" cx="50%" cy="50%" r="50%">'+
  '<stop offset="0%" stop-color="#ff8ac6" stop-opacity=".55"/><stop offset="100%" stop-color="#ff8ac6" stop-opacity="0"/>'+
  '</radialGradient></defs>'+
  '<circle cx="50" cy="50" r="48" fill="url(#hhalo)"/>'+
  '<path d="M50 86 C18 64 8 48 8 33 C8 20 18 12 30 12 C39 12 46 17 50 25 C54 17 61 12 70 12 C82 12 92 20 92 33 C92 48 82 64 50 86 Z" fill="url(#hgrad)" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>'+
  '<path d="M34 28 C28 30 25 36 26 42" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".85"/>'+
  '</svg>';}
function fx(good){
  const card=$("#quizCard"),layer=$("#fxLayer");if(!card)return;
  layer.innerHTML="";const r=card.getBoundingClientRect();
  const x=r.left+r.width/2,y=r.top+r.height/2;
  layer.style.setProperty("--x",x+"px");layer.style.setProperty("--y",y+"px");
  document.body.classList.add("shake");card.classList.remove("flash");void card.offsetWidth;card.classList.add("flash");
  if(good){
    // big radiant HEART burst at center (light source)
    const hb=document.createElement("div");hb.className="heartburst";
    hb.style.setProperty("--x",x+"px");hb.style.setProperty("--y",y+"px");
    hb.innerHTML=bigHeartSVG();layer.appendChild(hb);
    // ROSES rain out around it (Ilsan rose festival)
    const N=14;
    for(let i=0;i<N;i++){const sp=document.createElement("span");sp.className="spark";
      sp.innerHTML=roseSVG();
      sp.style.setProperty("--glow","#ff4fa3");
      sp.style.setProperty("--x",x+"px");sp.style.setProperty("--y",y+"px");
      sp.style.setProperty("--sz",(45+Math.random()*50)+"px");
      const a=Math.PI*2*i/N + (Math.random()-.5)*0.5;
      const d=130+Math.random()*210;
      sp.style.setProperty("--dx",Math.cos(a)*d+"px");
      sp.style.setProperty("--dy",(Math.sin(a)*d + 40)+"px"); // bias downward = rain
      sp.style.setProperty("--rot",(Math.random()*720-360)+"deg");
      sp.style.animationDuration=(1.15+Math.random()*.8)+"s";
      sp.style.animationDelay=(.1+Math.random()*.22)+"s"; // start after heart pops
      layer.appendChild(sp);}
  }
  setTimeout(()=>{layer.innerHTML="";card.classList.remove("flash");document.body.classList.remove("shake");},1100);
}

/* ===== misc ===== */
function esc(v){return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");
  clearTimeout(state.toastT);state.toastT=setTimeout(()=>t.classList.remove("show"),2000);}

/* events */
$("#aform").addEventListener("submit",e=>{e.preventDefault();submit();});
$("#hintBtn").addEventListener("click",giveHint);
$("#exitBtn").addEventListener("click",()=>{stopTicker();state.session=null;renderExList();show("lesson");});
$("#backHome").addEventListener("click",()=>{renderHome();show("home");});
$("#sumList").addEventListener("click",()=>{state.session=null;renderExList();show("lesson");});
$("#retryEx").addEventListener("click",()=>startExercise(state.ei));
$("#nextEx").addEventListener("click",()=>{const L=state.lessons[state.li];const ev=visEx(L);
  if(state.ei<ev.length-1){startExercise(state.ei+1);return;}
  const ni=nextLessonIndex(state.li);if(ni>=0){state.li=ni;openLesson(ni);startExercise(0);}});
$("#muteBtn").addEventListener("click",()=>{state.muted=!state.muted;$("#muteBtn").textContent=state.muted?"🔇":"🔊";});
$("#resetBtn").addEventListener("click",()=>{if(!confirm("저장된 클리어 기록을 모두 지울까요?"))return;
  state.progress={};saveProgress();renderHome();toast("기록을 초기화했다고양.");});
document.addEventListener("visibilitychange",()=>{const s=state.session;if(!s)return;
  if(document.hidden)s.pausedAt=Date.now();
  else if(s.pausedAt){const p=Date.now()-s.pausedAt;s.totalStart+=p;s.cardStart+=p;s.pausedAt=0;}});

$("#prevBtn")?.addEventListener("click",()=>{state.prevOn=!state.prevOn;localStorage.setItem(MODEKEY,state.prevOn?'1':'0');
  syncPrevBtn();renderExList&&0;toast(state.prevOn?"이전 기출까지 켰다고양?! 독해진다고양 😼":"2026만 본다고양. 가볍게 가자고양.");renderHome();});
function syncPrevBtn(){const b=$("#prevBtn");if(!b)return;b.textContent=state.prevOn?"전체":"2026";b.style.borderColor=state.prevOn?"var(--gold)":"var(--line)";b.style.color=state.prevOn?"var(--gold)":"#fff";}
syncPrevBtn();
/* ===== ending (100%) ===== */
const UNIKEY="goyang-hoe-uni-v1";
function showEnding(){
  setCat('endCat','win');
  let saved="";try{saved=localStorage.getItem(UNIKEY)||"";}catch(e){}
  const f=$("#endForm"),r=$("#endResult");
  f.style.display="flex";$("#endInput").value=saved;
  r.style.display="none";r.innerHTML="";
  const ov=$("#ending");ov.classList.add("show");ov.setAttribute("aria-hidden","false");
  requestAnimationFrame(()=>$("#endInput").focus({preventScroll:true}));
}
function revealEnding(uni){
  uni=(uni||"").trim();if(!uni)return;
  try{localStorage.setItem(UNIKEY,uni);}catch(e){}
  $("#endForm").style.display="none";
  const r=$("#endResult");r.style.display="block";
  const u=`<span class="nm">${esc(uni)}</span>`;
  r.innerHTML=pick([
    `${u} 쌉가능이고양! 🎓<br>넌 무조건 잘 될 고양.<br>일산에서 만난 거 잊지 말라고양 ✦`,
    `축하한다고양… ${u} 쌉가능이고양.<br>나도 인간일 때는 대학 갔었다고양… 03학번… ㅇㅅㅊ…<br>흠흠, 아니다고양. 축하한다고양.. ✦`,
    `${u}… 잘 어울린다고양.<br>나도 한때는 사람이었다고양. 지금은 강사… 아니 고양이지만양…<br>아무튼 축하한다고양! 🎓`,
  ])+`<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:1rem;font-weight:700;color:var(--muted);line-height:1.65;">…근데 있잖냐고양. 🌳<br>네가 오른 이 <b style="color:var(--gold)">BIG MOUNTAIN</b>, 사실은 진짜 <b style="color:var(--gold)">일산</b>이었다고양.<br>一山(하나의 산)이라 잘못 불렸지만, 원래 이름은 <b style="color:var(--gold)">한뫼</b>, '큰 산'이라고양.<br>넌 일산을 떠난 게 아니라 원래 크기의 일산으로 올라온 거라고양.<br>네가 되고 싶던 것도 결국 더 커진 <b style="color:var(--gold)">너 자신</b>이었다고양 🐾</div>`;
  $("#endTitle").textContent="합격이라고양! 🎓";
  beep("ok");
}
$("#endForm").addEventListener("submit",e=>{e.preventDefault();revealEnding($("#endInput").value);});
$("#endClose").addEventListener("click",()=>{const ov=$("#ending");ov.classList.remove("show");ov.setAttribute("aria-hidden","true");});
document.querySelector(".maproute").addEventListener("click",()=>{
  if(totalExercises()>0 && clearedExercises()>=totalExercises()) showEnding();
});
renderHome();
</script>
