<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#160826">
<title>고양이 단어장 ✦ 교재 선택</title>
<style>
:root{
  --bg1:#160826; --bg2:#2a0c40; --bg3:#3a1054;
  --ink:#ffffff; --muted:#cdbcef;
  --panel:#1d0c2e; --panel2:#26103a;
  --line:#5a2d7a;
  --pink:#ff4fa3; --pink2:#ff8ac6; --pinkpale:#ffd0e7;
  --cyan:#5ce6ff; --mint:#7cffb2; --gold:#ffd34d; --gold2:#f5b301;
  --radius:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;margin:0;}
body{
  font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 16% 14%, rgba(255,79,163,.30), transparent 30%),
    radial-gradient(circle at 84% 10%, rgba(92,230,255,.16), transparent 26%),
    radial-gradient(circle at 78% 84%, rgba(124,255,178,.10), transparent 26%),
    linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 60%, var(--bg3) 100%);
  background-attachment:fixed; overflow-x:hidden; min-height:100dvh;
}
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    radial-gradient(2px 2px at 20% 30%,#fff,transparent),
    radial-gradient(2px 2px at 70% 80%,#fff,transparent),
    radial-gradient(1px 1px at 40% 60%,var(--gold),transparent),
    radial-gradient(1px 1px at 85% 22%,var(--cyan),transparent),
    radial-gradient(2px 2px at 12% 82%,var(--pink2),transparent),
    radial-gradient(1px 1px at 52% 12%,#fff,transparent),
    radial-gradient(2px 2px at 34% 88%,var(--pink),transparent);
  opacity:.7;animation:tw 3s steps(2) infinite;
}
@keyframes tw{50%{opacity:.3;}}
.wrap{position:relative;z-index:1;width:min(100%,560px);margin:0 auto;min-height:100dvh;
  display:flex;flex-direction:column;justify-content:center;gap:20px;
  padding:max(28px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom));}
.hero{text-align:center;}
.hero .spark{font-size:1.5rem;letter-spacing:6px;color:var(--gold);
  text-shadow:0 0 14px rgba(255,211,77,.6);}
.hero h1{margin:.25rem 0 .35rem;font-size:1.7rem;line-height:1.18;letter-spacing:-.4px;
  text-shadow:0 0 16px rgba(255,79,163,.5);}
.hero h1 b{color:var(--gold);}
.hero p{margin:0;color:var(--muted);font-size:.95rem;font-weight:600;}
.cards{display:flex;flex-direction:column;gap:15px;}
.card{display:block;text-decoration:none;color:inherit;position:relative;
  border:2px solid var(--line);border-radius:var(--radius);
  background:linear-gradient(135deg,rgba(255,255,255,.06),transparent 45%),var(--panel);
  padding:18px 18px 17px;box-shadow:0 0 26px rgba(255,79,163,.16), inset 0 0 22px rgba(255,138,198,.05);
  transition:transform .15s ease, box-shadow .2s ease, border-color .2s ease;overflow:hidden;}
.card::after{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;}
.card:hover{transform:translateY(-3px);border-color:var(--accent);
  box-shadow:0 8px 30px rgba(0,0,0,.4), 0 0 30px var(--glow);}
.card:active{transform:translateY(0);}
.card .kick{display:inline-block;font-size:.72rem;font-weight:800;letter-spacing:.4px;
  color:#160826;background:var(--accent);padding:3px 9px;border-radius:99px;margin-bottom:9px;}
.card h2{margin:0 0 5px;font-size:1.32rem;line-height:1.15;letter-spacing:-.3px;}
.card .meta{margin:0;color:var(--muted);font-size:.9rem;font-weight:700;}
.card .meta b{color:var(--accent);}
.card .go{position:absolute;right:16px;bottom:14px;font-size:1.5rem;color:var(--accent);
  text-shadow:0 0 10px var(--glow);}
.ksat{--accent:var(--pink2);--glow:rgba(255,79,163,.45);}
.ksat::after{background:linear-gradient(180deg,var(--pink),var(--gold));}
.ebs{--accent:var(--cyan);--glow:rgba(92,230,255,.40);}
.ebs::after{background:linear-gradient(180deg,var(--cyan),var(--mint));}
.gye{--accent:var(--gold);--glow:rgba(255,211,77,.42);}
.gye::after{background:linear-gradient(180deg,var(--gold),var(--pink2));}
.foot{text-align:center;color:var(--muted);font-size:.78rem;opacity:.8;line-height:1.5;}
.foot b{color:var(--pink2);}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="spark">✦ ✦ ✦</div>
    <h1>꽃과 단어의 도시를<br><b>벗어나고양!</b></h1>
    <p>어떤 교재로 공부할지 골라보라고양 🐾</p>
  </div>

  <div class="cards">
    <a class="card ksat" href="vocagoyangksat2027.html">
      <span class="kick">수능 대비</span>
      <h2>마더텅 영어독해 2027</h2>
      <p class="meta"><b>17강</b> · 521세트 · <b>6,498단어</b></p>
      <span class="go">›</span>
    </a>

    <a class="card ebs" href="vocagoyangebs2027.html">
      <span class="kick">내신 · 수행평가</span>
      <h2>EBS 수능특강 영어독해</h2>
      <p class="meta"><b>4강</b> · 48세트 · <b>597단어</b></p>
      <span class="go">›</span>
    </a>

    <a class="card gye" href="vocagoyanggye2027.html">
      <span class="kick">고양예고 · 기말대비</span>
      <h2>고양예고 2-1 기말대비</h2>
      <p class="meta"><b>3과·4과·모의고사</b> · <b>945단어</b></p>
      <span class="go">›</span>
    </a>
  </div>

  <div class="foot">
    한글 뜻을 보고 영어 단어를 맞히는 단어장 게임이라고양 ✦<br>
    일산에서 서울까지, 단어로 탈출하라고양!
  </div>
</div>
</body>
</html>
