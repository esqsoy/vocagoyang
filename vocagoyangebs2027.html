<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#160826">
<title>EBS · 벗어나고양!</title>
<style>
:root{
  --bg1:#160826; --bg2:#2a0c40; --bg3:#3a1054;
  --ink:#ffffff; --muted:#c6bcdd;        /* 번역·라벨: 채도 .61→.33, 명암비 10.2:1 */
  --panel:#1d0c2e; --panel2:#26103a;
  --line:#6f3c95;                        /* 경계 명암비 1.83→2.41:1 */
  --pink:#ff4fa3; --pink2:#ff8ac6; --pinkpale:#f6e2ec;   /* 예문: 채도 1.00→.53, 명암비 14.9:1 */
  --cyan:#5ce6ff; --cyansoft:#a5dfef; --mint:#7cffb2; --gold:#ffd34d; --gold2:#f5b301;
  --bad:#ff5d6c; --bad2:#ff8a94;         /* 테두리는 --bad, 글자는 읽기 쉬운 --bad2 */
  --radius:14px;
  --shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;margin:0;}
body{
  font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 16% 14%, rgba(255,79,163,.30), transparent 30%),
    radial-gradient(circle at 84% 10%, rgba(92,230,255,.16), transparent 26%),
    radial-gradient(circle at 78% 84%, rgba(124,255,178,.10), transparent 26%),
    linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 60%, var(--bg3) 100%);
  background-attachment:fixed;
  overflow-x:hidden;
}
/* starfield */
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    radial-gradient(2px 2px at 20% 30%,#fff,transparent),
    radial-gradient(2px 2px at 70% 80%,#fff,transparent),
    radial-gradient(1px 1px at 40% 60%,var(--gold),transparent),
    radial-gradient(1px 1px at 85% 22%,var(--cyan),transparent),
    radial-gradient(2px 2px at 12% 82%,var(--pink2),transparent),
    radial-gradient(1px 1px at 52% 12%,#fff,transparent),
    radial-gradient(2px 2px at 34% 88%,var(--pink),transparent);
  opacity:.7;animation:tw 3s steps(2) infinite;
}
@keyframes tw{50%{opacity:.3;}}
button,input{font:inherit;}
.app{position:relative;z-index:1;width:min(100%,560px);min-height:100dvh;margin:0 auto;
  padding:max(10px,env(safe-area-inset-top)) 13px max(14px,env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:12px;}

/* ---------- header / map ---------- */
.appbar{display:flex;align-items:center;gap:10px;}
.appbar h1{margin:0;font-size:clamp(.86rem,3.9vw,1.12rem);line-height:1.2;letter-spacing:-.4px;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.appbar h1 b{color:var(--gold);}
.appbar .spacer{flex:1;}
.iconbtn{width:40px;height:40px;border-radius:11px;border:2px solid var(--line);
  background:var(--panel2);color:#fff;font-size:1.05rem;cursor:pointer;display:grid;place-items:center;}
.iconbtn:active{transform:translateY(1px);}
.appbar > .iconbtn{flex-shrink:0;}
.course-home{text-decoration:none;}
.course-home svg{display:block;width:20px;height:20px;}
.course-home:focus-visible{outline:2px solid var(--gold);outline-offset:3px;}
body.playing .course-home{display:none;}

/* map progress (Ilsan -> Seoul) */
.maproute{order:5;border:2px solid var(--line);border-radius:var(--radius);background:
   linear-gradient(135deg,rgba(255,255,255,.05),transparent 40%),var(--panel);
  box-shadow:var(--shadow);padding:11px 13px 13px;}
.maproute .ends{display:flex;justify-content:space-between;font-size:.74rem;font-weight:800;
  color:var(--muted);margin-bottom:7px;}
.maproute .ends .seoul{color:var(--gold);}
.track{position:relative;height:20px;}
.track .rail{position:absolute;top:50%;left:6px;right:6px;height:6px;transform:translateY(-50%);
  border-radius:99px;background:#3a1f55;overflow:hidden;
}
.track .rail i{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--cyan),var(--mint),var(--gold),var(--pink2),var(--pink));
  transition:width .5s cubic-bezier(.2,1,.3,1);}
.track .marker{position:absolute;top:50%;left:0;width:24px;height:24px;transform:translate(-50%,-50%);
  transition:left .5s cubic-bezier(.2,1,.3,1);z-index:2;}
.track .marker img{width:100%;height:auto;image-rendering:pixelated;
  filter:drop-shadow(0 0 5px rgba(255,79,163,.6));}
.track .pin{position:absolute;top:50%;width:11px;height:11px;border-radius:50%;
  transform:translate(-50%,-50%);background:#2a0a3a;border:2px solid var(--line);}
.track .pin.lit{background:var(--gold);border-color:var(--gold2);}
.maproute .pct{margin-top:8px;text-align:center;font-size:.78rem;color:var(--muted);}
.maproute .pct b{color:var(--gold);}

/* ---------- cat companion bubble (home) ---------- */
.catrow{display:grid;grid-template-columns:auto 1fr;gap:11px;align-items:end;
  border:2px solid var(--line);border-radius:var(--radius);
  background:linear-gradient(135deg,rgba(255,255,255,.05),transparent 40%),var(--panel);
  box-shadow:var(--shadow);padding:12px;}
.catimg{width:clamp(78px,21vw,104px);}
.catimg img{width:100%;height:auto;image-rendering:pixelated;display:block;
  filter:drop-shadow(0 0 8px rgba(255,255,255,.7)) drop-shadow(0 0 16px rgba(255,79,163,.4));
  animation:bob 2.6s ease-in-out infinite;}
@keyframes bob{50%{transform:translateY(-4px) rotate(-1deg);}}
.bubble{position:relative;border:2px solid var(--pink2);border-radius:12px;padding:11px 13px;
  background:rgba(34,16,58,.96);font-size:clamp(.86rem,3.6vw,1.02rem);line-height:1.5;
  min-height:3em;display:flex;align-items:center;}
.bubble::before{content:"";position:absolute;left:-9px;bottom:18px;width:15px;height:15px;
  background:rgba(34,16,58,.96);border-left:2px solid var(--pink2);border-bottom:2px solid var(--pink2);
  transform:rotate(45deg);}
.bubble .nm{color:var(--pink2);font-weight:900;}

/* ---------- screens ---------- */
.screen{display:none;flex-direction:column;gap:12px;flex:1;animation:lift .18s ease-out;}
.screen.active{display:flex;}
/* game: 플레이 중엔 상단바·지도 숨김, 입력 띠 → 카드 → 진행 패널 */
body.playing .appbar,body.playing .maproute{display:none;}
body.playing::before{animation:none;opacity:.45;}   /* 별 깜빡임 정지 */
body.playing .app{gap:8px;padding:max(6px,env(safe-area-inset-top)) 6px max(8px,env(safe-area-inset-bottom));}
#gameScreen{gap:8px;}
@keyframes lift{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

.panel{border:2px solid var(--line);border-radius:var(--radius);
  background:linear-gradient(135deg,rgba(255,255,255,.05),transparent 42%),var(--panel);
  box-shadow:var(--shadow);}
.phead{display:flex;align-items:center;gap:10px;padding:13px;}
.phead h2{margin:0;font-size:1.05rem;}
.phead p{margin:3px 0 0;color:var(--muted);font-size:.82rem;}

/* lesson + exercise grids */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;align-items:start;}
.lessonbtn,.exbtn{border:2px solid var(--line);border-radius:12px;cursor:pointer;color:#fff;
  text-align:left;padding:13px;display:flex;flex-direction:column;gap:9px;
  background:linear-gradient(160deg,#3a1555,#26103a 62%,#170824);
  transition:transform .12s,border-color .12s;}
.lessonbtn:active,.exbtn:active{transform:translateY(1px);}
.lessonbtn:hover,.exbtn:hover{border-color:var(--pink);}
.lessonbtn .t,.exbtn .t{font-size:1.18rem;font-weight:900;}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;
  color:var(--muted);font-size:.78rem;}
.bar{height:7px;border-radius:99px;background:#2a1340;overflow:hidden;
  border:1px solid rgba(184,168,255,.25);}
.bar i{display:block;height:100%;width:0;border-radius:99px;
  background:#9b59cd;
  transition:width .3s;}
.lessonbtn{padding:9px 11px !important;gap:5px !important;}
.lessonbtn .lh{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;line-height:1.12;}
.lessonbtn .lid{font-size:1rem;font-weight:900;color:#fff;}
.lessonbtn .lname{font-size:.8rem;font-weight:700;color:var(--pink2);letter-spacing:-.3px;}
.lessonbtn .lmeta{font-size:.72rem;color:var(--muted);}
.lessonbtn .lmeta b{color:var(--gold);}
.lessonbtn.done{border-color:var(--gold2);}
.lessonbtn.morph{border-color:#2f7d95;background:linear-gradient(160deg,#153a4d,#1a1d3a 62%,#170824);}
.lessonbtn.morph .lname{color:var(--cyan);}
.lessonbtn .lbar{height:4px;margin-top:2px;}
.btn.resume{margin:0 13px 10px;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1.15;}
.btn.resume small{font-weight:800;font-size:.76rem;opacity:.85;}
.btn.resume[hidden]{display:none;}
.exgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;padding:0 13px 13px;}
.exbtn .done{color:var(--gold);font-weight:800;}
.exbtn.cleared{border-color:var(--gold2);}
.exbtn.cleared::after{content:"★";color:var(--gold);position:absolute;}

/* ---------- game ---------- */
.gtop{display:grid;gap:8px;padding:9px 12px;}
.gtoprow{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.gtl{display:flex;align-items:baseline;gap:6px;min-width:0;}
.kick{color:var(--ink);font-size:.74rem;font-weight:900;flex:none;}
.gtitle{font-size:.86rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);}
.gstat{display:flex;align-items:center;gap:8px;flex:none;font-size:.82rem;}
.gstat b{font-weight:900;} .gstat .t-time{color:var(--cyansoft);font-variant-numeric:tabular-nums;} .gstat .t-err{color:var(--bad2);}
.gstat .t-err i{font-style:normal;color:var(--muted);font-weight:700;font-size:.72rem;}
.roundpill{flex:none;color:var(--muted);font-weight:800;font-size:.82rem;}
.grow2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.ghost.small{min-height:36px;font-size:.82rem;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;gap:6px;}
.spk{display:inline-block;vertical-align:middle;color:var(--pink2);}
/* quiz card: 예문이 주인공 */
.quiz{flex:0 0 auto;display:flex;flex-direction:column;justify-content:flex-start;gap:8px;
  padding:12px 10px 14px;gap:10px;position:relative;overflow:hidden;isolation:isolate;transition:border-color .2s,box-shadow .2s;}
.quiz.good{border-color:var(--mint);}
.quiz.bad{border-color:var(--bad);}
/* 공개 화면: 이미 답한 뜻 줄은 작게(자리를 해설에 넘긴다), 작은 폰에서 넘치면 카드가 스크롤 */
.quiz.good,.quiz.bad{overflow-y:auto;}
.quiz.good .meaning,.quiz.bad .meaning{font-size:clamp(1.2rem,5.3vw,1.45rem);} /* 공개 순간 뜻이 16px 내려앉던 것을 줄였다. 완전히 같게 두면 해설 자리가 모자란다 */
.quiz.wrong{animation:sh .3s;}
.cstreak{color:var(--gold);font-weight:900;}
.exwrap{position:relative;min-height:44px;}
.hform{position:absolute;inset:0;z-index:2;}
.hform #submitBtn,.hform .fb{display:none;}
.quiz .ainput{position:absolute;inset:0;width:100%;height:100%;min-height:0;opacity:0;font-size:16px;border:0;border-radius:0;padding:0;margin:0;
  background:transparent;color:transparent;caret-color:transparent;box-shadow:none;-webkit-user-select:text;user-select:text;}
.quiz .ainput:focus{box-shadow:none;border:0;}
.input-help{margin:0;color:var(--gold);font-size:.82rem;line-height:1.45;text-align:center;}
.input-focus{align-self:center;}
.input-focus[hidden]{display:none;}
/* 뜻(문제)은 카드 폭을 통째로 쓴다. 전에는 💡와 고양이 사이에 끼어 69%(245px)만 써서
   390px 폭에서 26%가 두 줄로 쪼개졌다 — 지금은 6%. 한글 뜻은 어절 단위로 끊겨
   줄이 좁을수록 읽는 리듬이 끊기고, 줄 수가 문제마다 달라져 카드 높이도 요동쳤다. */
.trow{display:flex;align-items:center;gap:10px;}
.time-slot{flex:1;min-width:0;display:grid;align-items:center;}
.time-slot>*{grid-area:1/1;}
.trow .timewrap{width:100%;min-width:0;}
.cat-speech{position:relative;z-index:1;margin:0;padding:7px 9px;
  border:1px solid var(--pink2);border-radius:10px;background:var(--panel2);
  color:var(--pink2);font-size:clamp(.85rem,3.5vw,.98rem);font-weight:800;line-height:1.45;
  text-align:center;word-break:keep-all;overflow-wrap:anywhere;pointer-events:none;}
.cat-speech[hidden]{display:none;}
.cat-speech::after{content:"";position:absolute;right:-5px;top:calc(50% - 4px);
  width:8px;height:8px;background:var(--panel2);border-top:1px solid var(--pink2);
  border-right:1px solid var(--pink2);transform:rotate(45deg);}
.quiz.good .cat-speech{color:var(--mint);border-color:var(--mint);}
.quiz.good .cat-speech::after{border-color:var(--mint);}
.trow .ibtn{flex:none;width:44px;min-height:44px;font-size:1.05rem;padding:0;display:grid;place-items:center;line-height:1;}
.trow .catbtn{flex:none;height:46px;}
.meaning{margin:0;text-align:center;font-weight:900;line-height:1.2;word-break:keep-all;
  font-size:clamp(1.55rem,7vw,2.2rem);
  position:relative;z-index:1;}
.qmini{position:relative;z-index:1;text-align:center;color:var(--muted);font-size:.92rem;min-height:1.1em;}
.qmini:empty{display:none;}
.timewrap{position:relative;z-index:1;height:8px;border-radius:99px;background:#2a1340;overflow:hidden;
  border:1px solid rgba(184,168,255,.25);}
.qoverlay{position:absolute;inset:0;z-index:5;display:none;flex-direction:column;justify-content:flex-start;
  align-items:center;gap:8px;padding:14px 16px;border-radius:inherit;text-align:center;overflow:auto;
  background:linear-gradient(160deg,rgba(38,16,58,.97),rgba(22,8,38,.98));animation:ovin .18s ease-out;}
.qoverlay.show{display:flex;}
.qoverlay.good{background:linear-gradient(160deg,rgba(20,44,30,.96),rgba(14,30,22,.98));}
@keyframes ovin{from{opacity:0;transform:scale(.97);}to{opacity:1;transform:scale(1);}}
.ov-cat{width:clamp(46px,12vw,64px);}
.ov-cat img{width:100%;image-rendering:pixelated;filter:drop-shadow(0 0 7px rgba(255,79,163,.5));}
.ov-say{color:var(--pink2);font-weight:900;font-size:clamp(.92rem,4vw,1.12rem);line-height:1.35;}
.qoverlay.good .ov-say{color:var(--mint);}
.ov-ans{color:var(--gold);font-weight:900;line-height:1.08;font-size:clamp(1.8rem,9vw,3rem);
  overflow-wrap:anywhere;}
.ov-ko{color:var(--muted);font-size:.84rem;}
.ov-ghost{font-family:ui-monospace,monospace;font-size:clamp(1.5rem,8vw,2.4rem);font-weight:900;
  letter-spacing:2px;word-break:break-all;color:#6a4c86;}
.ov-ghost b{color:var(--mint);} .ov-ghost .x{color:var(--bad);}
.ov-hint{color:var(--muted);font-size:.78rem;}
.qoverlay.wrong{animation:sh .3s;}
.timewrap i{display:block;height:100%;width:100%;border-radius:99px;background:#b8a2d4;
  transition:width .15s linear, background .3s;}
.timewrap.warn i{background:#b8a2d4;} .timewrap.danger i{background:#b97882;}

/* input strip */
.inpanel{padding:7px 8px;display:flex;gap:7px;align-items:center;}
.inpanel .ainput{flex:1;}
.inpanel #submitBtn{display:none;}
.inpanel .fb{display:none;}
.ibtn{min-height:44px;width:44px;padding:0;font-size:1.15rem;flex:none;}
.catbtn{background:none;border:0;padding:0 2px;cursor:pointer;height:46px;flex:none;
  display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;}
.catbtn img{height:100%;width:auto;image-rendering:pixelated;display:block;
  filter:drop-shadow(0 0 8px rgba(255,255,255,.6)) drop-shadow(0 0 14px rgba(255,79,163,.4));
  animation:bob 2.6s ease-in-out infinite;}
.catbtn:active{transform:translateY(2px);}
.ainput{min-width:0;min-height:44px;border:2px solid var(--line);border-radius:11px;background:#160a24;
  color:var(--muted);padding:0 12px;font-size:1rem;letter-spacing:.4px;outline:none;caret-color:var(--gold);
  box-shadow:inset 0 0 12px rgba(0,0,0,.55);}
.ainput:focus{border-color:var(--pink2);}
.ainput.ok{border-color:var(--mint);} .ainput.bad{border-color:var(--bad);animation:sh .35s;}
@keyframes sh{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}50%{transform:translateX(6px);}75%{transform:translateX(-4px);}}
.btn{min-height:56px;border-radius:11px;border:2px solid var(--gold2);cursor:pointer;font-weight:900;
  padding:0 18px;background:linear-gradient(180deg,#ffe06b,#e0a92a 60%,#7d4f06);color:#1a0820;
  box-shadow:0 4px 0 #4a2d06;}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #4a2d06;}
.btn:disabled{opacity:.5;}
.ghost{min-height:44px;border-radius:11px;border:2px solid var(--line);background:var(--panel2);color:#fff;
  cursor:pointer;font-weight:800;padding:0 12px;}
.ghost:active{transform:translateY(1px);}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}

/* feedback / copy mode */
.fb{display:none;border:2px solid var(--line);border-radius:12px;background:var(--panel2);padding:12px;}
.fb.show{display:block;}
.fb.good{border-color:var(--mint);background:rgba(124,255,178,.08);}
.fb.bad{border-color:var(--bad);background:rgba(255,93,108,.08);}
.reveal{display:block;text-align:center;color:var(--gold);font-weight:900;line-height:1.1;
  font-size:clamp(2rem,11vw,4.4rem);overflow-wrap:anywhere;
}
.reveal small{display:block;font-size:.9rem;color:var(--muted);margin-top:6px;text-shadow:none;letter-spacing:0;}
.copywrap{display:grid;grid-template-columns:auto 1fr;gap:11px;align-items:center;}
.copywrap .cc{width:clamp(64px,17vw,90px);}
.copywrap .cc img{width:100%;image-rendering:pixelated;filter:drop-shadow(0 0 7px rgba(255,79,163,.5));}
.copybox{min-width:0;}
.copybox .say{color:var(--pink2);font-weight:900;margin-bottom:6px;font-size:.92rem;}
.ghosttar{font-family:ui-monospace,monospace;font-size:clamp(1.5rem,8vw,2.6rem);font-weight:900;
  letter-spacing:2px;word-break:break-all;color:#6a4c86;}
.ghosttar b{color:var(--mint);} .ghosttar .x{color:var(--bad);}
.copyhint{color:var(--muted);font-size:.74rem;margin-top:6px;}
.copywrap.wrong{animation:sh .3s;}

/* summary */
.sum{padding:16px;display:grid;gap:13px;}
.sum h2{margin:0;font-size:clamp(1.4rem,6vw,2rem);}
.sumcat{display:grid;grid-template-columns:auto 1fr;gap:11px;align-items:center;}
.sumcat .cc{width:clamp(70px,18vw,96px);}
.sumcat .cc img{width:100%;image-rendering:pixelated;filter:drop-shadow(0 0 8px rgba(255,211,77,.6));}
.sumgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.wrongs{display:grid;gap:6px;}
.wrongs .wh{color:var(--muted);font-size:.8rem;font-weight:800;padding:2px 2px 0;}
.wrongs .wh.ok{color:var(--mint);}
.wrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;text-align:left;
  border:2px solid var(--line);border-radius:11px;background:var(--panel2);color:#fff;padding:9px 12px;cursor:pointer;}
.wrow b{color:var(--gold);font-size:1.02rem;} .wrow span{color:var(--muted);font-size:.84rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.wrow i{font-style:normal;color:var(--bad);font-size:.76rem;font-weight:800;}
.wrow:active{transform:translateY(1px);}
.wrow{transition:opacity .25s,transform .25s;}
.wrow.gone{opacity:0;transform:translateX(28px);pointer-events:none;}
.sumitem{border:2px solid var(--line);border-radius:11px;background:var(--panel2);padding:11px;}
.sumitem b{display:block;font-size:1.15rem;} .sumitem span{color:var(--muted);font-size:.78rem;}

/* fx layer */
.fxlayer{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:40;}
.quiz.flash{animation:cardPulse .5s ease-out;}
@keyframes cardPulse{0%{box-shadow:var(--shadow);}45%{box-shadow:0 0 0 2px #fff,0 0 26px 8px var(--pink2),var(--shadow);}100%{box-shadow:var(--shadow);}}
/* 정답 광원: 빈칸 자리에서 작은 꽃잎·불티가 바깥으로 터져 0.6초 안에 사라진다(글자를 안 가림) */
.pt{position:absolute;left:var(--x,50%);top:var(--y,50%);width:calc(var(--sz,18px) * var(--fx-pk,1));height:calc(var(--sz,18px) * var(--fx-pk,1));transform:translate(-50%,-50%);
  animation:ptfly var(--dur,.6s) cubic-bezier(.1,.8,.3,1) forwards;filter:drop-shadow(0 0 5px var(--glow,#ff4fa3));will-change:transform,opacity;}
.pt svg{width:100%;height:100%;display:block;}
@keyframes ptfly{0%{transform:translate(-50%,-50%) translate(0,0) scale(.3) rotate(0);opacity:0;}8%{opacity:1;}55%{opacity:1;}
  100%{transform:translate(-50%,-50%) translate(var(--dx),var(--dy)) scale(1) rotate(var(--rot,180deg));opacity:0;}}
.dot{position:absolute;left:var(--x,50%);top:var(--y,50%);width:calc(6px * var(--fx-pk,1));height:calc(6px * var(--fx-pk,1));border-radius:50%;background:#fff;
  box-shadow:0 0 6px #fff,0 0 12px var(--gold);transform:translate(-50%,-50%);animation:dotfly var(--dur,.5s) cubic-bezier(.1,.8,.3,1) forwards;}
@keyframes dotfly{0%{transform:translate(-50%,-50%) translate(0,0) scale(1);opacity:1;}60%{opacity:1;}100%{transform:translate(-50%,-50%) translate(var(--dx),var(--dy)) scale(.2);opacity:0;}}
/* 하트 파동: 속을 채우지 않은 빛나는 윤곽이라 글자가 비쳐 읽힌다 */
.hwave{position:absolute;left:var(--x,50%);top:var(--y,50%);width:var(--sz,56px);height:var(--sz,56px);
  transform:translate(-50%,-50%) rotate(var(--tilt,0deg)) scale(.35);opacity:0;
  animation:hwave var(--dur,.66s) var(--del,0s) cubic-bezier(.12,.75,.3,1) forwards;
  filter:drop-shadow(0 0 6px rgba(255,138,198,.9));}
.hwave svg{width:100%;height:100%;display:block;}
@keyframes hwave{0%{transform:translate(-50%,-50%) rotate(var(--tilt,0deg)) scale(.35);opacity:0;}
  18%{opacity:.95;}60%{opacity:.35;}100%{transform:translate(-50%,-50%) rotate(var(--tilt,0deg)) scale(var(--s2,2.2));opacity:0;}}
/* 틀린 단어 지울 때: 줄 자리에서 하트가 커지며 빛나고 사라짐 */
.hpop{position:absolute;left:var(--x,50%);top:var(--y,50%);width:76px;height:76px;transform:translate(-50%,-50%) scale(.3);opacity:0;
  animation:hpop .9s cubic-bezier(.16,1,.3,1) forwards;filter:drop-shadow(0 0 10px #fff) drop-shadow(0 0 22px #ff4fa3);}
.hpop svg{width:100%;height:100%;display:block;}
@keyframes hpop{0%{transform:translate(-50%,-50%) scale(.3);opacity:0;}25%{opacity:1;}60%{transform:translate(-50%,-50%) scale(1.5);opacity:.95;}100%{transform:translate(-50%,-50%) scale(1.9);opacity:0;}}
.spark{position:absolute;left:var(--x,50%);top:var(--y,50%);width:var(--sz,30px);height:var(--sz,30px);
  transform:translate(-50%,-50%);animation:fly 1.25s cubic-bezier(.18,.9,.3,1) forwards;
  filter:drop-shadow(0 0 5px #fff) drop-shadow(0 0 12px var(--glow,#ff4fa3));will-change:transform,opacity;}
.spark svg{width:100%;height:100%;display:block;}
@keyframes fly{0%{transform:translate(-50%,-50%) translate(0,0) scale(.25) rotate(0);opacity:0;}
  18%{opacity:1;}
  100%{transform:translate(-50%,-50%) translate(var(--dx),var(--dy)) scale(1.05) rotate(var(--rot,360deg));opacity:0;}}
.ring{position:absolute;left:var(--x,50%);top:var(--y,50%);width:24px;height:24px;border-radius:50%;
  border:6px solid var(--gold);transform:translate(-50%,-50%);animation:rg .85s ease-out forwards;
  box-shadow:0 0 24px #fff,0 0 50px var(--pink);}
.ring.b{border-color:var(--pink);animation-delay:.08s;} .ring.c{border-color:var(--cyan);animation-delay:.16s;}
@keyframes rg{0%{width:20px;height:20px;opacity:1;}100%{width:440px;height:440px;opacity:0;border-width:1px;}}
.heartburst{position:absolute;left:var(--x,50%);top:var(--y,50%);width:120px;height:120px;
  transform:translate(-50%,-50%) scale(.2);transform-origin:center;opacity:0;
  animation:hburst .95s cubic-bezier(.16,1,.3,1) forwards;
  filter:drop-shadow(0 0 24px #fff) drop-shadow(0 0 60px #ff4fa3);will-change:transform,opacity;}
.heartburst svg{width:100%;height:100%;display:block;}
@keyframes hburst{0%{transform:translate(-50%,-50%) scale(.2);opacity:0;}
  22%{opacity:1;}
  55%{transform:translate(-50%,-50%) scale(2.6);opacity:.95;}
  100%{transform:translate(-50%,-50%) scale(3.4);opacity:0;}}
body.shake{animation:bshake .3s;}
@keyframes bshake{0%,100%{transform:translate(0,0);}33%{transform:translate(-2px,1px);}66%{transform:translate(2px,-1px);}}

/* toast */
.toast{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));z-index:60;
  transform:translate(-50%,14px);opacity:0;pointer-events:none;width:min(calc(100% - 26px),420px);
  padding:11px 14px;border-radius:12px;background:var(--panel);border:2px solid var(--pink);
  text-align:center;font-weight:800;box-shadow:var(--shadow);transition:.16s;}
.toast.show{opacity:1;transform:translate(-50%,0);}

@media (max-width:640px){
  .grid,.exgrid{grid-template-columns:1fr 1fr;}
  .stats{grid-template-columns:repeat(4,1fr);}
}
@media (max-width:380px){
  .stat span{font-size:.6rem;}
  .meaning{font-size:clamp(1.5rem,8.5vw,2.6rem);}
}

/* ---------- 화면 가장자리 금빛(10연속부터) ---------- */
.edge{position:absolute;inset:0;box-shadow:inset 0 0 60px 20px rgba(255,211,77,.55),inset 0 0 120px 40px rgba(255,79,163,.25);animation:edge 1s ease-out forwards;}
@keyframes edge{0%{opacity:0;}25%{opacity:1;}100%{opacity:0;}}
/* ---------- 퍼펙트 포효 ---------- */
.roar{position:fixed;inset:0;z-index:70;display:none;place-items:center;overflow:hidden;
  background:radial-gradient(circle at 50% 45%,rgba(255,211,77,.35),rgba(22,8,38,.92) 70%);}
.roar.show{display:grid;animation:endfade .25s ease;}
.roar .rays{position:absolute;left:50%;top:45%;width:200vmax;height:200vmax;transform:translate(-50%,-50%);
  background:repeating-conic-gradient(from 0deg,rgba(255,211,77,.28) 0deg 9deg,transparent 9deg 22deg);animation:spin 6s linear infinite;opacity:.9;}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg);}}
.roar-cat{position:relative;width:min(62vw,260px);animation:roarpop 2.2s cubic-bezier(.16,1,.3,1) both;}
.roar-cat img{width:100%;image-rendering:pixelated;display:block;
  filter:drop-shadow(0 0 14px #fff) drop-shadow(0 0 34px var(--gold)) drop-shadow(0 0 60px var(--pink));}
@keyframes roarpop{0%{transform:scale(.3);opacity:0;}12%{transform:scale(1.18);opacity:1;}18%{transform:scale(1.05) rotate(-3deg);}24%{transform:scale(1.14) rotate(3deg);}30%{transform:scale(1.06) rotate(-2deg);}36%{transform:scale(1.1) rotate(0);}100%{transform:scale(1.1);opacity:1;}}
.roar-inner{position:relative;display:flex;flex-direction:column;align-items:center;gap:26px;transform:translateY(-4vh);}
.roar-txt{text-align:center;animation:endpop .6s .25s cubic-bezier(.2,1.4,.4,1) both;}
.roar-txt b{display:block;font-size:clamp(2rem,11vw,3.4rem);color:var(--gold);letter-spacing:3px;text-shadow:0 0 14px #fff,0 0 30px var(--gold),3px 3px 0 #4a0a72;}
.roar-txt span{display:block;margin-top:6px;font-size:clamp(1.1rem,5.5vw,1.6rem);font-weight:900;color:#fff;text-shadow:0 0 10px var(--pink);}
body.roaring{animation:roarshake .5s .15s;}
@keyframes roarshake{0%,100%{transform:translate(0,0);}20%{transform:translate(-5px,3px);}40%{transform:translate(5px,-3px);}60%{transform:translate(-4px,2px);}80%{transform:translate(4px,-2px);}}
/* ---------- ending (100% 탈출) ---------- */
.ending{position:fixed;inset:0;z-index:60;display:none;place-items:center;padding:20px;
  background:radial-gradient(circle at 50% 28%,rgba(255,79,163,.28),rgba(8,3,16,.93));
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);}
.ending.show{display:grid;animation:endfade .45s ease;}
@keyframes endfade{from{opacity:0;}}
.ending-card{width:min(100%,420px);border:2px solid var(--gold2);border-radius:18px;
  background:linear-gradient(160deg,#2c0d44,#160826);
  padding:22px 20px 18px;text-align:center;}
.ending-card .ec{width:114px;margin:0 auto;}
.ending-card .ec img{width:100%;image-rendering:pixelated;filter:drop-shadow(0 0 12px rgba(255,211,77,.65));animation:bob 2.6s ease-in-out infinite;}
.ending-card h2{margin:8px 0 6px;color:var(--gold);font-size:1.3rem;}
.ending-card p{color:var(--muted);font-size:.9rem;line-height:1.55;margin:0 0 15px;}
.ending-form{display:flex;flex-direction:column;gap:10px;}
.ending-form input{padding:12px 14px;border-radius:12px;border:2px solid var(--line);
  background:var(--panel2);color:#fff;font-size:1.06rem;text-align:center;}
.ending-form input:focus{outline:none;border-color:var(--pink);}
.ending-result{display:none;margin-top:6px;font-size:1.18rem;font-weight:800;color:var(--gold);line-height:1.55;animation:endpop .5s cubic-bezier(.2,1.4,.4,1);}
.ending-result .nm{color:var(--pink2);}
@keyframes endpop{from{transform:scale(.7);opacity:0;}}

/* ===== HoE 리치 카드/리빌 ===== */
.hoectx .ex{margin-top:4px;font-size:1rem;color:var(--ink);line-height:1.55;word-break:keep-all;text-align:center;}
.hoectx .blanks{display:inline-flex;gap:5px;margin:0 3px;vertical-align:-2px;}
.hoectx .slot{min-width:15px;height:1.05em;padding:0 1px;box-sizing:border-box;display:inline-flex;align-items:flex-end;justify-content:center;border-bottom:3px solid var(--gold);color:var(--gold);font-weight:900;font-size:1.05rem;line-height:1;}
.hoectx .slot.cur{border-bottom-color:#fff;animation:caret 1s steps(1) infinite;}
.hoectx .slot.over{border-bottom-color:var(--bad);}
@keyframes caret{50%{border-bottom-color:var(--gold);}}
.ov-ipa{font-size:1.02rem;color:var(--cyansoft);font-weight:600;letter-spacing:.3px;margin-top:4px;}
.ov-ipa b{color:var(--gold);font-weight:900;font-size:1.55rem;}
.ov-ipa i{font-style:normal;color:var(--gold);font-weight:800;font-size:1.18rem;opacity:.85;}
.ov-ex{margin-top:10px;font-size:1.02rem;color:#fff;line-height:1.5;word-break:keep-all;}
.ov-ex .fill{color:var(--gold);font-weight:900;}
.ov-tr{margin-top:5px;font-size:.9rem;color:var(--muted);}
.ov-c{margin-top:12px;font-size:1.05rem;color:#fff;line-height:1.6;text-align:left;overflow-wrap:anywhere;
  background:rgba(124,255,178,.09);border:1px solid var(--mint);border-radius:12px;padding:11px 13px;}
.ov-say{font-size:.86rem;opacity:.85;}
.qoverlay.show{overflow-y:auto;}
/* 제자리 정답 공개 */
.hoectx .ex{font-size:clamp(1.42rem,6.4vw,1.8rem);line-height:1.7;margin-top:6px;}
.hoectx .blanks{gap:.4em .8em;margin:0 4px;max-width:calc(100% - 8px);flex-wrap:wrap;align-items:flex-end;justify-content:center;}
.hoectx .slot-word{display:inline-flex;gap:6px;max-width:100%;flex-wrap:wrap;justify-content:center;row-gap:.4em;}
.hoectx .slot{min-width:22px;font-size:1.5rem;border-bottom-width:3px;}
.hoectx .slot.gh{color:#8a6aa8;border-bottom-color:#6a4c86;}
.hoectx .slot.ok{color:var(--mint);border-bottom-color:var(--mint);}
.hoectx .slot.x{color:var(--bad2);border-bottom-color:var(--bad);}
.hoectx .fill{color:var(--gold);font-weight:900;padding:0 2px;}
.quiz.bad .hoectx .fill{color:var(--bad);}
.rv{display:none;gap:8px;flex-direction:column;align-items:center;text-align:center;animation:ovin .18s ease-out;}
.rv.show{display:flex;}
.rv-word{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;margin-top:2px;} /* 발음기호를 단어 아래에(26.9.12 시험, 롤백은 flex-direction:row;gap:10px) */
.rv-w{color:var(--gold);font-weight:900;font-size:clamp(2.1rem,9.4vw,3rem);line-height:1.1;overflow-wrap:anywhere;
}
.rv .ov-ipa{margin-top:0;}

.rv .ov-tr{margin-top:-2px;font-size:1.16rem;color:var(--muted);}
.rv .rv-word{margin-top:4px;}
.rv .ov-ipa{font-size:1.3rem;} .rv .ov-ipa b{font-size:1.95rem;} .rv .ov-ipa i{font-size:1.45rem;}
.rv .ov-c{font-size:1.26rem;line-height:1.6;padding:11px 13px;}
.rv .ov-say{font-size:.98rem;}
.rv .ov-c{margin-top:2px;width:100%;}
.rv .ov-hint{font-size:.8rem;}


/* ============ 연습마다 돌아가는 꽃 효과(유리꽃 화약 제외) ============ */
/* ===== 꽃 v1 · 겹꽃잎 다종 꽃다발 ===== */
/* ===== v1 · 겹꽃잎 다종 꽃 — #fxLayer 전용. UI에는 아무 그림자·광원도 얹지 않는다 ===== */
/* 스프라이트(기하·그라데이션 정의) — 보이지 않고 레이아웃에 영향 없음 */
.v1-defs{position:absolute;left:0;top:0;width:0;height:0;overflow:hidden;opacity:0;}

/* 꽃 한 송이: 바깥 div = 비행(translate+scale), 안쪽 svg = 회전·뒤집힘. 둘 다 transform/opacity 뿐 */
.v1-fl{position:absolute;left:var(--x,50%);top:var(--y,50%);width:calc(var(--sz,20px) * var(--fx-pk,1));height:calc(var(--sz,20px) * var(--fx-pk,1));
  transform:translate(-50%,-50%);opacity:0;
  animation:v1fly var(--dur,.92s) cubic-bezier(.12,.72,.26,1) var(--del,0s) both;
  will-change:transform,opacity;}
.v1-fl>svg{width:100%;height:100%;display:block;transform-origin:50% 50%;
  animation:v1spin var(--dur,.92s) linear var(--del,0s) both;}
@keyframes v1fly{
  0%{opacity:0;transform:translate(-50%,-50%) translate(0,0) scale(.18);}
  14%{opacity:1;}
  62%{opacity:1;transform:translate(-50%,-50%) translate(calc(var(--dx,0px)*.86),calc(var(--dy,0px)*.86 - 7px)) scale(1.08);}
  78%{opacity:1;}
  100%{opacity:0;transform:translate(-50%,-50%) translate(var(--dx,0px),calc(var(--dy,0px) + var(--drop,14px))) scale(.9);}}
@keyframes v1spin{
  0%{transform:rotate(var(--ra,0deg)) scaleX(1);}
  46%{transform:rotate(var(--rb,90deg)) scaleX(var(--flip,.5));}
  100%{transform:rotate(var(--rc,200deg)) scaleX(1);}}

/* 낱꽃잎·하트 파티클: div 하나로 비행+회전 */
.v1-lp{position:absolute;left:var(--x,50%);top:var(--y,50%);width:calc(var(--sz,10px) * var(--fx-pk,1));height:calc(var(--sz,10px) * var(--fx-pk,1));
  transform:translate(-50%,-50%);opacity:0;
  animation:v1lp var(--dur,.8s) cubic-bezier(.1,.7,.3,1) var(--del,0s) both;}
.v1-lp>svg{width:100%;height:100%;display:block;}
@keyframes v1lp{
  0%{opacity:0;transform:translate(-50%,-50%) translate(0,0) rotate(var(--ra,0deg)) scale(.2);}
  16%{opacity:1;}
  70%{opacity:1;}
  100%{opacity:0;transform:translate(-50%,-50%) translate(var(--dx,0px),calc(var(--dy,0px) + 16px)) rotate(var(--rc,360deg)) scale(1);}}

/* 불티·별빛: SVG 없이 gradient + clip-path 로만 */
.v1-sp{position:absolute;left:var(--x,50%);top:var(--y,50%);width:calc(var(--sz,7px) * var(--fx-pk,1));height:calc(var(--sz,7px) * var(--fx-pk,1));border-radius:50%;
  background:radial-gradient(circle,#fff 0 32%,var(--c,#ffd34d) 56%,rgba(255,255,255,0) 74%);
  box-shadow:0 0 6px var(--c,#ffd34d);transform:translate(-50%,-50%);opacity:0;
  animation:v1sp var(--dur,.6s) cubic-bezier(.08,.72,.24,1) var(--del,0s) both;}
.v1-sp.st{border-radius:0;box-shadow:none;
  background:radial-gradient(circle,#fff 0 36%,var(--c,#ffd34d) 60%,rgba(255,255,255,0) 80%);
  clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);}
@keyframes v1sp{
  0%{opacity:0;transform:translate(-50%,-50%) translate(0,0) scale(.4);}
  12%{opacity:1;}
  100%{opacity:0;transform:translate(-50%,-50%) translate(var(--dx,0px),var(--dy,0px)) scale(var(--s2,.25)) rotate(var(--rc,0deg));}}

/* 중앙 광원 = 하트(원 아님). 가운데가 가장 옅고 0.56초에 사라져 빈칸 글자를 가리지 않는다 */
.v1-glow{position:absolute;left:var(--x,50%);top:var(--y,50%);width:var(--gw,110px);height:var(--gw,110px);
  transform:translate(-50%,-50%) scale(.34);opacity:0;
  animation:v1glow .56s cubic-bezier(.2,.8,.3,1) both;}
.v1-glow>svg{width:100%;height:100%;display:block;}
@keyframes v1glow{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.34) rotate(-5deg);}
  20%{opacity:1;}
  55%{opacity:.62;}
  100%{opacity:0;transform:translate(-50%,-54%) scale(1.62) rotate(3deg);}}

/* 5연속+ 하트 링(윤곽선만) */
.v1-ring{position:absolute;left:var(--x,50%);top:var(--y,50%);width:104px;height:104px;
  transform:translate(-50%,-50%) scale(.3);opacity:0;
  animation:v1ring .72s cubic-bezier(.2,.75,.25,1) both;}
.v1-ring>svg{width:100%;height:100%;display:block;}
@keyframes v1ring{0%{opacity:0;transform:translate(-50%,-50%) scale(.3);}
  15%{opacity:.9;}100%{opacity:0;transform:translate(-50%,-50%) scale(2.5);}}

/* 10연속+ 화면 가장자리 금빛 */
.v1-edge{position:absolute;inset:0;
  box-shadow:inset 0 0 58px 18px rgba(255,211,77,.50),inset 0 0 130px 44px rgba(255,79,163,.22);
  animation:v1edge .92s ease-out both;}
@keyframes v1edge{0%{opacity:0;}22%{opacity:1;}100%{opacity:0;}}

/* 결과 화면 하트 팝(fxHeart 호환) */
.v1-pop{position:absolute;left:var(--x,50%);top:var(--y,50%);width:78px;height:78px;
  transform:translate(-50%,-50%) scale(.3);opacity:0;
  animation:v1pop .86s cubic-bezier(.16,1,.3,1) both;}
.v1-pop>svg{width:100%;height:100%;display:block;}
@keyframes v1pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.3);}24%{opacity:1;}
  62%{opacity:.9;transform:translate(-50%,-50%) scale(1.45);}100%{opacity:0;transform:translate(-50%,-50%) scale(1.8);}}
/* ===== 꽃 v2 · 두 번 뛰는 꽃비 ===== */
/* ===== v2 · 분출 궤적·물리 (prefix: v2) =====================================
   래퍼(.v2-p) = 포물선 궤적(2단 분출 + 중력), 자식(.v2-i) = 흩날림(회전·펄럭임·축소).
   transform/opacity 만 애니메이션. 전체 1.25초 이내. 중앙 광원은 하트.
   ========================================================================== */

/* 1) 중앙 하트 광원 — 반투명, 0.56초에 소멸(글자 안 가림) */
.v2-glow{position:absolute;left:var(--x,50%);top:var(--y,50%);
  width:var(--gsz,134px);height:var(--gsz,134px);
  margin:calc(var(--gsz,134px) * -0.5) 0 0 calc(var(--gsz,134px) * -0.5);
  opacity:0;animation:v2glow .56s cubic-bezier(.15,.9,.3,1) both;}
.v2-glow svg{width:100%;height:100%;display:block;}
@keyframes v2glow{
  0%{opacity:0;transform:scale(.26) rotate(-7deg);}
  16%{opacity:.9;transform:scale(.95) rotate(0deg);}
  44%{opacity:.5;transform:scale(1.2);}
  100%{opacity:0;transform:scale(1.52);}}

/* 2) 하트 충격파(콤보 5+) — 선만 남기며 얇아진다 */
.v2-ring{position:absolute;left:var(--x,50%);top:var(--y,50%);width:120px;height:120px;margin:-60px 0 0 -60px;
  animation:v2ring .66s cubic-bezier(.12,.85,.25,1) both;
  filter:drop-shadow(0 0 6px var(--pink2,#ff8ac6));}

/* ===== 정답 효과 새판: 큰 윤곽 하트 + 단계 개화 꽃 ===== */
#fxLayer{--fx-ha:1;--fx-fa:1;}
/* ===== shock · 하트 충격파 =====
   속 빈 얇은 하트 링 하나가 빈칸에서 폭발하듯 튀어나와 화면 밖으로 빠진다.
   fill 은 언제나 none. 반투명 채움·헤일로 원·큰 blur 덩어리 없음.
   선 두께 함정 해법:
     div 는 처음부터 큰 고정 크기(--shk-S)로 두고 scale 로만 키운다.
     scale 이 k 일 때 stroke-width 에 1/k 를 곱해 되돌린다 → 화면상 선 두께가 시종 일정.
     transform 키프레임과 stroke-width 키프레임을 같은 백분율·linear 로 맞춰 짝지었다.
     --shk-sw1/--shk-sw2 는 JS가 (원하는 화면px × 96 ÷ --shk-S) 로 계산해 넣는다. (viewBox 폭 96단위)
   애니메이트하는 것: transform / opacity / stroke-width 뿐. 레이아웃 유발 없음. */

.shock-ring{position:absolute;left:var(--shk-x,50%);top:var(--shk-y,50%);
  width:var(--shk-S,360px);height:calc(var(--shk-S,360px) * 0.927);
  transform:translate(-50%,-50%) rotate(var(--shk-tilt,0deg)) scale(.10);
  opacity:0;will-change:transform,opacity;
  animation:shock-fly var(--shk-dur,.56s) var(--shk-del,0s) linear both;
  filter:drop-shadow(0 0 5px rgba(255,124,196,.9)) opacity(var(--fx-ha,1));}
.shock-ring svg{width:100%;height:100%;display:block;overflow:visible;}

@keyframes shock-fly{
  0%  {transform:translate(-50%,-50%) rotate(var(--shk-tilt,0deg)) scale(.10);opacity:0;}
  3%  {transform:translate(-50%,-50%) rotate(var(--shk-tilt,0deg)) scale(.18);opacity:.7;}
  6%  {transform:translate(-50%,-50%) rotate(var(--shk-tilt,0deg)) scale(.27);opacity:1;}
  14% {transform:translate(-50%,-50%) rotate(var(--shk-tilt,0deg)) scale(.45);opacity:1;}
  25% {transform:translate(-50%,-50%) rotate(var(--shk-tilt,0deg)) scale(.63);opacity:.95;}
  40% {transform:translate(-50%,-50%) rotate(var(--shk-tilt,0deg)) scale(.78);opacity:.88;}
  58% {transform:translate(-50%,-50%) rotate(var(--shk-tilt,0deg)) scale(.89);opacity:.70;}
  78% {transform:translate(-50%,-50%) rotate(var(--shk-tilt,0deg)) scale(.96);opacity:.42;}
  100%{transform:translate(-50%,-50%) rotate(var(--shk-tilt,0deg)) scale(1);opacity:0;}}

/* 1/k 보정표 — 위 scale 값과 같은 백분율에 1:1 대응 (끝으로 갈수록 살짝 더 가늘게) */
.shock-ring .shock-a{animation:shock-w1 var(--shk-dur,.56s) var(--shk-del,0s) linear both;}
.shock-ring .shock-b{animation:shock-w2 var(--shk-dur,.56s) var(--shk-del,0s) linear both;}
@keyframes shock-w1{
  0%{stroke-width:calc(var(--shk-sw1) * 10);}    3%{stroke-width:calc(var(--shk-sw1) * 5.56);}
  6%{stroke-width:calc(var(--shk-sw1) * 3.70);}  14%{stroke-width:calc(var(--shk-sw1) * 2.18);}
  25%{stroke-width:calc(var(--shk-sw1) * 1.49);} 40%{stroke-width:calc(var(--shk-sw1) * 1.13);}
  58%{stroke-width:calc(var(--shk-sw1) * .90);}  78%{stroke-width:calc(var(--shk-sw1) * .75);}
  100%{stroke-width:calc(var(--shk-sw1) * .62);}}
@keyframes shock-w2{
  0%{stroke-width:calc(var(--shk-sw2) * 10);}    3%{stroke-width:calc(var(--shk-sw2) * 5.56);}
  6%{stroke-width:calc(var(--shk-sw2) * 3.70);}  14%{stroke-width:calc(var(--shk-sw2) * 2.18);}
  25%{stroke-width:calc(var(--shk-sw2) * 1.49);} 40%{stroke-width:calc(var(--shk-sw2) * 1.13);}
  58%{stroke-width:calc(var(--shk-sw2) * .90);}  78%{stroke-width:calc(var(--shk-sw2) * .75);}
  100%{stroke-width:calc(var(--shk-sw2) * .62);}}

/* 터지는 첫 순간의 못 — 작은 하트가 짧게 때리고 사라진다. 역시 속은 비었다 */
.shock-core{position:absolute;left:var(--shk-x,50%);top:var(--shk-y,50%);
  width:var(--shk-S,120px);height:calc(var(--shk-S,120px) * 0.927);
  transform:translate(-50%,-50%) scale(.30);opacity:0;will-change:transform,opacity;

.shock-core svg{width:100%;height:100%;display:block;overflow:visible;}
@keyframes shock-pop{
  0%  {transform:translate(-50%,-50%) scale(.30);opacity:0;}
  15% {transform:translate(-50%,-50%) scale(.75);opacity:1;}
  55% {transform:translate(-50%,-50%) scale(1.25);opacity:.75;}
  100%{transform:translate(-50%,-50%) scale(1.75);opacity:0;}}
.shock-core .shock-a{animation:shock-cw1 var(--shk-dur,.26s) linear both;}
.shock-core .shock-b{animation:shock-cw2 var(--shk-dur,.26s) linear both;}
@keyframes shock-cw1{0%{stroke-width:calc(var(--shk-sw1) * 3.33);}15%{stroke-width:calc(var(--shk-sw1) * 1.33);}
  55%{stroke-width:calc(var(--shk-sw1) * .80);}100%{stroke-width:calc(var(--shk-sw1) * .57);}}
@keyframes shock-cw2{0%{stroke-width:calc(var(--shk-sw2) * 3.33);}15%{stroke-width:calc(var(--shk-sw2) * 1.33);}
  55%{stroke-width:calc(var(--shk-sw2) * .80);}100%{stroke-width:calc(var(--shk-sw2) * .57);}}

/* ===== bloomstep · 단계 개화 =====
   periodic-game animateBigBohr()의 껍질 구조를 꽃으로 옮긴다.
   가까운 고리 한 겹이 한꺼번에 "촹" 피고, 잠깐 뒤 다음 고리가 "촹".
   3중 중첩: 바깥=비행(translate/scale/rotate), 가운데=살랑(rotate±·translateX±), 안쪽=꽃잎 나부낌(scaleX±).
   transform·opacity만 애니메이트한다. drop-shadow는 바깥 한 겹뿐. */

.bloomstep-f{
  position:absolute;
  left:var(--bloomstep-x,50%);
  top:var(--bloomstep-y,50%);
  width:calc(var(--bloomstep-sz,46px) * var(--fx-pk,1));
  height:calc(var(--bloomstep-sz,46px) * var(--fx-pk,1));
  transform:translate(-50%,-50%) scale(.14);
  opacity:0;
  filter:drop-shadow(0 0 7px var(--bloomstep-glow,#ff4fa3)) opacity(var(--fx-fa,1));
  animation:bloomstepFly var(--bloomstep-dur,.56s) var(--bloomstep-del,0s) cubic-bezier(.26,.78,.34,1) both;
  will-change:transform,opacity;
}
/* 비행: 초반에 이미 절반 넘게 날아가지만 크기는 아직 작다 →
   꽃이 커지는 순간엔 예문 줄에서 이미 벗어나 있다(글자 가림 방지) */
@keyframes bloomstepFly{
  0%{
    opacity:0;
    transform:translate(-50%,-50%) translate(0,0) scale(.14) rotate(0deg);
  }
  11%{opacity:1;}
  33%{
    transform:translate(-50%,-50%)
      translate(calc(var(--bloomstep-dx,0px)*.63),calc(var(--bloomstep-dy,0px)*.63))
      scale(.56) rotate(calc(var(--bloomstep-rot,60deg)*.35));
  }
  63%{
    opacity:1;
    transform:translate(-50%,-50%)
      translate(calc(var(--bloomstep-dx,0px)*.92),calc(var(--bloomstep-dy,0px)*.92))
      scale(1.09) rotate(calc(var(--bloomstep-rot,60deg)*.74));
  }
  86%{
    opacity:.94;
    transform:translate(-50%,-50%)
      translate(calc(var(--bloomstep-dx,0px)*.98),calc(var(--bloomstep-dy,0px)*.98))
      scale(1) rotate(calc(var(--bloomstep-rot,60deg)*.94));
  }
  100%{
    opacity:0;
    transform:translate(-50%,-50%)
      translate(var(--bloomstep-dx,0px),var(--bloomstep-dy,0px))
      scale(.92) rotate(var(--bloomstep-rot,60deg));
  }
}

/* 갈래마다 "언제 커지는가"를 달리한다. 글자띠를 지나는 동안은 작게,
   다 지나고 나서 크게 핀다 — 큰 꽃이 글자 위에 앉지 않는 핵심 장치다. */
.bloomstep-f.bloomstep-u{animation-name:bloomstepFlyUp;}
.bloomstep-f.bloomstep-d{animation-name:bloomstepFlyDn;}
/* 위 갈래: 헤더 글자띠(원점에서 53~73px 위)를 지날 때 크기 0.28 */
@keyframes bloomstepFlyUp{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.12) rotate(0deg);}
  12%{opacity:1;}
  40%{transform:translate(-50%,-50%)
      translate(calc(var(--bloomstep-dx,0px)*.70),calc(var(--bloomstep-dy,0px)*.70))
      scale(.28) rotate(calc(var(--bloomstep-rot,60deg)*.38));}
  62%{opacity:1;transform:translate(-50%,-50%)
      translate(calc(var(--bloomstep-dx,0px)*.92),calc(var(--bloomstep-dy,0px)*.92))
      scale(.95) rotate(calc(var(--bloomstep-rot,60deg)*.72));}
  84%{opacity:.95;transform:translate(-50%,-50%)
      translate(var(--bloomstep-dx,0px),var(--bloomstep-dy,0px))
      scale(1.08) rotate(calc(var(--bloomstep-rot,60deg)*.93));}
  100%{opacity:0;transform:translate(-50%,-50%)
      translate(var(--bloomstep-dx,0px),var(--bloomstep-dy,0px))
      scale(1) rotate(var(--bloomstep-rot,60deg));}
}
/* 아래 갈래: 뜻풀이 상자(원점에서 145~265px 아래)를 지날 때 크기 0.30 */
@keyframes bloomstepFlyDn{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.12) rotate(0deg);}
  12%{opacity:1;}
  34%{transform:translate(-50%,-50%)
      translate(calc(var(--bloomstep-dx,0px)*.58),calc(var(--bloomstep-dy,0px)*.58))
      scale(.30) rotate(calc(var(--bloomstep-rot,60deg)*.30));}
  55%{transform:translate(-50%,-50%)
      translate(calc(var(--bloomstep-dx,0px)*.84),calc(var(--bloomstep-dy,0px)*.84))
      scale(.72) rotate(calc(var(--bloomstep-rot,60deg)*.58));}
  78%{opacity:1;transform:translate(-50%,-50%)
      translate(calc(var(--bloomstep-dx,0px)*.97),calc(var(--bloomstep-dy,0px)*.97))
      scale(1.10) rotate(calc(var(--bloomstep-rot,60deg)*.86));}
  100%{opacity:0;transform:translate(-50%,-50%)
      translate(var(--bloomstep-dx,0px),var(--bloomstep-dy,0px))
      scale(1) rotate(var(--bloomstep-rot,60deg));}
}

/* 살랑 1 — 송이 전체가 바람에 나부낀다(좌우로 기울며 옆으로 밀림) */
.bloomstep-s{
  display:block;width:100%;height:100%;
  transform-origin:50% 78%;
  animation:bloomstepSway var(--bloomstep-swd,.34s) var(--bloomstep-del,0s) ease-in-out 4 alternate both;
  will-change:transform;
}
@keyframes bloomstepSway{
  0%  {transform:rotate(calc(var(--bloomstep-sw,9deg)*-1)) translateX(calc(var(--bloomstep-sx,3px)*-1));}
  100%{transform:rotate(var(--bloomstep-sw,9deg)) translateX(var(--bloomstep-sx,3px));}
}
/* 살랑 2 — 꽃잎면이 바람 받아 돌아눕는다(가로로 납작해졌다 펴짐) */
.bloomstep-p{
  display:block;width:100%;height:100%;
  transform-origin:50% 52%;
  animation:bloomstepFlut var(--bloomstep-fld,.25s) var(--bloomstep-fdl,0s) ease-in-out 6 alternate both;
  will-change:transform;
}
@keyframes bloomstepFlut{
  0%  {transform:scaleX(var(--bloomstep-fa,.74)) rotate(calc(var(--bloomstep-fr,5deg)*-1));}
  100%{transform:scaleX(1.04) rotate(var(--bloomstep-fr,5deg));}
}
.bloomstep-p svg{width:100%;height:100%;display:block;}

@media (prefers-reduced-motion:reduce){
  .bloomstep-f,.bloomstep-f.bloomstep-u,.bloomstep-f.bloomstep-d{
    animation:bloomstepCalm .34s var(--bloomstep-cdel,0s) ease-out both;
    filter:none;
  }
  .bloomstep-s,.bloomstep-p{animation:none;transform:none;}
}
@keyframes bloomstepCalm{
  0%{opacity:0;transform:translate(-50%,-50%) translate(calc(var(--bloomstep-dx,0px)*.5),calc(var(--bloomstep-dy,0px)*.5)) scale(.7);}
  35%{opacity:1;}
  100%{opacity:0;transform:translate(-50%,-50%) translate(var(--bloomstep-dx,0px),var(--bloomstep-dy,0px)) scale(1);}
}

/* 왜 통과했는지 알려주는 줄 — 고양이 잡담과 구분되게 금색 세로선 하나 */
.ov-why{border-left:3px solid var(--gold);padding-left:9px;text-align:left;align-self:stretch;color:var(--gold);font-weight:800;}

/* 남은 시간 막대는 민무늬로 둔다. 한때 쥐가 고양이한테서 도망치는 연출을 얹었는데,
   재미있긴 해도 문제를 푸는 동안 눈이 그쪽으로 끌려가서 걷어냈다(26.9.15 영신). */

/* Stable feedback layout: reserve speech space and a small top inset. */
body.playing .app{
  padding-top:max(16px,env(safe-area-inset-top));
}
.time-slot{
  --speech-font-size:clamp(.85rem,3.5vw,.98rem);
  min-height:calc(var(--speech-font-size) * 2.9 + 16px);
}
.cat-speech{font-size:var(--speech-font-size);}
/* A known, longer card-specific line reserves its actual wrapping height before
   the answer. The invisible copy is excluded from the accessibility tree. */
.speech-reserve{visibility:hidden;pointer-events:none;}
.quiz.good .meaning,.quiz.bad .meaning{
  font-size:clamp(1.55rem,7vw,2.2rem);
}
@media(max-width:380px){
  .quiz.good .meaning,.quiz.bad .meaning{font-size:clamp(1.5rem,8.5vw,2.6rem);}
}
@media(max-height:500px){
  body.playing .app{padding-top:max(10px,env(safe-area-inset-top));}
}

/* IPA and explanation share one paragraph, with ordinary line wrapping. */
.rv .rv-note{display:block;text-align:left;}
.rv .rv-inline-ipa{
  all:unset;display:inline;color:var(--cyansoft);font-family:inherit;
  font-size:1.05rem;font-weight:600;line-height:inherit;letter-spacing:0;
  cursor:pointer;overflow-wrap:anywhere;
}
.rv .rv-inline-ipa b{font-size:1.2rem;}
.rv .rv-inline-ipa i{font-size:1.1rem;}
.rv .rv-inline-ipa:focus-visible{outline:2px solid var(--cyansoft);outline-offset:3px;border-radius:3px;}

/* Reserve classic scrollbar space before a long explanation needs scrolling. */
html{scrollbar-gutter:stable;background:var(--bg1);}
/* One universal wide-letter cell, with no answer-dependent sizing or JS metrics. */
.hoectx .blanks{display:inline;margin:0 2px;vertical-align:baseline;}
.hoectx .slot-word{gap:0;vertical-align:baseline;}
.hoectx .slot{
  position:relative;flex:0 0 auto;width:auto;min-width:1em;padding:0;
  font-size:inherit;border-bottom-color:transparent;
}
.hoectx .slot::before{content:"W";visibility:hidden;white-space:pre;}
.hoectx .slot-glyph{
  position:absolute;left:0;right:0;bottom:0;display:block;white-space:pre;
  line-height:1;text-align:center;
}
.hoectx .slot::after{
  content:"";position:absolute;left:1px;right:1px;bottom:-3px;height:3px;
  background:currentColor;border-radius:1px;
}
.hoectx .slot.cur,.hoectx .slot.gh,.hoectx .slot.ok,.hoectx .slot.x,.hoectx .slot.over{
  border-bottom-color:transparent;animation:none;
}
.hoectx .slot.cur::after{animation:slot-caret 1s steps(1) infinite;}
@keyframes slot-caret{50%{background:#fff;}}
.hoectx .slot.over::after{background:var(--bad);}
.hoectx .blanks.revealed .slot::after{visibility:hidden;animation:none;}
.hoectx .slot-punctuation{
  display:inline-flex;flex:0 0 auto;align-items:flex-end;height:1.05em;
  border-bottom:3px solid transparent;font-size:inherit;font-weight:900;
  line-height:1;white-space:pre;visibility:hidden;color:var(--gold);
}
.hoectx .slot-punctuation.shown{visibility:visible;}
.quiz.bad .slot-punctuation{color:#8a6aa8;}
.answer-spoken{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip-path:inset(50%);white-space:nowrap;border:0;
}

/* Touching the first cell reveals only the first letter, once per card. */
.slot-hint{
  all:unset;position:absolute;z-index:3;box-sizing:border-box;display:block;
  cursor:help;touch-action:manipulation;border-radius:5px;
}
.slot-hint[hidden]{display:none;}
.slot-hint:disabled{pointer-events:none;}
.slot-hint:focus-visible{outline:2px solid var(--cyansoft);outline-offset:1px;}

/* Review taps: one side-facing rose and four existing sprays. */
.review-roses,.review-spray{position:absolute;inset:0;pointer-events:none;}
.review-spray{opacity:.76;}
.review-roses .v1-fl{filter:drop-shadow(0 0 4px #ffa3c66b);}
.review-roses .v3-fan{width:360px;height:360px;}
.review-roses .v3-ray{max-width:172px;}
.review-rose-core{position:absolute;left:var(--x);top:var(--y);width:104px;height:176px;
  pointer-events:none;filter:drop-shadow(0 0 7px #ff779057);
  animation:reviewRoseBloom .82s cubic-bezier(.16,.8,.3,1) both;}
.review-rose-core svg{display:block;width:100%;height:100%;}
@keyframes reviewRoseBloom{
  0%{opacity:0;transform:translate(-50%,-45%) scale(.38) rotate(-7deg);}
  20%{opacity:.95;transform:translate(-50%,-50%) scale(1) rotate(-2deg);}
  60%{opacity:.86;transform:translate(-50%,-53%) scale(1.04) rotate(2deg);}
  100%{opacity:0;transform:translate(-50%,-58%) scale(1.08) rotate(5deg);}}
@media (prefers-reduced-motion:reduce){
  .review-spray{display:none;}
  .review-rose-core{animation:reviewRoseFade .2s ease-out both;}}
@keyframes reviewRoseFade{from{opacity:.75;transform:translate(-50%,-50%);}to{opacity:0;transform:translate(-50%,-50%);}}
/* A new color and one extra 아 for each consecutive perfect exercise. */
.roar{background:radial-gradient(circle at 50% 45%,rgba(var(--roar-rgb,255,211,77),.35),rgba(22,8,38,.92) 70%);}
.roar .rays{background:repeating-conic-gradient(from 0deg,rgba(var(--roar-rgb,255,211,77),.28) 0deg 9deg,transparent 9deg 22deg);}
.roar-cat img{filter:drop-shadow(0 0 14px #fff) drop-shadow(0 0 34px rgb(var(--roar-rgb,255,211,77))) drop-shadow(0 0 60px var(--roar-halo,var(--pink)));}
.roar-inner{width:min(94vw,600px);max-height:94dvh;overflow-y:auto;padding:12px 0;scrollbar-width:none;}
.roar-cat{flex-shrink:0;}
.roar-txt{max-width:100%;}
.roar-txt b{color:rgb(var(--roar-rgb,255,211,77));font-size:clamp(1.8rem,10vw,3.4rem);text-shadow:0 0 14px #fff,0 0 30px rgb(var(--roar-rgb,255,211,77)),3px 3px 0 #4a0a72;}
.roar-txt span{max-width:88vw;overflow-wrap:anywhere;font-size:clamp(1rem,calc(82vw / var(--roar-letters,7)),1.6rem);line-height:1.35;text-shadow:0 0 10px var(--roar-halo,var(--pink));}

/* Textbook title stays visible; each exercise remains a complete passage. */
.appbar h1{font-size:clamp(.75rem,3.4vw,1.12rem);}
#prevBtn{width:auto;min-width:54px;flex:none;padding:0 10px;font-size:.82rem;font-weight:800;}
body.playing .appbar{display:flex;padding:0 5px;}
.rv-note:empty{display:none;}
/* IPA_EFFECT_STYLES_START */
/* Shared pronunciation reveal. Answer cells keep their original size and position. */
.hoectx .answer-replay{position:relative;z-index:3;cursor:pointer;touch-action:manipulation;border-radius:3px;}
.hoectx .answer-replay:focus-visible{outline:2px solid var(--cyansoft);outline-offset:4px;}
.rv.show:empty{display:none;}
.ipa-effect-layer{position:fixed;inset:0;z-index:41;pointer-events:none;overflow:hidden;}
.ipa-trace{--ipa-light-strength:.22;--ipa-ray-strength:.18;position:absolute;display:flex;align-items:center;justify-content:center;isolation:isolate;opacity:0;color:#fff5db;white-space:nowrap;font-family:Georgia,'Times New Roman',serif;font-size:clamp(23px,6.25vw,31px);font-weight:600;line-height:1;letter-spacing:.01em;transform:translateY(2px);}
/* A small fixed increase preserves spelling alignment without per-letter sizing. */
.ov-ipa,.rv .rv-inline-ipa{letter-spacing:.03em;}
.ipa-trace .ipa-sound{position:relative;z-index:2;flex:0 0 auto;font-size:1em;text-shadow:none;}
.ipa-trace.strong .ipa-sound,.ipa-trace.secondary .ipa-sound{font-size:1.14em;font-weight:800;color:#ffd34d;}
/* Keep the brightest light on lexical stress, without blurring the glyphs. */
.ipa-trace.strong,.ipa-trace.secondary{--ipa-light-strength:1;--ipa-ray-strength:1;}
.ipa-trace::before{content:"";position:absolute;inset:-10px -14px;z-index:0;opacity:0;background:radial-gradient(ellipse,rgba(255,209,239,.4),rgba(210,107,231,.13) 38%,transparent 70%);border-radius:50%;}
.ipa-trace::after{content:"";position:absolute;left:5%;right:5%;top:78%;height:1px;z-index:1;opacity:0;background:linear-gradient(90deg,transparent,#fff2c9,transparent);box-shadow:0 0 9px #edafe1;}
.ipa-trace.lit{opacity:1;transform:translateY(0) scale(1);}
.ipa-trace.lit .ipa-sound{animation:ipaSoundPop .65s ease-out both;}
.ipa-trace.lit::before{animation:ipaLight .72s ease-out both;}
.ipa-trace.lit::after{animation:ipaRay .58s ease-out both;}
.ipa-trace.past .ipa-sound{color:#ecdef3;}
/* Keep the lexical stress visible after the next sound starts, including the
   static comparison view. Gold must not be overwritten by the past state. */
.ipa-trace.strong.past .ipa-sound{color:#ffd34d;}
.ipa-trace.secondary.past .ipa-sound{color:#ffd34d;}
.ipa-trace.finishing{transition:opacity .24s;opacity:0;}
.ipa-trace.silent{font-family:inherit;font-size:11px;color:#c9b0d5;align-items:flex-start;padding-top:1px;letter-spacing:0;transform:translateY(-14px);}
.ipa-trace.silent::before,.ipa-trace.silent::after{display:none;}
.ipa-trace.silent .ipa-sound{animation:none;text-shadow:none;}
.ipa-under .slot-glyph{opacity:.14;transition:opacity .08s;}
.ipa-silent .slot-glyph{opacity:.3;text-decoration:line-through;text-decoration-thickness:1px;}
@keyframes ipaSoundPop{0%{transform:scale(1);opacity:.15;}20%{transform:scale(1.06);opacity:1;}62%,100%{transform:scale(1);opacity:1;}}
@keyframes ipaLight{0%{opacity:0;transform:scale(.3);}22%{opacity:calc(.95 * var(--ipa-light-strength));transform:scale(1.08);}100%{opacity:calc(.1 * var(--ipa-light-strength));transform:scale(1.35);}}
@keyframes ipaRay{0%{opacity:0;transform:scaleX(.15);}25%{opacity:calc(.9 * var(--ipa-ray-strength));transform:scaleX(1.3);}100%{opacity:0;transform:scaleX(1.6);}}
@media(prefers-reduced-motion:reduce){.ipa-trace,.ipa-trace.lit{transform:none;}.ipa-trace .ipa-sound,.ipa-trace::before,.ipa-trace::after{animation:none!important;}.ipa-trace.lit::before{opacity:calc(.22 * var(--ipa-light-strength));}.ipa-under .slot-glyph{transition:none;}}


.ipa-trace.ipa-whole{line-height:1.12;}
.ipa-whole .ipa-sound{white-space:normal;overflow-wrap:anywhere;max-width:100%;text-align:center;}
.ipa-sound b,.ipa-sound i,.ov-ipa b,.ov-ipa i,.rv .rv-inline-ipa b,.rv .rv-inline-ipa i{color:#ffd34d;font-style:normal;font-weight:800;}

/* Relative sizes survive shared fitting and whole-IPA wrapping. */
.ipa-whole .ipa-sound b,.ipa-whole .ipa-sound i{font-size:1.14em;}
/* IPA_EFFECT_STYLES_END */
</style>

<body>
<div class="app">
  <div class="appbar">
    <h1>꽃과 단어의 도시를 <b>벗어나고양!</b></h1>
    <span class="spacer"></span>
    <a class="iconbtn course-home" href="index.html" title="교재 선택" aria-label="교재 선택으로 돌아가기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></svg>
    </a>
  </div>

  <!-- map route -->
  <div class="maproute">
    <div class="ends"><span>🌹 일산</span><span class="seoul">전설의 BIG MOUNTAIN 🌳</span></div>
    <div class="track">
      <div class="rail"><i id="routeFill"></i></div>

  <main style="flex:1;display:flex;flex-direction:column;">
    <!-- HOME -->
    <section class="screen active" id="homeScreen">
      <div class="catrow">
        <div class="catimg"><img id="homeCat" alt="고양고양이"></div>
        <div class="bubble" id="homeBubble"></div>
      </div>
      <div class="panel">
        <div class="phead">
          <div style="flex:1;">
            <h2>2027 EBS 수능특강 영어</h2>
            <p id="homeMeta">불러오는 중…</p>
          </div>
        </div>
        <button class="btn resume" id="resumeBtn" type="button" hidden><span>▶ 이어 하기</span><small id="resumeSub"></small></button>
        <div class="grid" id="lessonGrid" style="padding:0 13px 13px;"></div>
      </div>
    </section>

    <!-- LESSON -->
    <section class="screen" id="lessonScreen">
      <div class="panel">
        <div class="phead">
          <button class="iconbtn" id="backHome">‹</button>

            <p id="lessonMeta"></p>
          </div>
        </div>
        <div class="exgrid" id="exList"></div>
      </div>
    </section>

    <!-- GAME -->
    <section class="screen" id="gameScreen">
      <div class="panel quiz" id="quizCard">
        <!-- 카드 머리줄: 힌트 · 남은 시간 · 고양이(확인).
             남은 시간 막대가 가로를 다 쓸 필요는 없다(26.9.14 영신) → 그 줄에 버튼을 태워
             뜻이 카드 폭을 통째로 쓴다. 맨 위에 두는 이유: 정답·오답 공개가 카드 아래에 붙으므로,
             이 줄이 중간에 있으면 공개 뒤 힌트·고양이가 본문 한가운데 끼어 갈 곳을 잃는다.
             공개 때는 같은 칸의 막대 위에 말풍선을 띄운다. 긴 대사는 머리줄 안에서 줄바꿈한다. -->
        <div class="trow">
          <div class="time-slot">
            <div class="timewrap" id="timeWrap" aria-hidden="true"><i id="timeFill"></i></div>
            <p class="cat-speech speech-reserve" id="catSpeechReserve" aria-hidden="true"></p>
            <p class="cat-speech" id="catSpeech" role="status" aria-live="polite" aria-atomic="true" hidden></p>
          </div>
          <button class="catbtn" id="catSubmit" type="button" aria-label="확인 (고양고양이 탭)">
            <img id="quizCat" alt="고양고양이">
          </button>
        </div>
        <p class="meaning" id="meaning">-</p>
        <div class="exwrap">
          <div class="hoectx" id="hoeCtx"></div>
          <!-- 투명 입력창: 문장 영역 전체를 덮어 문장을 탭하면 곧 입력창 탭(iOS 키보드 보장). 글자는 빈칸에 실시간으로 채워진다 -->
          <form class="hform" id="aform" autocomplete="off">
            <input class="ainput" id="ainput" type="text" inputmode="text" enterkeyhint="go"
                   autocapitalize="none" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="영어 정답">
            <button class="btn" id="submitBtn" type="submit" aria-hidden="true" tabindex="-1">확인</button>
            <div class="fb" id="fb" aria-live="polite"></div>

          </form>
        </div>
        <div id="mHint" hidden></div><span id="sLim" hidden></span><div class="qmini" id="qmini"></div>
        <div class="rv" id="reveal" aria-live="polite"></div>

      <div class="panel gtop">

        </div>
        <div class="bar"><i id="gProg"></i></div>
        <div class="grow2">
          <button class="ghost small" id="muteBtn2" type="button">🔊 소리</button>
          <button class="ghost small" id="exitBtn" type="button">✕ 연습 선택</button>
        </div>
      </div>
    </section>

    <!-- SUMMARY -->
    <section class="screen" id="sumScreen">
      <div class="panel sum">
        <div class="sumcat">
          <div class="cc"><img id="sumCat" alt=""></div>

  for(const n of run.nodes)if(!n.part.silent&&n.el.classList.contains('lit'))n.el.classList.add('past');
  for(const n of run.nodes){if(!all&&!n.part.silent&&n.part.beat!==beat)continue;
    n.el.classList.add('lit');n.el.classList.remove('past');
    for(const slot of n.slots){slot.classList.add(n.part.silent?'ipa-silent':'ipa-under');run.touched.push(slot);}
  }
}
function ipaEffectStart(run,u){
  if(!ipaEffectCurrent(run)||run.finished||run.started!==null||document.hidden)return;
  run.started=performance.now();run.map=ipaEffectMap(run.info);run.timing=ipaEffectTiming(run,u);
  if(!ipaEffectBuild(run))return;
  if(run.nodes[0]?.whole){ipaEffectLight(run,0);return;}
  const {duration,total,beats}=run.timing,active=duration-Math.min(140,duration*.12);let offset=0;
  for(const [beat,weight] of [...beats].sort((a,b)=>a[0]-b[0])){const at=offset;if(!at)ipaEffectLight(run,beat);else ipaEffectLater(run,()=>ipaEffectLight(run,beat),at);offset+=active*weight/total;}
}
function ipaEffectFinish(run,error=false){
  if(!ipaEffectCurrent(run)||run.finished)return;
  run.finished=true;clearTimeout(run.watchdog);
  if(!error&&run.started!==null)ipaEffectRemember(run);
  (run.visualTimers||[]).forEach(clearTimeout);run.visualTimers=[];
  if(error){ipaEffectClearVisual(run);return;}
  run.nodes.forEach(n=>n.el.classList.add('finishing'));
  ipaEffectLater(run,()=>ipaEffectClearVisual(run),250);
}
function ipaEffectAttach(u,run){
  if(!run)return;
  const start=u.onstart,end=u.onend,error=u.onerror,pause=u.onpause;
  u.onstart=e=>{if(!ipaEffectCurrent(run)||run.finished)return;start?.(e);ipaEffectStart(run,u);};
  u.onend=e=>{end?.(e);ipaEffectFinish(run);};
  u.onerror=e=>{error?.(e);ipaEffectFinish(run,true);};
  u.onpause=e=>{pause?.(e);if(ipaEffectCurrent(run)){run.unreliable=true;ipaEffectFinish(run,true);}};
  run.watchdog=setTimeout(()=>{if(ipaEffectCurrent(run)&&!run.finished){run.unreliable=true;ipaEffectFinish(run,true);}},7500);
}
function ipaEffectSilent(info,valid){
  const run=ipaEffectRequest(info,valid);if(!run)return;
  run.finished=true;run.map=ipaEffectMap(info);
  if(ipaEffectBuild(run)){ipaEffectLight(run,0,true);ipaEffectLater(run,()=>ipaEffectClearVisual(run),1200);}
}
function ipaEffectCancelAdvance(){if(ipaEffectGate)clearTimeout(ipaEffectGate.timer);ipaEffectGate=null;}
function ipaEffectAdvance(next,valid){
  ipaEffectCancelAdvance();if(!valid())return;
  const first=ipaEffectRun,now=performance.now();
  const gate={next,valid,deadline:Math.max(now,first?.created||now)+6000,timer:null};ipaEffectGate=gate;
  function poll(){
    if(ipaEffectGate!==gate)return;
    if(!valid()){ipaEffectCancelAdvance();return;}
    const run=ipaEffectRun;
    if(!ipaEffectCurrent(run)||run.finished){ipaEffectCancelAdvance();next();return;}
    const deadline=Math.min(gate.deadline,run.started===null?run.created+2500:Math.min(run.created+7500,run.started+6000));
    if(document.hidden||performance.now()>=deadline){
      run.unreliable=true;ipaEffectFinish(run,true);
      try{window.speechSynthesis?.cancel();}catch(e){}
      ipaEffectCancelAdvance();next();return;
    }
    gate.timer=setTimeout(poll,60);
  }
  poll();
}

   데이터 교체와 무관하게 유지됨. 새 항목은 "단어":"문구", 형식으로 추가. */

};

/* ===== A) 유사어 감지 → 멘트만 다르게(판정은 그대로 오답) ===== */
function splitGloss(ko){return (ko||"").split(/[,/·]|또는/)
  .map(g=>g.replace(/\(.*?\)/g,"").replace(/\s+/g," ").trim()).filter(g=>g.length>=2);}
const GLOSS=new Map();  // 뜻조각 -> Set(정규화된 영단어)
DATA.forEach(L=>L.exercises.forEach(e=>e.words.forEach(w=>{
  splitGloss(w.ko).forEach(g=>{if(!GLOSS.has(g))GLOSS.set(g,new Set());GLOSS.get(g).add(normalize(w.en));});
})));
function isSynonymMiss(typed,w){
  const g=normalize(typed);if(!g||g===normalize(w.term))return false;
  for(const gl of splitGloss(w.meaning)){const set=GLOSS.get(gl);if(set&&set.has(g))return true;}
  return false;
}
/* 철자 변형(영/미 철자 등) 판별: 같은 단어, 다른 철자 → 정답 처리하되 안내 */
function variantKey(s){return normalize(s).replace(/\s/g,"").replace(/z/g,"s");}
function isSpellingVariant(typed,term){
  const a=variantKey(typed),b=variantKey(term);
  return !!a && a===b && normalize(typed)!==normalize(term);
}

let pronunciationVoice=null,pronunciationVoiceName=null,pronunciationSeq=0,pronunciationWait=null;
function pronunciationSupported(){return !!(window.speechSynthesis&&window.SpeechSynthesisUtterance);}
function pronunciationVoiceScore(v){
  const name=v.name||"",lang=(v.lang||"").replace(/_/g,"-");
  if(!/^en(?:-|$)/i.test(lang))return -1;
  let score=/^en-US/i.test(lang)?40:20;
  const preferred=["Samantha","Google US English","Ava","Allison","Microsoft Aria","Microsoft Jenny","Microsoft Zira","Joanna","Nicky","Karen"];
  const i=preferred.findIndex(n=>name.indexOf(n)>=0);if(i>=0)score+=60-i*2;
  if(/female/i.test(name))score+=8;
  if(/\bmale\b|Alex|Daniel|Fred|Tom|Aaron|Arthur|Rishi|Oliver/i.test(name))score-=20;
  if(/compact|eloquence|novelty|Albert|Bells|Boing|Bubbles|Cellos|Jester|Junior|Organ|Ralph|Superstar|Trinoids|Whisper|Wobble|Zarvox/i.test(name))score-=40;
  if(v.localService)score+=6;return score;
}
function pickPronunciationVoice(){try{
  const voices=window.speechSynthesis.getVoices()||[];
  const american=voices.filter(v=>/^en-US(?:-|$)/i.test((v.lang||"").replace(/_/g,"-")));
  const candidates=american.length?american:voices;
  if(pronunciationVoiceName){const keep=candidates.find(v=>v.name===pronunciationVoiceName);if(keep)return keep;}
  let best=null,score=-1;for(const voice of candidates){const value=pronunciationVoiceScore(voice);if(value>score){best=voice;score=value;}}
  if(best)pronunciationVoiceName=best.name;return best;
}catch(e){return null;}}
function stopPronunciation(cancelSpeech=true){
  ipaEffectCancel();
  pronunciationSeq++;clearInterval(pronunciationWait);pronunciationWait=null;
  if(cancelSpeech&&window.speechSynthesis)try{window.speechSynthesis.cancel();}catch(e){}
}
function pronunciationEntry(term,meaning){
  const entry=MT_PRONUNCIATIONS[term]||{},specific=entry.meanings&&entry.meanings[meaning];

}
function fmtIpa(ipa){return ipaEffectStressMarkup(ipa);}

function pronunciationMarkup(term,meaning){
  const entry=pronunciationEntry(term,meaning);
  const ipa=[entry,...(Array.isArray(entry.alternatives)?entry.alternatives:[])].filter(p=>p.ipa)
    .map(p=>(p.label?esc(p.label)+" ":"")+"/"+fmtIpa(p.ipa)+"/").join(" · ");
  if(!ipa)return "";
  return pronunciationSupported()?'<button type="button" class="ov-ipa rv-inline-ipa" aria-label="'+esc(term)+' 발음 듣기">'+ipa+'</button>':'<span class="ov-ipa rv-inline-ipa">'+ipa+'</span>';
}
function pronunciationEffectInfo(term,meaning){
  const entry=pronunciationEntry(term,meaning);if(!entry.ipa)return null;
  const alternatives=Array.isArray(entry.alternatives)?entry.alternatives.filter(p=>p.ipa):[];
  return {term,ipa:entry.ipa,speech:entry.speech||term,
    forceWhole:!!entry.label||alternatives.length>0||!!entry.speech&&entry.speech!==term,
    displayIpa:[entry,...alternatives].map(p=>p.ipa).join(' · ')};
}
function speakPronunciation(term,meaning){
  const session=state.session,id=session&&session.currentId;
  if(!session||id===null||!session.answered||session.words[id]?.term!==term||!screens.game.classList.contains("active"))return;
  stopPronunciation();const seq=pronunciationSeq;
  const current=()=>seq===pronunciationSeq&&state.session===session&&session.currentId===id&&session.answered&&screens.game.classList.contains("active");
  const effectCurrent=()=>current()&&!session.copyMode;
  const info=session.copyMode?null:pronunciationEffectInfo(term,meaning);
  if(state.muted||!pronunciationSupported()){ipaEffectSilent(info,effectCurrent);return;}
  const stillRevealed=()=>current()&&!state.muted;
  const effect=ipaEffectRequest(info,()=>effectCurrent()&&!state.muted);
  const text=pronunciationEntry(term,meaning).speech||term;
  const say=()=>{if(!stillRevealed())return;try{
    const utterance=new window.SpeechSynthesisUtterance(text);
    utterance.lang=pronunciationVoice?.lang||"en-US";utterance.rate=.88;
    if(pronunciationVoice)utterance.voice=pronunciationVoice;
    ipaEffectAttach(utterance,effect);
    window.speechSynthesis.speak(utterance);
  }catch(e){ipaEffectCancel();}};
  pronunciationVoice=pickPronunciationVoice();
  if(pronunciationVoice){say();return;}
  // A late voice list cannot revive speech after the learner changes cards.
  try{const prime=new window.SpeechSynthesisUtterance(" ");prime.lang="en-US";prime.volume=0;window.speechSynthesis.speak(prime);}catch(e){}
  let tries=0;pronunciationWait=setInterval(()=>{
    if(!stillRevealed()){clearInterval(pronunciationWait);pronunciationWait=null;return;}
    pronunciationVoice=pickPronunciationVoice();
    if(pronunciationVoice||++tries>=12){clearInterval(pronunciationWait);pronunciationWait=null;say();}
  },100);
}

function fmt(ms){const s=Math.max(0,Math.floor(ms/1000));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");}
function limitFor(term){
  const letters=term.replace(/[^a-zA-Z]/g,"").length;
  const words=term.trim().split(/\s+/).filter(Boolean).length;
  return Math.min(45,Math.max(14,Math.round(8+letters*1.6+Math.max(0,words-1)*4)));
}
function normalize(v){
  return v.toLowerCase().replace(/[’‘`´]/g,"'").replace(/[‐‑‒–—−]/g,"-")
    .replace(/&/g," and ").replace(/[~().,!?;:"“”\[\]{}]/g," ").replace(/['’]/g,"")
    .replace(/[-/]/g," ").replace(/\s+/g," ").trim();
}
function isCorrect(inp,ans){
  const g=normalize(inp),t=normalize(ans);if(!g||!t)return false;
  return g===t||g.replace(/\s/g,"")===t.replace(/\s/g,"");
}
function shuffle(a){const c=[...a];for(let i=c.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[c[i],c[j]]=[c[j],c[i]];}return c;}

function abandonPerfectRun(){
  const s=state.session;
  if(s&&!s.partial&&!s.perfectRunSettled)state.perfectStreak=0;
}
function completePerfectRun(s,first){
  if(s.perfectRunSettled)return s.perfectRunCount;
  s.perfectRunSettled=true;
  if(s.partial){s.perfectRunCount=0;return 0;}
  const perfect=s.errors===0&&first===100&&s.words.length>0;
  state.perfectStreak=perfect?(state.perfectStreak||0)+1:0;
  s.perfectRunCount=state.perfectStreak;
  return s.perfectRunCount;
}

function startExercise(i){
  abandonPerfectRun();
  cancelPendingAdvance();stopPronunciation();
  const L=state.lessons[state.li],ex=visEx(L)[i];state.ei=i;
  // anti-unfair: same lesson same meaning -> any matching english accepted
  const koToEn={};
  L.exercises.forEach(e=>e.words.forEach(w=>{(koToEn[w.meaning]=koToEn[w.meaning]||new Set()).add(normalize(w.term));}));
  state.session={
    lesson:L,exercise:ex,koToEn,
    words:ex.words.map((w,id)=>({...w,id,attempts:0,corrects:0,errors:0,
      firstWrong:false,wrongEver:false,roundStreak:0,needed:1,passed:false})),
    round:0,roundName:"",queue:[],roundTargets:[],currentId:null,
    cardStart:0,cardLimit:12,totalStart:Date.now(),pausedAt:0,
    attempts:0,errors:0,firstSeen:0,firstCorrect:0,seenSet:new Set(),
    answered:false,fbMode:false,copyMode:false,copyAns:"",hints:0
  };
  saveLast(L.id,ex.title);
  $("#gKick").textContent=L.id;$("#gTitle").textContent=ex.title;
  $("#ainput").value="";$("#fb").className="fb";$("#fb").innerHTML="";
  setCat('quizCat','evil');
  show("game");startRound(1);startTicker();
  toast(pick(LINES.start));
}

function startRound(n){
  const s=state.session;s.round=n;
  if(n===1){
    // 1회독: 전체 단어, 순서대로, 1회 정답이면 통과
    s.words.forEach(w=>{w.roundStreak=0;w.passed=false;w.needed=1;});
    s.roundName="1회독";
    s.roundTargets=s.words.map(w=>w.id);
    s.queue=[...s.roundTargets];
  } else {
    // 2회독 이후: "틀린 적 있고(wrongEver) 아직 통과 못 한" 단어만 대상.
    // -> 한 번도 안 틀린 단어, 이미 2연속 맞혀 통과한 단어는 절대 다시 나오지 않음.
    const targets=s.words.filter(w=>w.wrongEver && !w.passed).map(w=>w.id);
    if(!targets.length){ return finishExercise(); }   // 더 굳힐 단어 없으면 종료
    // 이번 회독 대상 단어들의 연속 정답 카운터만 초기화(통과 상태는 유지)
    targets.forEach(id=>{const w=s.words[id];w.roundStreak=0;w.needed=2;});
    s.roundName=n+"회독";
    s.roundTargets=(n>=3)?shuffle(targets):targets;   // 3회독부터 무작위
    s.queue=[...s.roundTargets];

  $("#gRound").textContent=s.roundName;nextCard();

function nextCard(){
