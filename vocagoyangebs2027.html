  while(s.queue.length){
    const id=s.queue.shift();const w=s.words[id];
    if(s.round!==1&&w.passed)continue;
    s.currentId=id;s.answered=false;s.fbMode=false;s.copyMode=false;s.copyAns="";state.composing=false;
    s.cardLimit=limitFor(w.term);s.cardStart=Date.now();s.hintLevel=0;
    const card=$("#quizCard");clearTimeout(card._growT);card.style.height="";card.style.transition="";card.className="panel quiz";
    $("#meaning").textContent=w.meaning;
    $("#hoeCtx").innerHTML=`<div class="ex">${slots(w.term)}</div>`;
    const rv=$("#reveal");rv.className="rv";rv.innerHTML="";
    $("#qmini").style.display="";$("#timeWrap").style.visibility="";
    const _h="";
    $("#mHint").innerHTML=_h?("💡 "+esc(_h)):"";$("#mHint").hidden=!_h;$("#mHint").style.display=_h?"block":"none";
    $("#qmini").textContent="";$("#catSpeech").textContent="";$("#catSpeech").hidden=true;
    $("#ainput").value="";$("#ainput").className="ainput";$("#ainput").disabled=false;
    $("#submitBtn").disabled=false;$("#hintBtn").disabled=false;
    $("#fb").className="fb";$("#fb").innerHTML="";
    $("#ainput").oninput=null;
    setCat('quizCat','evil');
    updateStats();mirrorTyped();
    focusAnswerInput();requestAnimationFrame(focusAnswerInput);
    return;
  }
  // 회독 종료: 다음 회독으로. startRound가 남은 단어 없으면 알아서 finishExercise 호출.
  startRound(s.round+1);
}

function submit(opt={}){
  const s=state.session;if(!s||s.currentId===null)return;
  if(state.composing&&!opt.timeout&&!opt.forced)return;
  if(s.copyMode){submitCopy();return;}
  if(s.answered)return;
  const w=s.words[s.currentId];
  const typed=$("#ainput").value;
  if(!typed.trim()&&!opt.forced&&!opt.timeout&&Date.now()-s.cardStart<400)return;
  let correct=!opt.forced&&!opt.timeout&&isCorrect(typed,w.term);
  let variantHit=false;
  if(!correct&&!opt.forced&&!opt.timeout&&typed.trim()&&isSpellingVariant(typed,w.term)){correct=true;variantHit=true;}

  s.answered=true;s.revealedAt=Date.now();s.fbMode=true;s.attempts++;w.attempts++;
  // first-try accuracy
  if(!s.seenSet.has(w.id)){s.seenSet.add(w.id);s.firstSeen++;if(correct&&s.hintLevel===0&&!opt.timeout)s.firstCorrect++;}
  $("#submitBtn").disabled=true;$("#hintBtn").disabled=true;

  if(correct){
    w.corrects++;$("#ainput").classList.add("ok");
    const combo=(s.streak||0)+1;applyCorrect(w);fx(true,combo);beep("ok",combo);setCat('quizCat','win');
    const passed=w.passed;
    const line= variantHit ? ("‘"+typed.trim()+"’도 맞다고양! 근데 이 책은 ‘"+w.term+"’로 쓴다고양 ✦")
      : (passed ? ((s.streak||0)>=3?pick(LINES.correctStreak):pick(LINES.correct)) : "정답이라고양! 한 번 더 가자고양.");
    showReveal("good",w.term,w.meaning,line);
    s.streak=(s.streak||0)+1;
    scheduleNext(1200);
  } else {
    s.errors++;w.errors++;w.wrongEver=true;s.streak=0;
    if(s.round===1)w.firstWrong=true;
    applyWrong(w);fx(false);beep("bad");
    setCat('quizCat',(opt.timeout&&!typed.trim()&&CAT.blank)?'blank':(opt.timeout&&CAT.sour)?'sour':CAT.rage?'rage':'evil');
    let wline=opt.timeout?pick(LINES.timeout):pick(LINES.wrong);
    if(!opt.timeout&&isSynonymMiss(typed,w))wline=pick(SYNLINES).replace("{w}",typed.trim());
    startCopy(w.term,w.meaning,wline);
  }
  updateStats();
}
function applyCorrect(w){const s=state.session;if(s.round===1){w.passed=true;return;}
  w.roundStreak++;if(w.roundStreak>=w.needed)w.passed=true;else defer(w.id);}
function applyWrong(w){const s=state.session;if(s.round===1)return;w.roundStreak=0;w.needed=2;defer(w.id);}
function defer(id){const s=state.session;s.queue.splice(Math.min(3,s.queue.length),0,id);}

function answerInputActive(){const s=state.session;return !!(s&&s.currentId!==null&&(!s.answered||s.copyMode)&&$("#gameScreen").classList.contains("active"));}
function hasHangul(v){return /[\u1100-\u11ff\u3130-\u318f\uac00-\ud7af]/.test(v);}
function composingKey(e){return state.composing||e.isComposing||e.keyCode===229;}
function focusAnswerInput(){if(!answerInputActive())return;$("#ainput").focus({preventScroll:true});}
function handleCopyInput(){const s=state.session;if(!s||!s.copyMode)return;const v=$("#ainput").value;renderCopyBlank(v);if(!state.composing&&isCorrect(v,s.copyAns)){$("#ainput").oninput=null;submitCopy();}}
function mirrorTyped(options={}){
  const s=state.session;if(!s||s.answered||s.copyMode||s.currentId===null)return;
  const wrap=$("#hoeCtx .blanks");if(!wrap)return;const w=s.words[s.currentId],raw=$("#ainput").value;
  wrap.innerHTML=blankSlots(w.term,raw);
  if(state.composing||hasHangul(raw))return;
  // '=' and accented letters remain significant in the original MT grader.
  // Check the normalized length as well so punctuation cannot trigger an early miss.
  const entered=normalize(raw).replace(/\s/g,""),target=normalize(w.term).replace(/\s/g,"");
  const ready=isCorrect(raw,w.term)||isSpellingVariant(raw,w.term)||(entered.length>=target.length&&target.length>0);
  if(ready&&!options.fromHint)submit();
}
function blankParts(value){
  const clean=String(value||"").replace(/[^A-Za-z\u00c0-\u024f0-9=&\u1100-\u11ff\u3130-\u318f\uac00-\ud7af\s]/g,"");
  let chars="",pending=false;const breaks=new Set();
  for(const c of clean){if(/\s/.test(c)){pending=chars.length>0;continue;}if(pending)breaks.add(chars.length);chars+=c;pending=false;}
  if(pending)breaks.add(chars.length);
  return {chars,breaks,spaced:/\s/.test(clean.trimStart())};
}
function blankSlots(answer,typed="",copy=false){
  const expected=blankParts(answer),entered=blankParts(typed),n=expected.chars.length||3;
  const breaks=new Set([...expected.breaks].filter(i=>!entered.spaced||i>=entered.chars.length));
  for(const i of entered.breaks)breaks.add(i);
  const punctuation=new Map();let letters=0;
  for(const c of String(answer||"")){
    if(/[A-Za-z\u00c0-\u024f0-9=&\u1100-\u11ff\u3130-\u318f\uac00-\ud7af]/.test(c))letters++;
    else if(!/\s/.test(c))punctuation.set(letters,(punctuation.get(letters)||"")+c);
  }
  const mark=i=>punctuation.has(i)?`<span class="slot-punctuation${copy?" shown":""}" aria-hidden="true">${esc(punctuation.get(i))}</span>`:"";
  const words=[];let word=mark(0),start=0;
  for(let i=0;i<Math.max(n,entered.chars.length);i++){
    if(i>start&&breaks.has(i)){words.push(word);word="";start=i;}
    const c=entered.chars[i]||"",target=expected.chars[i]||"";
    const cls=copy?(c?(c.toLowerCase()===target.toLowerCase()?" ok":" x"):" gh"):(i>=n?" over":"");
    const letter=(copy||/[=&]/.test(target))&&!c?target:c;
    word+=`<span class="slot${cls}${i===entered.chars.length?" cur":""}"><span class="slot-glyph">${esc(letter)}</span></span>${mark(i+1)}`;
  }
  if(word)words.push(word);
  return words.map(w=>`<span class="slot-word">${w}</span>`).join(" ");
}
function slots(answer){return `<span class="blanks">${blankSlots(answer)}</span>`;}

function growCard(fill){
  const card=$("#quizCard");if(!card){fill();return;}
  const h0=card.getBoundingClientRect().height;
  card.style.height="";card.style.transition="";
  fill();
  const h1=card.getBoundingClientRect().height;
  if(Math.abs(h1-h0)<8)return;                 /* 티 안 나는 변화는 그냥 둔다 */
  if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  card.style.height=h0+"px";
  void card.offsetHeight;                       /* 리플로우를 강제해 시작점을 박는다 */
  /* 곡선 비교 실측(한 프레임 최대 이동): cubic-bezier(.22,.7,.3,1) 40px ·
     (.4,0,.2,1) 28px · (.45,.05,.25,1) 26px · (.5,.05,.25,1) 24px · ease-in-out 18px.
     ease-in-out이 계단이 가장 고르다(1,3,6,8,11,13,15,17,17,18). */
  card.style.transition="height .3s ease-in-out";
  card.style.height=h1+"px";
  clearTimeout(card._growT);
  card._growT=setTimeout(()=>{card.style.transition="";card.style.height="";},330);
}
function openReveal(kind){const card=$("#quizCard");card.classList.add(kind);$("#qmini").style.display="none";$("#timeWrap").style.visibility="hidden";const rv=$("#reveal");rv.className="rv show";
  /* scrollTo(0)은 아래로 스크롤해 둔 상태에서 화면을 통째로 튕긴다. 카드가 이미 보이면 건드리지 않는다 */
  if(card.getBoundingClientRect().top<-8)card.scrollIntoView({block:"start",behavior:"smooth"});
  return rv;}
function revealInPlace(term){
  const wrap=$("#hoeCtx .blanks");if(wrap){wrap.innerHTML=blankSlots(term,term);wrap.classList.add("revealed");enableAnswerReplay(wrap,term);wrap.querySelectorAll(".slot-punctuation").forEach(el=>el.classList.add("shown"));}
}
function showReveal(type,term,meaning,line){

    openReveal(type==="good"?"good":"bad").innerHTML="";
  });

}
function renderCopyBlank(v){const s=state.session;if(!s||!s.copyMode)return;const wrap=$("#hoeCtx .blanks");if(wrap)wrap.innerHTML=blankSlots(s.copyAns,v,true);}
function startCopy(term,meaning,line){
  const s=state.session;s.copyMode=true;s.copyAns=term;
  growCard(()=>{
    $("#hoeCtx").innerHTML=`<div class="ex">${slots(term)}</div>`;
    $("#catSpeech").textContent=line||"";$("#catSpeech").hidden=!line;
    openReveal("bad").innerHTML="";
    renderCopyBlank("");
  });
  $("#ainput").value="";$("#ainput").className="ainput";$("#ainput").disabled=false;
  $("#submitBtn").disabled=false;$("#hintBtn").disabled=true;
  $("#ainput").oninput=handleCopyInput;

function submitCopy(){
  const s=state.session;if(!s||!s.copyMode||state.composing)return;
  if(!isCorrect($("#ainput").value,s.copyAns)){
    const p=$("#quizCard");p.classList.remove("wrong");void p.offsetWidth;p.classList.add("wrong");return;
  }
  s.copyMode=false;s.copyAns="";$("#ainput").oninput=null;$("#submitBtn").disabled=true;
  const w=s.words[s.currentId];s.revealedAt=Date.now();
  revealInPlace(w.term);beep("ok");speakPronunciation(w.term,w.meaning);scheduleNext(1200);
}

function giveHint(){
  const s=state.session;if(!s||s.currentId===null||s.answered||s.copyMode||s.hintLevel>=1||state.composing||$("#hintBtn").disabled)return;
  const answer=s.words[s.currentId].term,input=$("#ainput"),typed=input.value;
  const letter=/[A-Za-z\u00c0-\u024f0-9]/,first=[...answer].findIndex(c=>letter.test(c));if(first<0)return;

/* ===== 정답 효과 손잡이 =====

     heartT / flowerT — 시간 배율(1=그대로, .7=더 빨리 사라짐). 지속·지연에 곱한다.
     petal — 꽃·불티·꽃가루 크기 배율. CSS 변수 --fx-pk 로 내려가서 여섯 연출의

             연출마다 흩어져 있는 여섯 벌의 크기 계산식을 건드리지 않는 게 요점.
     heartS — 가운데 큰 하트 크기 배율. 꽃을 키우면 하트가 상대적으로 작아 보이므로
              둘을 같이 돌려 전체 비례를 맞춘다.
     spin — 꽃이 도는 각도 배율. 산만함의 원인은 크기가 아니라 움직임이었다(26.9.15 영신).
              날면서 130°씩 도는 것은 꽃이 아니라 흩날리는 조각으로 읽힌다.
     stagger — 꽃이 하나씩 터지는 시차 배율. 시차가 길면 시선을 여러 번 새로 끈다.
              한 번에 피었다 한 번에 걷히는 쪽이 덜 산만하다.
     fly — 날아가는 거리 배율. 이건 함부로 줄이면 안 된다 — 실측으로 .68까지 내리면

              거리는 시선을 끄는 대신 글자를 비워 주는 쪽이다. 기본 1을 지킨다.

   지금은 하트만 켜 둔다(26.9.15 영신). 꽃을 접은 게 아니라 더 만져 볼 것이 남아서,

   꽃을 다시 켰다가 거슬리면 이 순서로 내린다(위에서부터 덜 잃는다):
     ① FX.spin=.2, FX.stagger=.3   움직임만 더 죽이고 꽃은 남긴다

   계산식을 고치는 대신, 만들어진 직후에 그 변수만 훑어 배율을 곱한다. 아직 스타일
   재계산 전이라 애니메이션은 곱한 값으로 시작한다(크기를 --fx-pk 하나로 민 것과 같은 수법).
   건드리지 않는 것: 원점(--x/--y), 크기(--sz·--dsz류), 방향각(--a·--pa — 이건 어디로
   가느냐지 얼마나 도느냐가 아니다), 그리고 하트(--shk-*). 하트는 문제가 없었다. */
var CALM={
  fly:["--dx","--dy","--bloomstep-dx","--bloomstep-dy","--bloomstep-sx","--d","--drop",
       "--fall","--grav","--lift","--push","--sag","--len","--rmax"],
  spin:["--rot","--bloomstep-rot","--bloomstep-fr","--bloomstep-sw","--v4rot","--v4ps",
        "--spin","--ra","--rb","--rc","--hr","--tilt"],
  dur :["--dur","--v4dur","--bloomstep-dur","--bloomstep-swd","--bloomstep-fld"],
  dly :["--dly","--del","--v4d","--bloomstep-del","--bloomstep-cdel","--bloomstep-fdl"]};
function calmFX(layer){
  if(!layer)return;
  var g=function(v){return v==null?1:v;};
  var sets=[[CALM.fly,g(FX.fly)],[CALM.spin,g(FX.spin)],
            [CALM.dur,g(FX.flowerT)],[CALM.dly,g(FX.flowerT)*g(FX.stagger)]];
  var el=layer.querySelectorAll("div,i,span,b");   /* svg 내부는 볼 것이 없다 */
  for(var i=0;i<el.length;i++){
    var st=el[i].style;
    for(var k=0;k<sets.length;k++){
      var m=sets[k][1];if(m===1)continue;
      var list=sets[k][0];
      for(var j=0;j<list.length;j++){
        var pn=list[j],v=st.getPropertyValue(pn);
        if(!v)continue;
        var n=parseFloat(v);if(!isFinite(n))continue;
        st.setProperty(pn,(n*m)+v.trim().replace(/^[+-]?[\d.]+/,""));}}}}

/* ===== bloomstep · 단계 개화 (stepped bloom) =====
   periodic-game의 animateBigBohr() — 핵 → 껍질 한 겹씩 → 최외각 — 을 꽃으로 옮긴 것.
   한 번에 다 터뜨리지 않고 "겹"을 시간축에 펼쳐 쌓이는 맛을 낸다.

   다만 보어 모형의 동심원을 그대로 옮기면 안 된다. 예문 줄이 가로로 누워 있어서
   원을 그리면 반드시 글자 위에 앉는다. 그래서 "겹"은 유지하되 방향은 글자가 없는
   세 군데(위 모서리 · 좌우 빈 주머니 · 카드 아래 어둠)로만 보낸다.
   겹이 바깥일수록 멀리·크게 → 콤보가 오르면 겹이 늘어 크기 중앙값이 저절로 올라간다. */
window.stepFlowerFX=function(layer,x,y,o){
  o=o||{};
  var R=Math.random;
  var c=Math.max(1,Math.min(40,o.combo||o.petals||1));
  var dist=o.dist||1;

  /* --- 겹(고리) 수: 보어 껍질처럼 콤보 단계로 늘어난다 --- */
  var rings = c<3?2 : (c<6?3 : (c<12?4 : 5));

  var step    = rings<=2?130 : (rings===3?105 : (rings===4?82  : 66));  /* ms, 겹 사이 */
  var baseDur = rings<=2?640 : (rings===3?575 : (rings===4?545 : 520)); /* ms, 한 송이 */
  var intra   = rings<=2?14  : (rings===3?12  : (rings===4?9   : 7));   /* ms, 같은 겹 안 */

  /* --- 송이 수 --- */
  var total=Math.round(Math.min(28,7+c*1.05)), w=[], sw=0, r;
  for(r=0;r<rings;r++){w.push(r+2);sw+=r+2;}

  /* --- 거리·크기 배율: 둘 다 콤보와 함께 커진다 --- */

  var szK  =1+Math.min(c,20)/20*0.22;      /* 콤보1 ≈1.01, 콤보20 =1.22 */

  /* 화면 밖으로 다 날아가 버리면 콤보가 높을수록 도리어 휑해진다.
     방향은 그대로 두고 길이만 줄여 착지점을 화면 안에 붙든다. */
  var W=layer.clientWidth||window.innerWidth||390, Hh=layer.clientHeight||window.innerHeight||760;
  var LX0=-18, LX1=W+18, LY0=-30, LY1=Hh*0.88;
  var clamp=function(v){
    var k=1,t;
    if(v[0]<0){t=(LX0-x)/v[0];if(t<k)k=t;} else if(v[0]>0){t=(LX1-x)/v[0];if(t<k)k=t;}
    if(v[1]<0){t=(LY0-y)/v[1];if(t<k)k=t;} else if(v[1]>0){t=(LY1-y)/v[1];if(t<k)k=t;}
    if(k<0)k=0;v[0]*=k;v[1]*=k;};

       위   — 카드 윗테두리 바깥(헤더 글자보다 위). 위쪽은 110px뿐이라
              겹이 바깥일수록 더 높이가 아니라 더 옆으로 벌어진다(윗단 화환).
       옆   — 카드 좌·우 빈 주머니(뜻·발음기호가 가운데 좁게 있어 양옆이 비었다)

    var upDy=-(94+r*3)*distK,   upDx=(138+r*9)*distK;
    var sdDy=(84+r*6)*distK,    sdDx=(106+r*14)*distK;

    /* 갈래 배분. 좌·우 주머니는 세로로 80px밖에 안 돼 겹을 여러 장 못 받는다.
       그래서 안쪽 세 겹만 옆으로 보내고, 바깥 겹은 자리가 넓은 위·아래로 뿌린다.

      var t=laneN[br]<2?0:((k/(laneN[br]-1))*2-1);
      t+=(R()-.5)*0.30;
      var jit=0.90+R()*0.20;

      /* 위 — 헤더 글자(가로 85~295px)를 피해 좌·우 위 모서리로 */

      else if(br===1){var sgn=(k%2?1:-1);dx=sgn*sdDx*(0.92+Math.abs(t)*0.22)*jit;dy=sdDy*jit;}

      f.style.setProperty("--bloomstep-x",x+"px");
      f.style.setProperty("--bloomstep-y",y+"px");
      f.style.setProperty("--bloomstep-sz",(sz*(0.92+R()*0.18)).toFixed(1)+"px");
      f.style.setProperty("--bloomstep-dx",dx.toFixed(1)+"px");
      f.style.setProperty("--bloomstep-dy",dy.toFixed(1)+"px");
      f.style.setProperty("--bloomstep-rot",((R()*2-1)*140).toFixed(0)+"deg");
      f.style.setProperty("--bloomstep-del",FXt(rDel+i*intra)+"ms");
      f.style.setProperty("--bloomstep-dur",FXt(baseDur+Math.round(R()*40))+"ms");
      f.style.setProperty("--bloomstep-cdel",Math.min(220,rDel)+"ms");

      /* 살랑 1 — 송이가 통째로 나부낀다 */
      var s=document.createElement("div");s.className="bloomstep-s";
      s.style.setProperty("--bloomstep-sw",(8+R()*7).toFixed(1)+"deg");
      s.style.setProperty("--bloomstep-sx",((R()*2-1)*5).toFixed(1)+"px");
      s.style.setProperty("--bloomstep-swd",FXt(150+R()*90).toFixed(0)+"ms");
      s.style.setProperty("--bloomstep-del",FXt(rDel+i*intra)+"ms");

      /* 살랑 2 — 꽃잎면이 바람 받아 돌아눕는다 */

      p.style.setProperty("--bloomstep-fa",(0.66+R()*0.16).toFixed(2));
      p.style.setProperty("--bloomstep-fr",(3+R()*5).toFixed(1)+"deg");
      p.style.setProperty("--bloomstep-fld",FXt(110+R()*70).toFixed(0)+"ms");
      p.style.setProperty("--bloomstep-fdl",FXt(rDel+i*intra+Math.round(R()*60))+"ms");
      p.innerHTML=pool[(idx+poff)%pool.length];

      s.appendChild(p);f.appendChild(s);layer.appendChild(f);
      idx++;
    }
  }

function burst(layer,x,y,o){
  var R=Math.random;
  var mk=function(cls,html){var d=document.createElement("div");d.className=cls;
    d.style.setProperty("--x",x+"px");d.style.setProperty("--y",y+"px");
    if(html)d.innerHTML=html;layer.appendChild(d);return d;};
  var P=o.petals|0,D=o.dots|0,dist=o.dist||1,c=Math.max(1,o.combo||P||1);
  /* 1층 — 중앙 하트 광원 */
  /* 1층 — 하트: 빛나는 윤곽이 퍼진다(속을 채우지 않으므로 글자가 비쳐 읽힌다). 콤보가 오를수록 겹이 는다 */
  /* 중앙 하트는 여기서 만들지 않는다 — 부르는 쪽(fx·fxHeart)이 딱 한 번 얹는다.
     BURSTS[0].fn이 burst를 감싼 함수라 "합본이면 건너뛰기" 같은 가드가 안 먹어
     하트가 두 겹씩 깔렸다(실측 [285,285]). 호출 지점을 하나로 모아 막는다. */
  /* 3층 — 꽃: 종류는 콤보 단계로, 색은 분홍에서 시작해 단계마다 넓어진다 */
  /* 한 번에 터뜨리지 않고 겹을 시간축에 펼친다(periodic-game의 보어 껍질 얼개).
     겹이 바깥일수록 멀리·크게 → 콤보가 오르면 꽃 크기 중앙값이 저절로 올라간다.
     예전 코드는 콤보가 오를수록 작은 종이 섞여 오히려 작아졌다. */

  /* 4층 — 금빛 불티 */
  for(var j=0;j<D;j++){var dd=mk("dot");var aa=Math.PI*2*j/D+(R()-.5)*.8,dd2=(40+R()*70)*dist;
    dd.style.setProperty("--dx",Math.cos(aa)*dd2+"px");dd.style.setProperty("--dy",Math.sin(aa)*dd2+"px");
    dd.style.setProperty("--dur",(.7+R()*.2)+"s");}

  if(o.edge)mk("edge");

  var H=o.hearts||0;for(var k=0;k<H;k++){var hd=mk("pt",F_PHEART);
    hd.style.color="hsl("+HUES[(k*5)%HUES.length]+",100%,68%)";hd.style.setProperty("--glow",hd.style.color);
    var ha=Math.PI*2*k/H+Math.PI/H,hr=(60+R()*60)*dist;
    hd.style.setProperty("--sz",(16+R()*10)+"px");
    hd.style.setProperty("--dx",Math.cos(ha)*hr+"px");
    hd.style.setProperty("--dy",(Math.sin(ha)*hr-20)+"px");
    hd.style.setProperty("--rot",(R()*90-45)+"deg");
    hd.style.setProperty("--dur",(1+R()*.3)+"s");}
  if(o.heart)mk("hpop",heartSVG());
}

/* burstV1(layer,x,y,o) — o: {petals,dots,dist, combo,loose, ring,edge,flash,hearts,heart}

  '<defs><radialGradient id="'+id+'" cx="50%" cy="44%" r="62%">'+
  '<stop offset="0%" stop-color="#ffffff" stop-opacity=".95"/>'+
  '<stop offset="30%" stop-color="#ffe9a8" stop-opacity=".60"/>'+
  '<stop offset="62%" stop-color="#ff8ac6" stop-opacity=".32"/>'+
  '<stop offset="100%" stop-color="#ff4fa3" stop-opacity="0"/>'+
  '</radialGradient></defs>'+
  '<path d="'+V2HEART+'" fill="url(#'+id+')"/></svg>';}
function v2RingSVG(){return '<svg viewBox="0 0 100 100" aria-hidden="true">'+
  '<path d="'+V2HEART+'" fill="none" stroke="#ffffff" stroke-linejoin="round" stroke-width="12"/></svg>';}

/* 콤보 → 옵션. fx() 에서 burstV2(layer,x,y,v2Opts(c)) 로 쓰면 된다 */
function v2Opts(c){c=Math.max(1,c||1);
  /* 꽃 바닥 8 — 콤보1에 한 송이만 뜨던 것(fx의 petals와 같은 규칙) */
  return {petals:Math.min(40,Math.max(8,c)),dots:Math.min(24,5+c),flash:true,ring:c>=5,edge:c>=10,dist:1+Math.min(15,c)*.05};}

function burstV2(layer,x,y,o){
  o=o||{};
  var R=Math.random, dm=o.dist||1, cap=Math.min(1.75,dm);
  var put=function(cls,html,sz){var d=document.createElement("div");d.className=cls;
    d.style.setProperty("--x",x+"px");d.style.setProperty("--y",y+"px");
    if(sz!=null)d.style.setProperty("--sz",sz+"px");
    if(html)d.innerHTML=html;layer.appendChild(d);return d;};

  /* 1) 하트 광원 */
  if(o.flash)put("v2-glow",v2GlowSVG()).style.setProperty("--gsz",Math.round(104+30*cap)+"px");
  /* 2) 하트 충격파(콤보 5+) */
  if(o.ring)put("v2-ring",v2RingSVG());

  /* 3) 선발 섬광 줄기 — 꽃보다 먼저 튀어나가 궤적을 그린다 */
  var T=(o.trails==null)?Math.max(3,Math.min(10,3+Math.round((o.petals||1)*.28))):o.trails;
  for(var i=0;i<T;i++){
    var a=-90+360*i/T+(R()-.5)*24, d=put("v2-tr");
    d.style.setProperty("--a",a.toFixed(1)+"deg");
    d.style.setProperty("--len",(17+R()*15).toFixed(1)+"px");
    d.style.setProperty("--d",((52+R()*50)*dm).toFixed(1)+"px");
    d.style.setProperty("--glow",v2hsl(330+360*i/T,74));
    d.style.setProperty("--dur",(.32+R()*.14).toFixed(3)+"s");
    d.style.setProperty("--del",(R()*.05).toFixed(3)+"s");
  }

  /* 4) 2단 분출 본체: 래퍼=포물선 궤적, 자식=흩날림(회전축·펄럭임·축소) */
  var fly=function(kind,i,n){
    var narrow=n<=3;
    var a=narrow ? (-Math.PI/2+(i-(n-1)/2)*.95+(R()-.5)*.18)
                 : (-Math.PI/2+Math.PI*2*i/n+(R()-.5)*.48);
    var dist=(74+R()*70)*dm;
    var hue=330+360*i/n+(R()-.5)*26;
    var sz=kind==="h" ? (15+R()*9) : Math.max(12,25-Math.min(12,(n-1)*.40))+R()*3;
    var dur=(narrow?.84:.74)+R()*.24;
    var del=(n<=2?0:(i/n)*Math.min(.18,.05+n*.006))+R()*.03;
    var w=put("v2-p",null,sz.toFixed(1));
    w.style.setProperty("--dx",(Math.cos(a)*dist).toFixed(1)+"px");
    w.style.setProperty("--dy",(Math.sin(a)*dist*.82).toFixed(1)+"px");
    w.style.setProperty("--lift",(12+R()*22).toFixed(1)+"px");
    w.style.setProperty("--grav",((24+R()*40)*(.7+cap*.3)).toFixed(1)+"px");
    w.style.setProperty("--spin",((R()<.5?-1:1)*(200+R()*340)).toFixed(0)+"deg");
    w.style.setProperty("--sk",(.92+R()*.14).toFixed(3));
    w.style.setProperty("--dur",dur.toFixed(3)+"s");
    w.style.setProperty("--del",del.toFixed(3)+"s");
    w.style.setProperty("--glow",v2hsl(hue,74));
    var inner=document.createElement("div");
    inner.className="v2-i"+(n>24?" v2-lite":"");
    inner.innerHTML=(kind==="h")?v2HeartSVG(hue):v2BloomSVG(hue);
    /* 회전축을 요소마다 다르게: 아트워크를 정적으로 돌려 펄럭임 축을 기울인다 */
    if(inner.firstChild&&inner.firstChild.style)inner.firstChild.style.transform="rotate("+Math.round(R()*360)+"deg)";
    w.appendChild(inner);
  };
  var P=o.petals||0;for(var p=0;p<P;p++)fly("f",p,P);
  var H=o.hearts||0;for(var q=0;q<H;q++)fly("h",q,H);

  /* 5) 불티: 같은 중력을 받는다 */
  var D=o.dots||0,tone=["#ffd34d","#ff8ac6","#7cffb2","#5ce6ff"];
  for(var k=0;k<D;k++){
    var ka=-Math.PI/2+Math.PI*2*k/D+(R()-.5)*.7, kd=(44+R()*72)*dm;
    var e=put("v2-d",null,(3.5+R()*3.5).toFixed(1));
    e.style.setProperty("--dx",(Math.cos(ka)*kd).toFixed(1)+"px");
    e.style.setProperty("--dy",(Math.sin(ka)*kd*.85).toFixed(1)+"px");
    e.style.setProperty("--lift",(8+R()*20).toFixed(1)+"px");
    e.style.setProperty("--grav",(28+R()*48).toFixed(1)+"px");
    e.style.setProperty("--glow",tone[k%4]);
    e.style.setProperty("--dur",(.48+R()*.24).toFixed(3)+"s");
    e.style.setProperty("--del",(R()*.12).toFixed(3)+"s");
  }

  if(o.edge)put("v2-edge");
  if(o.heart)put("v2-hpop",v2HeartSVG(335));
}

/* ── 연결 방법 (기존 fx() 의 good 분기 2줄만 교체. 'N COMBO' 텍스트는 제거) ──
   const [x,y]=fxOrigin($("#hoeCtx .fill")||card);
   burstV2(layer,x,y,v2Opts(Math.max(1,combo||1)));
   // comboPop(...) 호출은 지운다 (꽃 개수가 콤보를 표현)
   그리고 fxHeart 는:
   burstV2(layer,x,y,{heart:true,hearts:7,dots:8,ring:true,flash:true,dist:1.2});
   ───────────────────────────────────────────────────────────────────────── */
/* ===== 꽃 v4 · 피어나는 하트꽃 ===== */
/* ===================== v4 · 피어나는 꽃 (blooming flower) =====================
   burstV4(layer,x,y,o) — o={petals,dots,dist, ring,edge,flash, hearts,heart, tw}
   · 봉오리가 솟아 → 꽃잎이 벌어져 피고 → 흩어진다(2단 연출)
   · 요소 폭발 방지: 앞의 2~3송이(히어로)만 꽃잎 6장을 개별 요소로 두고,
     나머지는 1요소 통짜 SVG가 "비틀림→펴짐" 스케일로 피어난다(LOD)
   · SVG 문자열은 최초 1회만 만들고 <template>+cloneNode 로 복제(파싱비용 1회)
   · 숫자 텍스트는 쓰지 않는다(꽃 개수가 콤보를 표현)
   ========================================================================= */
const V4_HUES=[335,312,352,18,45,74,150,188];   /* 어두운 보라 배경에서 죽는 남·자보라(250~300)는 제외 */
const V4_HEART="M50 87C17 64 7 47 7 32 7 18.5 17.6 9.5 29 9.5 37.8 9.5 45 14.5 50 22.5 55 14.5 62.2 9.5 71 9.5 82.4 9.5 93 18.5 93 32 93 47 83 64 50 87Z";
function v4hsl(h,l){return "hsl("+Math.round(h)+",95%,"+l+"%)";}

/* 꽃잎 1장(히어로용). 밑동이 (8,25) = transform-origin 50% 100% */
function v4PetalSVG(){return '<svg viewBox="0 0 16 25" aria-hidden="true">'+
  '<path d="M8 24.6C1.6 19-.2 11.6 2.2 6.4 3.8 2.9 5.9 1 8 1c2.1 0 4.2 1.9 5.8 5.4 2.4 5.2.6 12.6-5.8 18.2z" fill="currentColor" stroke="rgba(255,255,255,.9)" stroke-width="1.3" stroke-linejoin="round"/>'+
  '<path d="M8 24.4C5 21.8 3.4 18.9 2.7 15.5 4.6 17.7 6.2 18.9 8 19.5c1.8-.6 3.4-1.8 5.3-4 -.7 3.4-2.3 6.3-5.3 8.9z" fill="rgba(255,255,255,.26)"/>'+
  '<path d="M8 21.4C4.4 16.9 3.4 11.3 5 7.3 6 4.9 7 3.3 8 2.7" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.5" stroke-linecap="round"/>'+
  '</svg>';}
/* 꽃심(수술) */
function v4CoreSVG(){return '<svg viewBox="0 0 20 20" aria-hidden="true">'+
  '<circle cx="10" cy="10" r="6" fill="#ffd34d"/><circle cx="10" cy="10" r="3.1" fill="#fff7d6"/>'+
  '<g fill="#fff" opacity=".92"><circle cx="10" cy="4.8" r="1.05"/><circle cx="14.9" cy="8.1" r="1.05"/><circle cx="12.9" cy="13.9" r="1.05"/><circle cx="7.1" cy="13.9" r="1.05"/><circle cx="5.1" cy="8.1" r="1.05"/></g>'+
  '</svg>';}
/* 통짜 꽃(1요소). rich=겉꽃잎6+속꽃잎6+꽃심, lite=겉꽃잎6+꽃심 */
function v4FlowerSVG(rich){
  const out="M20 20c-6.4-2.6-9.6-7.4-8.4-11.4C12.4 5.8 15.8 3.4 20 3.4s7.6 2.4 8.4 5.2C29.6 12.6 26.4 17.4 20 20z";
  const inn="M20 20c-3.6-1.6-5.4-4.4-4.7-7 .5-1.8 2.5-3.2 4.7-3.2s4.2 1.4 4.7 3.2c.7 2.6-1.1 5.4-4.7 7z";
  let s='<svg viewBox="0 0 40 40" aria-hidden="true">';
  for(let k=0;k<6;k++)s+='<path d="'+out+'" transform="rotate('+(k*60)+' 20 20)" fill="currentColor" stroke="rgba(255,255,255,'+(rich?".85":".7")+')" stroke-width="'+(rich?1.1:1)+'" stroke-linejoin="round"/>';
  if(rich)for(let k=0;k<6;k++)s+='<path d="'+inn+'" transform="rotate('+(k*60+30)+' 20 20)" fill="rgba(255,255,255,.42)"/>';
  s+='<circle cx="20" cy="20" r="'+(rich?4.4:4)+'" fill="#ffd34d"/>';
  if(rich)s+='<circle cx="20" cy="20" r="2.1" fill="#fff6d5"/>';
  return s+'</svg>';}
/* 반짝 별 */
function v4StarSVG(){return '<svg viewBox="0 0 24 24" aria-hidden="true">'+
  '<path d="M12 0l1.9 10.1L24 12l-10.1 1.9L12 24l-1.9-10.1L0 12l10.1-1.9z" fill="#fff"/>'+
  '<path d="M12 5l1 6 6 1-6 1-1 6-1-6-6-1 6-1z" fill="#ffe08a"/></svg>';}
/* 하트(파티클·팝업용) */
function v4HeartSVG(){return '<svg viewBox="0 0 100 100" aria-hidden="true">'+
  '<path d="'+V4_HEART+'" fill="#ff4fa3" stroke="#fff" stroke-width="6" stroke-linejoin="round"/>'+
  '<path d="M36 26c-6 2-9.6 8-8.6 14" fill="none" stroke="#ffd7ea" stroke-width="6" stroke-linecap="round" opacity=".9"/></svg>';}
/* 중앙 광원 = 하트(원형 아님). 가운데를 일부러 옅게 비워 글자가 읽힌다 */
function v4HeartGlowSVG(id){return '<svg viewBox="0 0 100 100" aria-hidden="true">'+
  '<defs><radialGradient id="'+id+'" cx="50%" cy="44%" r="56%">'+
  '<stop offset="0%" stop-color="#ffffff" stop-opacity=".28"/>'+
  '<stop offset="34%" stop-color="#ffffff" stop-opacity=".50"/>'+
  '<stop offset="58%" stop-color="#ff9ed4" stop-opacity=".46"/>'+
  '<stop offset="80%" stop-color="#ff4fa3" stop-opacity=".20"/>'+
  '<stop offset="100%" stop-color="#ff4fa3" stop-opacity="0"/>'+
  '</radialGradient></defs>'+
  '<path d="'+V4_HEART+'" fill="url(#'+id+')"/>'+
  '<path d="'+V4_HEART+'" fill="none" stroke="#ffffff" stroke-opacity=".7" stroke-width="2.2" stroke-linejoin="round"/>'+
  '</svg>';}
/* 퍼지는 하트 윤곽(5연속부터). 채움이 없어 글자를 가리지 않는다 */
function v4HeartRingSVG(){return '<svg viewBox="0 0 100 100" aria-hidden="true">'+
  '<path d="'+V4_HEART+'" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linejoin="round"/>'+
  '<path d="'+V4_HEART+'" fill="none" stroke="#ffd34d" stroke-width="1.2" stroke-linejoin="round" transform="translate(50 50) scale(.8) translate(-50 -50)"/>'+
  '</svg>';}

let v4T=null,v4uid=0;
function v4Tpl(){
  if(v4T)return v4T;
  const t=h=>{const e=document.createElement("template");e.innerHTML=h;return e;};
  let ph="";for(let i=0;i<6;i++)ph+='<i class="v4-pt" style="--pa:'+(i*60)+'deg">'+v4PetalSVG()+'</i>';
  v4T={hero:t(ph+'<i class="v4-core">'+v4CoreSVG()+'</i>'),
       rich:t(v4FlowerSVG(true)),lite:t(v4FlowerSVG(false)),
       star:t(v4StarSVG()),heart:t(v4HeartSVG()),hring:t(v4HeartRingSVG())};
  return v4T;}

function burstV4(layer,x,y,o){
  o=o||{};const T=v4Tpl(),R=Math.random,uid=++v4uid,dist=o.dist||1,UP=-Math.PI/2;
  const mk=(cls,key)=>{const d=document.createElement("div");d.className=cls;
    d.style.setProperty("--x",x+"px");d.style.setProperty("--y",y+"px");
    if(key)d.appendChild(T[key].content.cloneNode(true));
    layer.appendChild(d);return d;};
  const xy=(d,a,r,lift)=>{d.style.setProperty("--dx",(Math.cos(a)*r).toFixed(1)+"px");
    d.style.setProperty("--dy",(Math.sin(a)*r*.88-(lift||0)).toFixed(1)+"px");};

  /* 1) 중앙 광원(하트) + 하트 윤곽 */
  if(o.flash){mk("v4-glow").innerHTML=v4HeartGlowSVG("v4hg"+uid);}
  if(o.ring)mk("v4-hring","hring");

  /* 2) 꽃: 앞 2~3송이는 꽃잎 개별요소(히어로), 나머지는 1요소 통짜 */
  const P=Math.max(0,Math.min(40,o.petals|0));
  const hero=P<=2?P:(P<=8?3:2);
  for(let i=0;i<P;i++){
    const isHero=i<hero;
    const a=UP+Math.PI*2*(i+(i&1)*.5)/Math.max(1,P)+(R()-.5)*(P>6?.5:.9);
    const rad=(44+R()*30+P*.95)*dist;
    const d=isHero?mk("v4-fl","hero"):mk(i<18?"v4-bl":"v4-bl v4-lite",i<18?"rich":"lite");
    const h=(V4_HUES[i%V4_HUES.length]+R()*14-7+360)%360;
    d.style.color=v4hsl(h,70);
    d.style.setProperty("--v4g",v4hsl(h,64));
    xy(d,a,rad,10);
    d.style.setProperty("--v4rot",(R()*54-27).toFixed(1)+"deg");
    d.style.setProperty("--v4ps",(8+R()*14).toFixed(1)+"deg");
    if(isHero){
      d.style.setProperty("--v4s",(.82+R()*.18).toFixed(3));
      d.style.setProperty("--v4dur",(.94+R()*.12).toFixed(3)+"s");
      d.style.setProperty("--v4d",(i*.045+R()*.03).toFixed(3)+"s");
    }else{
      d.style.setProperty("--sz",(15+R()*8).toFixed(1)+"px");
      d.style.setProperty("--v4s",(.88+R()*.14).toFixed(3));
      d.style.setProperty("--v4dur",(.82+R()*.14).toFixed(3)+"s");
      d.style.setProperty("--v4d",(i/Math.max(1,P)*.17+R()*.05).toFixed(3)+"s");
    }
  }

  /* 3) 불티(꽃가루) */
  const D=Math.max(0,Math.min(18,o.dots|0));
  for(let i=0;i<D;i++){const d=mk("v4-dot");
    xy(d,UP+Math.PI*2*(i+.5)/Math.max(1,D)+(R()-.5)*.9,(30+R()*62)*dist,4);
    d.style.setProperty("--v4g",v4hsl(V4_HUES[i*3%V4_HUES.length],66));
    d.style.setProperty("--sz",(2.4+R()*2.4).toFixed(1)+"px");
    d.style.setProperty("--v4dur",(.42+R()*.14).toFixed(3)+"s");
    d.style.setProperty("--v4d",(R()*.08).toFixed(3)+"s");}

  /* 4) 반짝임(제자리 점멸, 이동 없음) */
  const W=o.tw==null?Math.min(8,2+Math.round(P/5)):Math.max(0,Math.min(10,o.tw|0));
  for(let i=0;i<W;i++){const d=mk("v4-tw","star");
    xy(d,R()*Math.PI*2,(26+R()*74)*dist,6);
    d.style.setProperty("--sz",(9+R()*8).toFixed(1)+"px");
    d.style.setProperty("--v4dur",(.44+R()*.16).toFixed(3)+"s");
    d.style.setProperty("--v4d",(.06+R()*.46).toFixed(3)+"s");}

  /* 5) 하트 파티클 / 가장자리 금빛 / 중앙 하트 팝(결과화면 호환) */
  const H=Math.max(0,Math.min(14,o.hearts|0));
  for(let i=0;i<H;i++){const d=mk("v4-heart","heart");
    xy(d,UP+Math.PI*2*(i+.5)/Math.max(1,H),(52+R()*54)*dist,16);
    d.style.setProperty("--sz",(15+R()*9).toFixed(1)+"px");
    d.style.setProperty("--v4rot",(R()*50-25).toFixed(1)+"deg");
    d.style.setProperty("--v4dur",(.86+R()*.16).toFixed(3)+"s");
    d.style.setProperty("--v4d",(i*.03+R()*.05).toFixed(3)+"s");}
  if(o.edge)mk("v4-edge");
  if(o.heart)mk("v4-hpop","heart");
}

/* ── 붙이는 법 ──────────────────────────────────────────────────────────────
   fx() 안의  burst(layer,x,y,o);         →  burstV4(layer,x,y,o);
   fxHeart() 안의  burst(layer,x,y,{...}) →  burstV4(layer,x,y,{...})
   기존 fx()의 o(={petals,dots,flash,ring,edge,dist})를 그대로 받는다.
   숫자 텍스트(N COMBO)는 만들지 않는다. dots는 성능상 18개로 내부 클램프.
   ────────────────────────────────────────────────────────────────────────── */
/* ===== 꽃 v6 · 콤보 서사 꽃비 ===== */
/* ===== v6 · 콤보 서사(combo narrative) : 단계가 올라갈수록 연출이 진화한다. 숫자 텍스트는 쓰지 않는다 ===== */
/* 1~2연속  조용한 한두 송이(분홍 한 색, 19~28px) + 작은 하트 광원
   3~5연속  꽃 종류 2가지(장미+블로섬) + 흰 링, 색폭이 분홍→금빛으로 벌어진다
   6~9연속  꽃 3가지(+벚꽃) + 하트 꽃가루 + 반짝 별, 금빛 점선 링이 하나 더
   10연속+  화면 가장자리 금빛 + 큰 하트 광원이 한 번 맥동 + 금빛 리본, 색은 완전 무지개
   단계 진입(3·6·10·20·30·40)에는 분홍 파동 링이 한 번 더 돌아 '보상'이 된다 */
let v6uid=0;
const V6_HEART_D="M50 90C14 65 4 47 4 31 4 17 15 7.5 28 7.5 38 7.5 45.5 13 50 21.5 54.5 13 62 7.5 72 7.5 85 7.5 96 17 96 31 96 47 86 65 50 90Z";
/* 장미: 겹겹 나선. 바깥 두 겹은 currentColor(콤보 색), 안쪽은 흰 하이라이트+금빛 수술.
   맨 뒤 반투명 원이 filter 없이도 빛번짐처럼 보이게 한다 */
const V6_ROSE='<svg viewBox="0 0 24 24" aria-hidden="true">'+
  '<circle cx="12" cy="11" r="10.4" fill="currentColor" opacity=".15"/>'+

    ry.style.setProperty("--len",Math.round((long?128:82)*(.8+R()*.5)*dist)+"px");
    ry.style.setProperty("--w",(long?3.4:2.2)+"px");
    ry.style.setProperty("--rc",rcol[r%rcol.length]);
    ry.style.setProperty("--push",(14+R()*18)+"px");
    ry.style.setProperty("--del",(r*.012)+"s");
    ry.style.setProperty("--dur",(.34+R()*.12)+"s");}

  /* 4층 — 꽃. 개수가 적으면 크게(1송이도 빈약하지 않게), 많으면 작게 + 3겹 껍질로 흩뿌려
     40송이에도 중앙 글자 위가 아니라 고리 모양으로 퍼진다 */
  var base=R()*Math.PI*2,fsz=P<=2?25:(P<=6?22:(P<=16?19:16));
  for(var i=0;i<P;i++){
    var f=mk("v3-flower",V3_FLOWER);
    var a=(P<=3)?(-Math.PI/2+(i-(P-1)/2)*.9+(R()-.5)*.3)   /* 1~3송이는 위로 피어오른다 */
                :(base+Math.PI*2*i/P+(R()-.5)*(P>8?.5:.32));
    var shell=(i%3===0)?.66:((i%3===1)?.88:1.12);
    var rad=(64+R()*52)*shell*dist;
    var h=hueAt(i,P);
    f.style.setProperty("--hr",Math.round((h-V3_BASEH+360)%360)+"deg");
    f.style.setProperty("--glow","hsl("+Math.round(h)+",100%,72%)");
    f.style.setProperty("--sz",(fsz+R()*4-2).toFixed(1)+"px");
    f.style.setProperty("--dx",Math.round(Math.cos(a)*rad)+"px");
    f.style.setProperty("--dy",Math.round(Math.sin(a)*rad-9)+"px");
    f.style.setProperty("--rot",Math.round(R()*300-150)+"deg");
    f.style.setProperty("--del",((i%5)*.018).toFixed(3)+"s");
    f.style.setProperty("--dur",(.86+R()*.18).toFixed(2)+"s");}

  /* 5층 — 흰 불티 */
  for(var s=0;s<D;s++){var sp=mk("v3-spark");
    var sa=Math.PI*2*s/Math.max(1,D)+(R()-.5)*.9,sd=(34+R()*56)*dist;
    sp.style.setProperty("--sz",(3+R()*2.4).toFixed(1)+"px");
    sp.style.setProperty("--sc",s%3?"#fff":"#ffe9a8");
    sp.style.setProperty("--dx",Math.round(Math.cos(sa)*sd)+"px");
    sp.style.setProperty("--dy",Math.round(Math.sin(sa)*sd)+"px");
    sp.style.setProperty("--dur",(.38+R()*.1).toFixed(2)+"s");}

  /* 6층 — 늦게(0.2~0.44초 뒤) 반짝이며 떨어지는 금빛 꽃가루 */
  for(var p=0;p<pol;p++){var pl=mk("v3-pollen");
    var pa=R()*Math.PI*2,pd=(26+R()*62)*dist;
    pl.style.setProperty("--sz",(3.4+R()*2.2).toFixed(1)+"px");
    pl.style.setProperty("--pc",p%4===0?"#ff8ac6":(p%4===1?"#7cffb2":"#ffd34d"));
    pl.style.setProperty("--dx",Math.round(Math.cos(pa)*pd)+"px");
    pl.style.setProperty("--dy",Math.round(Math.sin(pa)*pd*.7-14)+"px");
    pl.style.setProperty("--fall",Math.round(20+R()*28)+"px");
    pl.style.setProperty("--del",(.2+R()*.24).toFixed(2)+"s");
    pl.style.setProperty("--dur",(.6+R()*.18).toFixed(2)+"s");}

  /* 7층 — 콤보 10+ 화면 가장자리 금빛 */
  if(o.edge)mk("v3-edge");

  /* 호환 — 날아가는 하트 / 큰 하트 팝 (fxHeart 용) */
  var H=Math.max(0,o.hearts|0);
  for(var k=0;k<H;k++){var ht=mk("v3-heart",V3_HEART);
    var ha=Math.PI*2*k/Math.max(1,H)+Math.PI/Math.max(1,H)*.5,hd=(58+R()*54)*dist;
    ht.style.setProperty("--sz",(16+R()*9).toFixed(1)+"px");
    ht.style.setProperty("--glow","#ff8ac6");
    ht.style.setProperty("--dx",Math.round(Math.cos(ha)*hd)+"px");
    ht.style.setProperty("--dy",Math.round(Math.sin(ha)*hd-22)+"px");
    ht.style.setProperty("--rot",Math.round(R()*70-35)+"deg");
    ht.style.setProperty("--dur",(.9+R()*.2).toFixed(2)+"s");}
  if(o.heart){var hp=mk("v3-hpop",V3_HEART);hp.style.setProperty("--sz","74px");}
}

/* ============ 연습마다 돌아가는 꽃 효과 ============
   여섯 가지를 연습 단위로 차례로 쓴다. 같은 연습은 언제 풀어도 같은 꽃이라
   "이 연습은 벚꽃"처럼 기억에 남고, 연습을 넘기면 바뀐다.
   결과 화면에서 틀린 단어를 지울 때(fxHeart)는 빨간 장미와 네 가지 꽃비를 순환. */
var BURSTS=[
  {name:"합본",          fn:function(l,x,y,o){return burst(l,x,y,o);}},
  {name:"겹꽃잎 꽃다발",   fn:function(l,x,y,o){return burstV1(l,x,y,o);}},
  {name:"두 번 뛰는 꽃비", fn:function(l,x,y,o){return burstV2(l,x,y,v2Opts(o.combo||o.petals||1));}},
  {name:"피어나는 하트꽃", fn:function(l,x,y,o){return burstV4(l,x,y,o);}},
  {name:"콤보 서사 꽃비",  fn:function(l,x,y,o){return burstV6(l,x,y,v6Opts(o.combo||o.petals||1));}},
  {name:"하트 광휘의 층",  fn:function(l,x,y,o){return burstV3(l,x,y,o);}}
];
function burstStyle(){var n=BURSTS.length,li=state.li|0,ei=state.ei|0;return BURSTS[((li*7+ei)%n+n)%n];}
/* 변형 안들은 저마다 '속을 채운 하트'를 중앙에 깐다. 어두운 카드 위에서 채움은 빛이 아니라
   글자를 덮는 때가 된다(26.9.13 영신 지적). 만들어진 뒤 그 요소만 골라 채움을 옅게·작게 만든다.
   꽃·불티는 건드리지 않는다. */
function tameHeart(layer){
  /* 여섯 안 중 넷(두 번 뛰는 꽃비·피어나는 하트꽃·콤보 서사·하트 광휘)이 저마다
     '속을 채운 반투명 하트'를 중앙에 깐다. 예전엔 78px로 줄이고 알파를 0.4배 했는데,
     줄여도 때는 때라서 새 윤곽 하트 밑에 회색 덩어리가 그대로 남는다.
     이제는 지운다 — 중앙 하트는 bigHeartFX 하나로 통일한다. */
  var els=layer.querySelectorAll(".v1-glow,.v2-glow,.v3-core,.v4-glow,.v4-hpop,.v6-glow,.v6-hpop,.hwave");
  for(var i=0;i<els.length;i++)els[i].parentNode&&els[i].parentNode.removeChild(els[i]);
}

let reviewRoseTap=0;
function fxHeart(el){
  const layer=$("#fxLayer");if(!layer)return;
  const [x,y]=fxOrigin(el);++fxGen;applyFX(layer);
  // Cycle by tap, independent of exercise size. Each burst owns its cleanup.
  const style=reviewRoseTap++%4;
  const flowers=document.createElement("div");flowers.className="review-roses";
  flowers.dataset.style=String(style+1);
  layer.appendChild(flowers);
  const spray=document.createElement("div");spray.className="review-spray";flowers.appendChild(spray);
  if(style===0)burstV1(spray,x,y,{petals:18,dots:14,loose:10,flash:false,dist:1.6});
  else if(style===1){
    burstV2(spray,x,y,{petals:18,dots:14,trails:7,flash:false,dist:1.45});
    for(const p of spray.querySelectorAll('.v2-p,.v2-d'))p.style.setProperty('--grav','40px');
  }
  else if(style===2)burstV4(spray,x,y,{petals:18,dots:14,tw:8,flash:false,dist:1.75});
  else burstV3(spray,x,y,{petals:16,dots:10,pollen:18,rays:7,waves:0,flash:false,dist:1.5});
  calmFX(spray);
  const core=document.createElement("div");core.className="review-rose-core";
  core.style.setProperty("--x",x+"px");core.style.setProperty("--y",y+"px");
  core.innerHTML=REVIEW_ROSE_SVG;
  flowers.appendChild(core);
  setTimeout(()=>flowers.remove(),1300);
}

// A transparent native button sits over the first cell, above the typing input.
// The other cells continue to tap the input directly (including on mobile).
(()=>{
  const hint=$("#hintBtn"),context=$("#hoeCtx"),form=$("#aform");
  let pending=0;
  function positionHint(){
    const s=state.session,cell=context.querySelector(".slot");
    if(!s||s.currentId===null||s.answered||s.copyMode||hint.disabled||!cell){hint.hidden=true;return;}
    const r=cell.getBoundingClientRect(),f=form.getBoundingClientRect();
    if(!r.width||!r.height||!f.width){hint.hidden=true;return;}
    // Extend left of the first glyph; never cover the adjacent letter.
    const width=r.width+6,height=Math.max(44,r.height);
    hint.style.left=(r.left-f.left-6)+"px";
    hint.style.top=(r.top-f.top-(height-r.height)/2)+"px";
    hint.style.width=width+"px";hint.style.height=height+"px";
    hint.hidden=false;
  }
  function schedulePosition(){
    if(pending)return;
    pending=requestAnimationFrame(()=>{pending=0;positionHint();});
  }
  hint.addEventListener("pointerdown",e=>e.preventDefault());
  hint.addEventListener("click",e=>{
    e.preventDefault();e.stopPropagation();
    if(hint.disabled||hint.hidden)return;
    giveHint();positionHint();focusAnswerInput();
  });
  new MutationObserver(schedulePosition).observe(context,{childList:true,subtree:true});
  new MutationObserver(schedulePosition).observe(hint,{attributes:true,attributeFilter:["disabled"]});
  if(typeof ResizeObserver==="function")new ResizeObserver(schedulePosition).observe(context);
  window.addEventListener("resize",schedulePosition);
  positionHint();
})();

  ])+`<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:1rem;font-weight:700;color:var(--muted);line-height:1.65;">…근데 있잖냐고양. 🌳<br>네가 오른 이 <b style="color:var(--gold)">BIG MOUNTAIN</b>, 사실은 진짜 <b style="color:var(--gold)">일산</b>이었다고양.<br>一山(하나의 산)이라 잘못 불렸지만, 원래 이름은 <b style="color:var(--gold)">한뫼</b>, '큰 산'이라고양.<br>넌 일산을 떠난 게 아니라 원래 크기의 일산으로 올라온 거라고양.<br>네가 되고 싶던 것도 결국 더 커진 <b style="color:var(--gold)">너 자신</b>이었다고양 🐾</div>`;
  $("#endTitle").textContent="합격이라고양! 🎓";
  beep("ok");
}
$("#endForm").addEventListener("submit",e=>{e.preventDefault();revealEnding($("#endInput").value);});
$("#endClose").addEventListener("click",()=>{const ov=$("#ending");ov.classList.remove("show");ov.setAttribute("aria-hidden","true");});
document.querySelector(".maproute").addEventListener("click",()=>{
  if(totalExercises()>0 && clearedExercises()>=totalExercises()) showEnding();
});
renderHome();
</script>
