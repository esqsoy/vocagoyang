// Every letter uses the same CSS-sized cell; punctuation has no input cell.
function blankSlots(answer,typed="",copy=false){
  const expected=blankParts(answer),entered=blankParts(typed),n=expected.chars.length||3;
  const breaks=new Set([...expected.breaks].filter(i=>!entered.spaced||i>=entered.chars.length));
  for(const i of entered.breaks)breaks.add(i);
  const punctuation=new Map();let letters=0;
  for(const c of String(answer||"")){
    if(/[A-Za-z\u1100-\u11ff\u3130-\u318f\uac00-\ud7af]/.test(c))letters++;
    else if(!/\s/.test(c))punctuation.set(letters,(punctuation.get(letters)||"")+c);
  }
  const mark=i=>punctuation.has(i)?`<span class="slot-punctuation${copy?" shown":""}" aria-hidden="true">${esc(punctuation.get(i))}</span>`:"";
  const words=[];let word=mark(0),start=0;
  for(let i=0;i<Math.max(n,entered.chars.length);i++){
    if(i>start&&breaks.has(i)){words.push(word);word="";start=i;}
    const c=entered.chars[i]||"",target=expected.chars[i]||"";
    const cls=copy?(c?(c.toLowerCase()===target.toLowerCase()?" ok":" x"):" gh"):(i>=n?" over":"");
    const letter=copy&&!c?target:c;
    word+=`<span class="slot${cls}${i===entered.chars.length?" cur":""}"><span class="slot-glyph">${esc(letter)}</span></span>${mark(i+1)}`;
  }
  if(word)words.push(word);
  return words.map(w=>`<span class="slot-word">${w}</span>`).join(" ");
}

function slots(answer){return `<span class="blanks">${blankSlots(answer)}</span>`;}
function maskBlank(ex,ans){return esc(ex||"").split("{{BLANK}}").join(slots(ans));}
function answerInSentence(ex,ans){
  const before=(ex||"").split("{{BLANK}}")[0];
  if(/^[a-z][A-Z]/.test(ans))return ans; // iPhone·iPad처럼 정해진 상표 표기 보존
  return /(?:^|[.!?])[\s"'“‘(]*$/.test(before)?ans.replace(/^[a-z]/,c=>c.toUpperCase()):ans;
}
function fillBlank(ex,ans){return esc(ex||"").split("{{BLANK}}").join(`<b class="fill">${esc(answerInSentence(ex,ans))}</b>`);}
function hoeCtxHtml(w){return w.ex?`<div class="ex">${maskBlank(w.ex,w.term)}</div>`:"";}
function catNote(c){return `<div class="ov-c">${esc(c)}</div>`;}
function hoeMid(w){let h="";if(w.ex)h+=`<div class="ov-ex">${fillBlank(w.ex,w.term)}</div>`;if(w.tr)h+=`<div class="ov-tr">${esc(w.tr)}</div>`;return h;}
/* 해설 읽을 시간 예산: 공개 화면에 뜨는 것을 모두 센다. 정답을 채운 예문은 영어 1단어당 250ms,
   해석·해설은 한국어 1자당 110ms(초당 약 9자), 기본 2초, 최대 20초. 줄이지 말 것.
   맞힌 학생은 뜻을 이미 알지만 해설은 처음 본다 — "맞혀서 해설을 못 보게 되는" 것이 이 게임의 약점이라
   읽을 시간을 보장한다(26.9.17 영신과 토론해 확정). 다 읽으면 Enter·화면 터치로 바로 넘어가므로 넉넉하게 잡는다.
   26.10.11 영신 "해설까지 볼 수 있게 카드당 시간을 늘려야겠어 지금은 다 읽기전에 넘어가": 전에는 해설만 1자당 75ms + 1.9초로 세어
   0세트 가운데 카드가 4.8초였다(예문·해석을 읽을 시간이 빠져 있었다). 지금은 약 9.7초. */
function revealDelay(w){var words=(w.ex||"").split(/\s+/).filter(Boolean).length,ko=(w.tr||"").length+(w.c||"").length;
  var d=Math.min(20000,Math.round(2000+words*250+ko*110));var s=state.session;if(s&&s.round>=2)d=Math.min(d,5000);return d;}
function onRevealKey(e){if(composingKey(e)||e.target?.closest?.(".answer-replay,#catSubmit"))return;if(e.key==="Enter"||e.key===" "||e.code==="Space"){const s=state.session;if(s&&s.answered&&!s.copyMode){e.preventDefault();doNext();}}}
function onRevealTap(e){const s=state.session;if(!s||!s.answered||s.copyMode)return;if(s.revealAt&&(Date.now()-s.revealAt)<280)return;if(e.target&&e.target.closest&&e.target.closest("button,a,textarea,select")||(e.target.closest("input")&&e.target.id!=="ainput"))return;doNext();}
function doNext(){const s=state.session;if(!s||!s.answered||s.copyMode)return;if(s.revealTimer){clearTimeout(s.revealTimer);s.revealTimer=null;}document.removeEventListener("keydown",onRevealKey);document.removeEventListener("click",onRevealTap);nextCard();}
function armReveal(w){
  const s=state.session,id=s.currentId;
  const valid=()=>state.session===s&&s.currentId===id&&s.answered&&!s.copyMode&&screens.game.classList.contains("active");
  s.revealAt=Date.now();s.revealTimer=setTimeout(()=>{s.revealTimer=null;if(valid())ipaEffectAdvance(doNext,valid);},revealDelay(w));
  document.addEventListener("keydown",onRevealKey);document.addEventListener("click",onRevealTap);
}
function fmtIpa(ipa){return ipaEffectStressMarkup(ipa);}

function rvWord(w){return `<div class="rv-word"><span class="rv-w" role="button" aria-label="발음 듣기">${esc(w.term)}</span>${w.ipa?`<span class="ov-ipa">/${fmtIpa(w.ipa)}/</span>`:""}</div>`;}
function rvTr(w){return w.tr?`<div class="ov-tr">${esc(w.tr)}</div>`:"";}
function setCatSpeech(w,line){
  const speech=$("#catSpeech");speech.textContent=w.meow||line||"";speech.hidden=!speech.textContent;
}
/* 대사는 위쪽 시간 막대 자리에 표시한다. 카드별 농담이 대사를 대신한 경우에도
   철자 변형·대체 정답·동의어 안내(always)는 해설 옆에 남겨 판정 이유를 보존한다. */
function rvBody(w,line,always){
  const say=line&&always&&w.meow?`<div class="ov-say ov-why">${esc(line)}</div>`:"";
  return `${say}${w.c?`<div class="ov-c rv-note">${esc(w.c)}</div>`:""}`;}

/* 정답·오답 순간 카드가 182px쯤 한 프레임에 늘어나 화면이 통째로 찢어지듯 밀렸다.
   높이를 고정하는 건 답이 아니다 — 문제 상태 157~284px, 공개 상태 254~501px로
   차이가 커서 고정하면 문제 화면에 240px 빈 공간이 생긴다.
   대신 '점프'만 없앤다: 바뀌기 전 높이에서 바뀐 뒤 높이로 0.3초에 걸쳐 자란다.
   눈은 매끄럽게 자라는 것은 따라가지만 순간이동은 못 따라간다. */
function growCard(fill){
  const card=$("#quizCard");if(!card){fill();return;}
  const h0=card.getBoundingClientRect().height;
  card.style.height="";card.style.transition="";
  fill();
  const h1=card.getBoundingClientRect().height;
  if(Math.abs(h1-h0)<8)return;                 /* 티 안 나는 변화는 그냥 둔다 */
  if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  card.style.height=h0+"px";
  void card.offsetHeight;                       /* 리플로우를 강제해 시작점을 박는다 */
  /* 곡선 비교 실측(한 프레임 최대 이동): cubic-bezier(.22,.7,.3,1) 40px ·
     (.4,0,.2,1) 28px · (.45,.05,.25,1) 26px · (.5,.05,.25,1) 24px · ease-in-out 18px.
     ease-in-out이 계단이 가장 고르다(1,3,6,8,11,13,15,17,17,18). */
  card.style.transition="height .3s ease-in-out";
  card.style.height=h1+"px";
  clearTimeout(card._growT);
  card._growT=setTimeout(()=>{card.style.transition="";card.style.height="";},330);
}
function openReveal(kind){const card=$("#quizCard");card.classList.add(kind);$("#qmini").style.display="none";$("#timeWrap").style.visibility="hidden";const rv=$("#reveal");rv.className="rv show";
  /* scrollTo(0)은 아래로 스크롤해 둔 상태에서 화면을 통째로 튕긴다. 카드가 이미 보이면 건드리지 않는다 */
  if(card.getBoundingClientRect().top<-8)card.scrollIntoView({block:"start",behavior:"smooth"});
  return rv;}
// Keep the same letter cells and word groups when revealing the answer.
function revealInPlace(w){
  const blank=$("#hoeCtx .blanks");if(!blank)return;
  const answer=answerInSentence(w.ex,w.term);
  blank.innerHTML=blankSlots(w.term,answer);
  blank.classList.add("revealed");
  addAnswerPunctuation(blank,answer);

  // Assistive technology reads the whole word rather than separate letters.
  blank.querySelectorAll(".slot-word").forEach(group=>group.setAttribute("aria-hidden","true"));
  const label=document.createElement("span");label.className="answer-spoken";label.textContent=answer;
  blank.appendChild(label);
  enableAnswerReplay(blank,w.term);
}

function addAnswerPunctuation(blank,answer){
  // Punctuation already reserves its natural width in the question.
  blank.querySelectorAll(".slot-punctuation").forEach(mark=>mark.classList.add("shown"));
}

function showReveal(type,w,line,always){
  /* 빈칸 채움 → 안내줄·타이머 숨김 → 공개 내용 채움을 한 덩어리로 묶어 전환한다.
     따로 하면 카드가 201→152로 먼저 49px 줄었다가 383으로 뛰어 점프가 두 번 난다. */
  growCard(()=>{
    revealInPlace(w);
    setCatSpeech(w,line);
    openReveal("good").innerHTML=`${rvTr(w)}${rvBody(w,line,always)}`;
  });
  speak(w.term);
}
function renderCopyBlank(v){const s=state.session;if(!s||!s.copyMode)return;const wrap=$("#hoeCtx .blanks")||$("#ghostTar");if(!wrap)return;
  wrap.innerHTML=blankSlots(s.copyAns,v,true);addAnswerPunctuation(wrap,s.copyAns);}
function startCopy(w,line,always){
  const term=w.term;const s=state.session;s.copyMode=true;s.copyAns=term;
  growCard(()=>{
    setCatSpeech(w,line);
    openReveal("bad").innerHTML=`${rvTr(w)}${rvBody(w,line,always)}${w.ex?"":`<div class="blanks" id="ghostTar"></div>`}`;
  });
  renderCopyBlank("");
  $("#ainput").value="";$("#ainput").className="ainput";$("#ainput").disabled=false;
  $("#submitBtn").disabled=false;$("#hintBtn").disabled=true;
  $("#ainput").oninput=handleCopyInput;

}
function submitCopy(){
  const s=state.session;if(!s||!s.copyMode||state.composing)return;
  if(!isCorrect($("#ainput").value,s.copyAns)){
    const p=$("#quizCard");p.classList.remove("wrong");void p.offsetWidth;p.classList.add("wrong");
    return;
  }
  s.copyMode=false;s.copyAns="";$("#ainput").oninput=null;
  $("#submitBtn").disabled=true;

}
// Reveal only the first letter, once per card; typing continues after it.
function giveHint(){
  const s=state.session;
  if(!s||s.currentId===null||s.answered||s.copyMode||s.hintLevel>=1||state.composing||$("#hintBtn").disabled)return;
  const w=s.words[s.currentId],answer=answerInSentence(w.ex,w.term);
  if(!/[A-Za-z]/.test(answer))return;
  s.hintLevel=1;s.hints=(s.hints||0)+1;
  $("#hintBtn").disabled=true;
  if(CAT.wicked)setCat('quizCat','wicked');
  const count=1;

  // Keep punctuation and a following word separator in the opened prefix.
  let end=0,letters=0;
  while(end<answer.length&&letters<count){if(/[A-Za-z]/.test(answer[end]))letters++;end++;}
  while(end<answer.length&&!/[A-Za-z]/.test(answer[end]))end++;
  const prefix=answer.slice(0,end),input=$("#ainput"),typed=input.value;

  // Preserve anything already typed after the opened cells, including spaces.
  let tail=0,entered=0;
  while(tail<typed.length&&entered<count){
    if(/[A-Za-z\u1100-\u11ff\u3130-\u318f\uac00-\ud7af]/.test(typed[tail]))entered++;
    tail++;
  }
  while(tail<typed.length&&!/[A-Za-z\u1100-\u11ff\u3130-\u318f\uac00-\ud7af]/.test(typed[tail]))tail++;
  input.value=prefix+typed.slice(tail);
  // 값을 넣으면 커서는 이미 끝에 있다. 끝이 아닐 때만 옮긴다(iOS는 옮길 때마다 화면을 커서 쪽으로 끈다).
  const caret=input.value.length;if(input.selectionStart!==caret||input.selectionEnd!==caret)input.setSelectionRange(caret,caret);
  // A one-letter word must still be confirmed; opening a hint never grades it.
  mirrorTyped({fromHint:true});
  updateInputNotice();
}


function updateStats(){
  const s=state.session;if(!s)return;
  $("#sTime").textContent=fmt(Date.now()-s.totalStart);
  $("#sErr").textContent=s.errors;
  const done=roundDone(),total=s.roundTargets.length||s.words.length;
  $("#sDone").textContent=`${done}/${total}`;
  $("#cStreak").textContent=(s.streak||0)>=3?`🔥${s.streak}`:"";
  $("#gProg").style.width=(total?Math.round(done/total*100):0)+"%";
  if(!s.fbMode&&s.currentId!==null&&!s.opening){
    const left=remain();const pct=Math.max(0,left/s.cardLimit*100);
    const tw=$("#timeWrap");$("#timeFill").style.width=pct+"%";
    tw.className="timewrap"+(pct<25?" danger":(pct<50?" warn":""));
    if(left<=0&&!s.answered){
      /* 손이 움직이는 중이면 조금 봐준다. 0이 되는 순간 칼같이 끊으면 마지막 글자를
         치던 손이 진다 — 막대는 8px이라 눈이 예문에 가 있으면 0이 되는 걸 못 본다.
         최대 5초까지만. 멈춘 지 1.2초가 지나면 그때는 진짜 시간 초과다. */
      var over=(Date.now()-s.cardStart)/1000-s.cardLimit;
      var typing=s.lastKey&&(Date.now()-s.lastKey)<1200&&$("#ainput").value.trim()!=="";
      if(!typing||over>5)submit({timeout:true});
    }
  } else {
    /* 공개 중에는 막대를 되살리지 않는다 — 가득 찬 초록 막대가 뜨면 시간이 남은 것처럼 읽힌다.
       다시 보이게 하는 것은 새 카드를 그릴 때뿐이다(nextCard). */
    $("#timeFill").style.width="100%";$("#timeWrap").className="timewrap";}
}
function remain(){const s=state.session;if(!s||s.fbMode)return 0;
  return Math.max(0,Math.ceil(s.cardLimit-(Date.now()-s.cardStart)/1000));}
function roundDone(){const s=state.session;if(!s)return 0;
  if(s.round===1)return s.roundTargets.length-s.queue.length-(s.answered||s.currentId===null?0:1);
  return s.roundTargets.filter(id=>s.words[id].passed).length;}
function startTicker(){stopTicker();state.ticker=setInterval(updateStats,150);}
function stopTicker(){if(state.ticker)clearInterval(state.ticker);state.ticker=null;}

function finishExercise(){
  const s=state.session;if(!s)return;stopTicker();
  const timeMs=Date.now()-s.totalStart;
  const first=s.firstSeen?Math.round(s.firstCorrect/s.firstSeen*100):0;
  const wasAll=s.lesson.kind!=="saved"&&clearedExercises()>=totalExercises();   // 엔딩은 이번 판으로 처음 다 끝냈을 때만(다 끝낸 뒤 다시 푼 판은 띄우지 않는다)

  if(o.flash)put("v2-glow",v2GlowSVG()).style.setProperty("--gsz",Math.round(104+30*cap)+"px");
  /* 2) 하트 충격파(콤보 5+) */
  if(o.ring)put("v2-ring",v2RingSVG());

  /* 3) 선발 섬광 줄기 — 꽃보다 먼저 튀어나가 궤적을 그린다 */
  var T=(o.trails==null)?Math.max(3,Math.min(10,3+Math.round((o.petals||1)*.28))):o.trails;
  for(var i=0;i<T;i++){
    var a=-90+360*i/T+(R()-.5)*24, d=put("v2-tr");
    d.style.setProperty("--a",a.toFixed(1)+"deg");
    d.style.setProperty("--len",(17+R()*15).toFixed(1)+"px");
    d.style.setProperty("--d",((52+R()*50)*dm).toFixed(1)+"px");
    d.style.setProperty("--glow",v2hsl(330+360*i/T,74));
    d.style.setProperty("--dur",(.32+R()*.14).toFixed(3)+"s");
    d.style.setProperty("--del",(R()*.05).toFixed(3)+"s");
  }

  /* 4) 2단 분출 본체: 래퍼=포물선 궤적, 자식=흩날림(회전축·펄럭임·축소) */
  var fly=function(kind,i,n){
    var narrow=n<=3;
    var a=narrow ? (-Math.PI/2+(i-(n-1)/2)*.95+(R()-.5)*.18)
                 : (-Math.PI/2+Math.PI*2*i/n+(R()-.5)*.48);
    var dist=(74+R()*70)*dm;
    var hue=330+360*i/n+(R()-.5)*26;
    var sz=kind==="h" ? (15+R()*9) : Math.max(12,25-Math.min(12,(n-1)*.40))+R()*3;
    var dur=(narrow?.84:.74)+R()*.24;
    var del=(n<=2?0:(i/n)*Math.min(.18,.05+n*.006))+R()*.03;
    var w=put("v2-p",null,sz.toFixed(1));
    w.style.setProperty("--dx",(Math.cos(a)*dist).toFixed(1)+"px");
    w.style.setProperty("--dy",(Math.sin(a)*dist*.82).toFixed(1)+"px");
    w.style.setProperty("--lift",(12+R()*22).toFixed(1)+"px");
    w.style.setProperty("--grav",((24+R()*40)*(.7+cap*.3)).toFixed(1)+"px");
    w.style.setProperty("--spin",((R()<.5?-1:1)*(200+R()*340)).toFixed(0)+"deg");
    w.style.setProperty("--sk",(.92+R()*.14).toFixed(3));
    w.style.setProperty("--dur",dur.toFixed(3)+"s");
    w.style.setProperty("--del",del.toFixed(3)+"s");
    w.style.setProperty("--glow",v2hsl(hue,74));
    var inner=document.createElement("div");
    inner.className="v2-i"+(n>24?" v2-lite":"");
    inner.innerHTML=(kind==="h")?v2HeartSVG(hue):v2BloomSVG(hue);
    /* 회전축을 요소마다 다르게: 아트워크를 정적으로 돌려 펄럭임 축을 기울인다 */
    if(inner.firstChild&&inner.firstChild.style)inner.firstChild.style.transform="rotate("+Math.round(R()*360)+"deg)";
    w.appendChild(inner);
  };
  var P=o.petals||0;for(var p=0;p<P;p++)fly("f",p,P);
  var H=o.hearts||0;for(var q=0;q<H;q++)fly("h",q,H);

  /* 5) 불티: 같은 중력을 받는다 */
  var D=o.dots||0,tone=["#ffd34d","#ff8ac6","#7cffb2","#5ce6ff"];
  for(var k=0;k<D;k++){
    var ka=-Math.PI/2+Math.PI*2*k/D+(R()-.5)*.7, kd=(44+R()*72)*dm;
    var e=put("v2-d",null,(3.5+R()*3.5).toFixed(1));
    e.style.setProperty("--dx",(Math.cos(ka)*kd).toFixed(1)+"px");
    e.style.setProperty("--dy",(Math.sin(ka)*kd*.85).toFixed(1)+"px");
    e.style.setProperty("--lift",(8+R()*20).toFixed(1)+"px");
    e.style.setProperty("--grav",(28+R()*48).toFixed(1)+"px");
    e.style.setProperty("--glow",tone[k%4]);
    e.style.setProperty("--dur",(.48+R()*.24).toFixed(3)+"s");
    e.style.setProperty("--del",(R()*.12).toFixed(3)+"s");
  }

  if(o.edge)put("v2-edge");
  if(o.heart)put("v2-hpop",v2HeartSVG(335));
}

/* ── 연결 방법 (기존 fx() 의 good 분기 2줄만 교체. 'N COMBO' 텍스트는 제거) ──
   const [x,y]=fxOrigin($("#hoeCtx .fill")||card);
   burstV2(layer,x,y,v2Opts(Math.max(1,combo||1)));
   // comboPop(...) 호출은 지운다 (꽃 개수가 콤보를 표현)
   그리고 fxHeart 는:
   burstV2(layer,x,y,{heart:true,hearts:7,dots:8,ring:true,flash:true,dist:1.2});
   ───────────────────────────────────────────────────────────────────────── */
/* ===== 꽃 v4 · 피어나는 하트꽃 ===== */
/* ===================== v4 · 피어나는 꽃 (blooming flower) =====================
   burstV4(layer,x,y,o) — o={petals,dots,dist, ring,edge,flash, hearts,heart, tw}
   · 봉오리가 솟아 → 꽃잎이 벌어져 피고 → 흩어진다(2단 연출)
   · 요소 폭발 방지: 앞의 2~3송이(히어로)만 꽃잎 6장을 개별 요소로 두고,
     나머지는 1요소 통짜 SVG가 "비틀림→펴짐" 스케일로 피어난다(LOD)
   · SVG 문자열은 최초 1회만 만들고 <template>+cloneNode 로 복제(파싱비용 1회)
   · 숫자 텍스트는 쓰지 않는다(꽃 개수가 콤보를 표현)
   ========================================================================= */
const V4_HUES=[335,312,352,18,45,74,150,188];   /* 어두운 보라 배경에서 죽는 남·자보라(250~300)는 제외 */
const V4_HEART="M50 87C17 64 7 47 7 32 7 18.5 17.6 9.5 29 9.5 37.8 9.5 45 14.5 50 22.5 55 14.5 62.2 9.5 71 9.5 82.4 9.5 93 18.5 93 32 93 47 83 64 50 87Z";
function v4hsl(h,l){return "hsl("+Math.round(h)+",95%,"+l+"%)";}

/* 꽃잎 1장(히어로용). 밑동이 (8,25) = transform-origin 50% 100% */
function v4PetalSVG(){return '<svg viewBox="0 0 16 25" aria-hidden="true">'+
  '<path d="M8 24.6C1.6 19-.2 11.6 2.2 6.4 3.8 2.9 5.9 1 8 1c2.1 0 4.2 1.9 5.8 5.4 2.4 5.2.6 12.6-5.8 18.2z" fill="currentColor" stroke="rgba(255,255,255,.9)" stroke-width="1.3" stroke-linejoin="round"/>'+
  '<path d="M8 24.4C5 21.8 3.4 18.9 2.7 15.5 4.6 17.7 6.2 18.9 8 19.5c1.8-.6 3.4-1.8 5.3-4 -.7 3.4-2.3 6.3-5.3 8.9z" fill="rgba(255,255,255,.26)"/>'+
  '<path d="M8 21.4C4.4 16.9 3.4 11.3 5 7.3 6 4.9 7 3.3 8 2.7" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.5" stroke-linecap="round"/>'+
  '</svg>';}
/* 꽃심(수술) */
function v4CoreSVG(){return '<svg viewBox="0 0 20 20" aria-hidden="true">'+
  '<circle cx="10" cy="10" r="6" fill="#ffd34d"/><circle cx="10" cy="10" r="3.1" fill="#fff7d6"/>'+
  '<g fill="#fff" opacity=".92"><circle cx="10" cy="4.8" r="1.05"/><circle cx="14.9" cy="8.1" r="1.05"/><circle cx="12.9" cy="13.9" r="1.05"/><circle cx="7.1" cy="13.9" r="1.05"/><circle cx="5.1" cy="8.1" r="1.05"/></g>'+
  '</svg>';}
/* 통짜 꽃(1요소). rich=겉꽃잎6+속꽃잎6+꽃심, lite=겉꽃잎6+꽃심 */
function v4FlowerSVG(rich){
  const out="M20 20c-6.4-2.6-9.6-7.4-8.4-11.4C12.4 5.8 15.8 3.4 20 3.4s7.6 2.4 8.4 5.2C29.6 12.6 26.4 17.4 20 20z";
  const inn="M20 20c-3.6-1.6-5.4-4.4-4.7-7 .5-1.8 2.5-3.2 4.7-3.2s4.2 1.4 4.7 3.2c.7 2.6-1.1 5.4-4.7 7z";
  let s='<svg viewBox="0 0 40 40" aria-hidden="true">';
  for(let k=0;k<6;k++)s+='<path d="'+out+'" transform="rotate('+(k*60)+' 20 20)" fill="currentColor" stroke="rgba(255,255,255,'+(rich?".85":".7")+')" stroke-width="'+(rich?1.1:1)+'" stroke-linejoin="round"/>';
  if(rich)for(let k=0;k<6;k++)s+='<path d="'+inn+'" transform="rotate('+(k*60+30)+' 20 20)" fill="rgba(255,255,255,.42)"/>';
  s+='<circle cx="20" cy="20" r="'+(rich?4.4:4)+'" fill="#ffd34d"/>';
  if(rich)s+='<circle cx="20" cy="20" r="2.1" fill="#fff6d5"/>';
  return s+'</svg>';}
/* 반짝 별 */
function v4StarSVG(){return '<svg viewBox="0 0 24 24" aria-hidden="true">'+
  '<path d="M12 0l1.9 10.1L24 12l-10.1 1.9L12 24l-1.9-10.1L0 12l10.1-1.9z" fill="#fff"/>'+
  '<path d="M12 5l1 6 6 1-6 1-1 6-1-6-6-1 6-1z" fill="#ffe08a"/></svg>';}
/* 하트(파티클·팝업용) */
function v4HeartSVG(){return '<svg viewBox="0 0 100 100" aria-hidden="true">'+
  '<path d="'+V4_HEART+'" fill="#ff4fa3" stroke="#fff" stroke-width="6" stroke-linejoin="round"/>'+
  '<path d="M36 26c-6 2-9.6 8-8.6 14" fill="none" stroke="#ffd7ea" stroke-width="6" stroke-linecap="round" opacity=".9"/></svg>';}
/* 중앙 광원 = 하트(원형 아님). 가운데를 일부러 옅게 비워 글자가 읽힌다 */
function v4HeartGlowSVG(id){return '<svg viewBox="0 0 100 100" aria-hidden="true">'+
  '<defs><radialGradient id="'+id+'" cx="50%" cy="44%" r="56%">'+
  '<stop offset="0%" stop-color="#ffffff" stop-opacity=".28"/>'+
  '<stop offset="34%" stop-color="#ffffff" stop-opacity=".50"/>'+
  '<stop offset="58%" stop-color="#ff9ed4" stop-opacity=".46"/>'+
  '<stop offset="80%" stop-color="#ff4fa3" stop-opacity=".20"/>'+
  '<stop offset="100%" stop-color="#ff4fa3" stop-opacity="0"/>'+
  '</radialGradient></defs>'+
  '<path d="'+V4_HEART+'" fill="url(#'+id+')"/>'+
  '<path d="'+V4_HEART+'" fill="none" stroke="#ffffff" stroke-opacity=".7" stroke-width="2.2" stroke-linejoin="round"/>'+
  '</svg>';}
/* 퍼지는 하트 윤곽(5연속부터). 채움이 없어 글자를 가리지 않는다 */
function v4HeartRingSVG(){return '<svg viewBox="0 0 100 100" aria-hidden="true">'+
  '<path d="'+V4_HEART+'" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linejoin="round"/>'+
  '<path d="'+V4_HEART+'" fill="none" stroke="#ffd34d" stroke-width="1.2" stroke-linejoin="round" transform="translate(50 50) scale(.8) translate(-50 -50)"/>'+
  '</svg>';}

let v4T=null,v4uid=0;
function v4Tpl(){
  if(v4T)return v4T;
  const t=h=>{const e=document.createElement("template");e.innerHTML=h;return e;};
  let ph="";for(let i=0;i<6;i++)ph+='<i class="v4-pt" style="--pa:'+(i*60)+'deg">'+v4PetalSVG()+'</i>';
  v4T={hero:t(ph+'<i class="v4-core">'+v4CoreSVG()+'</i>'),
       rich:t(v4FlowerSVG(true)),lite:t(v4FlowerSVG(false)),
       star:t(v4StarSVG()),heart:t(v4HeartSVG()),hring:t(v4HeartRingSVG())};
  return v4T;}

function burstV4(layer,x,y,o){
  o=o||{};const T=v4Tpl(),R=Math.random,uid=++v4uid,dist=o.dist||1,UP=-Math.PI/2;
  const mk=(cls,key)=>{const d=document.createElement("div");d.className=cls;
    d.style.setProperty("--x",x+"px");d.style.setProperty("--y",y+"px");
    if(key)d.appendChild(T[key].content.cloneNode(true));
    layer.appendChild(d);return d;};
  const xy=(d,a,r,lift)=>{d.style.setProperty("--dx",(Math.cos(a)*r).toFixed(1)+"px");
    d.style.setProperty("--dy",(Math.sin(a)*r*.88-(lift||0)).toFixed(1)+"px");};

  /* 1) 중앙 광원(하트) + 하트 윤곽 */
  if(o.flash){mk("v4-glow").innerHTML=v4HeartGlowSVG("v4hg"+uid);}
  if(o.ring)mk("v4-hring","hring");

  /* 2) 꽃: 앞 2~3송이는 꽃잎 개별요소(히어로), 나머지는 1요소 통짜 */
  const P=Math.max(0,Math.min(40,o.petals|0));
  const hero=P<=2?P:(P<=8?3:2);
  for(let i=0;i<P;i++){
    const isHero=i<hero;
    const a=UP+Math.PI*2*(i+(i&1)*.5)/Math.max(1,P)+(R()-.5)*(P>6?.5:.9);
    const rad=(44+R()*30+P*.95)*dist;
    const d=isHero?mk("v4-fl","hero"):mk(i<18?"v4-bl":"v4-bl v4-lite",i<18?"rich":"lite");
    const h=(V4_HUES[i%V4_HUES.length]+R()*14-7+360)%360;
    d.style.color=v4hsl(h,70);
    d.style.setProperty("--v4g",v4hsl(h,64));
    xy(d,a,rad,10);
    d.style.setProperty("--v4rot",(R()*54-27).toFixed(1)+"deg");
    d.style.setProperty("--v4ps",(8+R()*14).toFixed(1)+"deg");
    if(isHero){
      d.style.setProperty("--v4s",(.82+R()*.18).toFixed(3));
      d.style.setProperty("--v4dur",(.94+R()*.12).toFixed(3)+"s");
      d.style.setProperty("--v4d",(i*.045+R()*.03).toFixed(3)+"s");
    }else{
      d.style.setProperty("--sz",(15+R()*8).toFixed(1)+"px");
      d.style.setProperty("--v4s",(.88+R()*.14).toFixed(3));
      d.style.setProperty("--v4dur",(.82+R()*.14).toFixed(3)+"s");
      d.style.setProperty("--v4d",(i/Math.max(1,P)*.17+R()*.05).toFixed(3)+"s");
    }
  }

  /* 3) 불티(꽃가루) */
  const D=Math.max(0,Math.min(18,o.dots|0));
  for(let i=0;i<D;i++){const d=mk("v4-dot");
    xy(d,UP+Math.PI*2*(i+.5)/Math.max(1,D)+(R()-.5)*.9,(30+R()*62)*dist,4);
    d.style.setProperty("--v4g",v4hsl(V4_HUES[i*3%V4_HUES.length],66));
    d.style.setProperty("--sz",(2.4+R()*2.4).toFixed(1)+"px");
    d.style.setProperty("--v4dur",(.42+R()*.14).toFixed(3)+"s");
    d.style.setProperty("--v4d",(R()*.08).toFixed(3)+"s");}

  /* 4) 반짝임(제자리 점멸, 이동 없음) */
  const W=o.tw==null?Math.min(8,2+Math.round(P/5)):Math.max(0,Math.min(10,o.tw|0));
  for(let i=0;i<W;i++){const d=mk("v4-tw","star");
    xy(d,R()*Math.PI*2,(26+R()*74)*dist,6);
    d.style.setProperty("--sz",(9+R()*8).toFixed(1)+"px");
    d.style.setProperty("--v4dur",(.44+R()*.16).toFixed(3)+"s");
    d.style.setProperty("--v4d",(.06+R()*.46).toFixed(3)+"s");}

  /* 5) 하트 파티클 / 가장자리 금빛 / 중앙 하트 팝(결과화면 호환) */
  const H=Math.max(0,Math.min(14,o.hearts|0));
  for(let i=0;i<H;i++){const d=mk("v4-heart","heart");
    xy(d,UP+Math.PI*2*(i+.5)/Math.max(1,H),(52+R()*54)*dist,16);
    d.style.setProperty("--sz",(15+R()*9).toFixed(1)+"px");
    d.style.setProperty("--v4rot",(R()*50-25).toFixed(1)+"deg");
    d.style.setProperty("--v4dur",(.86+R()*.16).toFixed(3)+"s");
    d.style.setProperty("--v4d",(i*.03+R()*.05).toFixed(3)+"s");}
  if(o.edge)mk("v4-edge");
  if(o.heart)mk("v4-hpop","heart");
}

/* ── 붙이는 법 ──────────────────────────────────────────────────────────────
   fx() 안의  burst(layer,x,y,o);         →  burstV4(layer,x,y,o);
   fxHeart() 안의  burst(layer,x,y,{...}) →  burstV4(layer,x,y,{...})
   기존 fx()의 o(={petals,dots,flash,ring,edge,dist})를 그대로 받는다.
   숫자 텍스트(N COMBO)는 만들지 않는다. dots는 성능상 18개로 내부 클램프.
   ────────────────────────────────────────────────────────────────────────── */
/* ===== 꽃 v6 · 콤보 서사 꽃비 ===== */
/* ===== v6 · 콤보 서사(combo narrative) : 단계가 올라갈수록 연출이 진화한다. 숫자 텍스트는 쓰지 않는다 ===== */
/* 1~2연속  조용한 한두 송이(분홍 한 색, 19~28px) + 작은 하트 광원
   3~5연속  꽃 종류 2가지(장미+블로섬) + 흰 링, 색폭이 분홍→금빛으로 벌어진다
   6~9연속  꽃 3가지(+벚꽃) + 하트 꽃가루 + 반짝 별, 금빛 점선 링이 하나 더
   10연속+  화면 가장자리 금빛 + 큰 하트 광원이 한 번 맥동 + 금빛 리본, 색은 완전 무지개
   단계 진입(3·6·10·20·30·40)에는 분홍 파동 링이 한 번 더 돌아 '보상'이 된다 */
let v6uid=0;
const V6_HEART_D="M50 90C14 65 4 47 4 31 4 17 15 7.5 28 7.5 38 7.5 45.5 13 50 21.5 54.5 13 62 7.5 72 7.5 85 7.5 96 17 96 31 96 47 86 65 50 90Z";
/* 장미: 겹겹 나선. 바깥 두 겹은 currentColor(콤보 색), 안쪽은 흰 하이라이트+금빛 수술.
   맨 뒤 반투명 원이 filter 없이도 빛번짐처럼 보이게 한다 */
const V6_ROSE='<svg viewBox="0 0 24 24" aria-hidden="true">'+
  '<circle cx="12" cy="11" r="10.4" fill="currentColor" opacity=".15"/>'+
  '<g stroke="#fff" stroke-linejoin="round" stroke-linecap="round">'+
  '<path d="M12 3.4c4.8-2.5 9.2 1 8.1 5.6-.7 3.9-4.2 6-8.1 6s-7.4-2.1-8.1-6C2.8 4.4 7.2.9 12 3.4z" fill="currentColor" stroke-width="1.2"/>'+
  '<path d="M12 5.6c3.2-1.4 5.8.9 4.9 3.9-.6 2.6-2.8 4-4.9 4s-4.3-1.4-4.9-4c-.9-3 1.7-5.3 4.9-3.9z" fill="#fff" opacity=".3" stroke="none"/>'+
  '<path d="M12 7.3c2-.7 3.4.9 2.8 2.8-.4 1.6-1.8 2.3-2.8 2.3s-2.4-.7-2.8-2.3C8.6 8.2 10 6.6 12 7.3z" fill="#fff" opacity=".5" stroke="none"/>'+
  '<path d="M9.5 9.9c.5-1.6 2.1-2.4 3.6-2" fill="none" stroke="#fff" stroke-width=".9" opacity=".55"/>'+
  '</g>'+
  '<circle cx="12" cy="10.2" r="1.5" fill="#ffd34d"/><circle cx="12" cy="10.2" r=".6" fill="#fff8dd"/>'+
  '</svg>';
/* 여섯잎 블로섬: 3연속부터 섞인다 */
const V6_BLOOM=(function(){let p='';for(let k=0;k<6;k++)p+='<ellipse cx="12" cy="5.9" rx="3" ry="5.1" transform="rotate('+k*60+' 12 12)"/>';
  return '<svg viewBox="0 0 24 24" aria-hidden="true">'+
  '<circle cx="12" cy="12" r="10.6" fill="currentColor" opacity=".14"/>'+
  '<g fill="currentColor" stroke="#fff" stroke-width="1" stroke-linejoin="round">'+p+'</g>'+
  '<circle cx="12" cy="12" r="4" fill="#fff" opacity=".45"/>'+
  '<circle cx="12" cy="12" r="2.4" fill="#ffd34d"/><circle cx="12" cy="12" r=".9" fill="#fff8dd"/>'+

    f.style.setProperty("--dur",(.86+R()*.18).toFixed(2)+"s");}

  /* 5층 — 흰 불티 */
  for(var s=0;s<D;s++){var sp=mk("v3-spark");
    var sa=Math.PI*2*s/Math.max(1,D)+(R()-.5)*.9,sd=(34+R()*56)*dist;
    sp.style.setProperty("--sz",(3+R()*2.4).toFixed(1)+"px");
    sp.style.setProperty("--sc",s%3?"#fff":"#ffe9a8");
    sp.style.setProperty("--dx",Math.round(Math.cos(sa)*sd)+"px");
    sp.style.setProperty("--dy",Math.round(Math.sin(sa)*sd)+"px");
    sp.style.setProperty("--dur",(.38+R()*.1).toFixed(2)+"s");}

  /* 6층 — 늦게(0.2~0.44초 뒤) 반짝이며 떨어지는 금빛 꽃가루 */
  for(var p=0;p<pol;p++){var pl=mk("v3-pollen");
    var pa=R()*Math.PI*2,pd=(26+R()*62)*dist;
    pl.style.setProperty("--sz",(3.4+R()*2.2).toFixed(1)+"px");
    pl.style.setProperty("--pc",p%4===0?"#ff8ac6":(p%4===1?"#7cffb2":"#ffd34d"));
    pl.style.setProperty("--dx",Math.round(Math.cos(pa)*pd)+"px");
    pl.style.setProperty("--dy",Math.round(Math.sin(pa)*pd*.7-14)+"px");
    pl.style.setProperty("--fall",Math.round(20+R()*28)+"px");
    pl.style.setProperty("--del",(.2+R()*.24).toFixed(2)+"s");
    pl.style.setProperty("--dur",(.6+R()*.18).toFixed(2)+"s");}

  /* 7층 — 콤보 10+ 화면 가장자리 금빛 */
  if(o.edge)mk("v3-edge");

  /* 호환 — 날아가는 하트 / 큰 하트 팝 (fxHeart 용) */
  var H=Math.max(0,o.hearts|0);
  for(var k=0;k<H;k++){var ht=mk("v3-heart",V3_HEART);
    var ha=Math.PI*2*k/Math.max(1,H)+Math.PI/Math.max(1,H)*.5,hd=(58+R()*54)*dist;
    ht.style.setProperty("--sz",(16+R()*9).toFixed(1)+"px");
    ht.style.setProperty("--glow","#ff8ac6");
    ht.style.setProperty("--dx",Math.round(Math.cos(ha)*hd)+"px");
    ht.style.setProperty("--dy",Math.round(Math.sin(ha)*hd-22)+"px");
    ht.style.setProperty("--rot",Math.round(R()*70-35)+"deg");
    ht.style.setProperty("--dur",(.9+R()*.2).toFixed(2)+"s");}
  if(o.heart){var hp=mk("v3-hpop",V3_HEART);hp.style.setProperty("--sz","74px");}
}

/* ============ 연습마다 돌아가는 꽃 효과 ============
   여섯 가지를 연습 단위로 차례로 쓴다. 같은 연습은 언제 풀어도 같은 꽃이라
   "이 연습은 벚꽃"처럼 기억에 남고, 연습을 넘기면 바뀐다.
   결과 화면에서 틀린 단어를 지울 때(fxHeart)는 빨간 장미와 네 가지 꽃비를 순환. */
var BURSTS=[
  {name:"합본",          fn:function(l,x,y,o){return burst(l,x,y,o);}},
  {name:"겹꽃잎 꽃다발",   fn:function(l,x,y,o){return burstV1(l,x,y,o);}},
  {name:"두 번 뛰는 꽃비", fn:function(l,x,y,o){return burstV2(l,x,y,v2Opts(o.combo||o.petals||1));}},
  {name:"피어나는 하트꽃", fn:function(l,x,y,o){return burstV4(l,x,y,o);}},
  {name:"콤보 서사 꽃비",  fn:function(l,x,y,o){return burstV6(l,x,y,v6Opts(o.combo||o.petals||1));}},
  {name:"하트 광휘의 층",  fn:function(l,x,y,o){return burstV3(l,x,y,o);}}
];
function burstStyle(){var n=BURSTS.length,li=state.li|0,ei=state.ei|0;return BURSTS[((li*7+ei)%n+n)%n];}
/* 변형 안들은 저마다 '속을 채운 하트'를 중앙에 깐다. 어두운 카드 위에서 채움은 빛이 아니라
   글자를 덮는 때가 된다(26.9.13 영신 지적). 만들어진 뒤 그 요소만 골라 채움을 옅게·작게 만든다.
   꽃·불티는 건드리지 않는다. */
function tameHeart(layer){
  /* 여섯 안 중 넷(두 번 뛰는 꽃비·피어나는 하트꽃·콤보 서사·하트 광휘)이 저마다
     '속을 채운 반투명 하트'를 중앙에 깐다. 예전엔 78px로 줄이고 알파를 0.4배 했는데,
     줄여도 때는 때라서 새 윤곽 하트 밑에 회색 덩어리가 그대로 남는다.
     이제는 지운다 — 중앙 하트는 bigHeartFX 하나로 통일한다. */
  var els=layer.querySelectorAll(".v1-glow,.v2-glow,.v3-core,.v4-glow,.v4-hpop,.v6-glow,.v6-hpop,.hwave");
  for(var i=0;i<els.length;i++)els[i].parentNode&&els[i].parentNode.removeChild(els[i]);
}

let reviewRoseTap=0;
function fxHeart(el){
  const layer=$("#fxLayer");if(!layer)return;
  const [x,y]=fxOrigin(el);++fxGen;applyFX(layer);
  // Cycle by tap, independent of exercise size. Each burst owns its cleanup.
  const style=reviewRoseTap++%4;
  const flowers=document.createElement("div");flowers.className="review-roses";
  flowers.dataset.style=String(style+1);
  layer.appendChild(flowers);
  const spray=document.createElement("div");spray.className="review-spray";flowers.appendChild(spray);
  if(style===0)burstV1(spray,x,y,{petals:18,dots:14,loose:10,flash:false,dist:1.6});
  else if(style===1){
    burstV2(spray,x,y,{petals:18,dots:14,trails:7,flash:false,dist:1.45});
    for(const p of spray.querySelectorAll('.v2-p,.v2-d'))p.style.setProperty('--grav','40px');
  }
  else if(style===2)burstV4(spray,x,y,{petals:18,dots:14,tw:8,flash:false,dist:1.75});
  else burstV3(spray,x,y,{petals:16,dots:10,pollen:18,rays:7,waves:0,flash:false,dist:1.5});
  calmFX(spray);
  const core=document.createElement("div");core.className="review-rose-core";
  core.style.setProperty("--x",x+"px");core.style.setProperty("--y",y+"px");
  core.innerHTML=REVIEW_ROSE_SVG;
  flowers.appendChild(core);
  setTimeout(()=>flowers.remove(),1300);
}

function esc(v){return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
/* 고양이 대사는 고양이가 있는 곳에서 한다(26.10.13 영신: 화면 맨 밑에 뜨는 대사는 "눈에 띄지도 않고 좀 뜬금없다").
   맨 밑에 뜨던 알림(toast)은 없앴다. 지금 화면 고양이의 말풍선에 띄운다. 고양이가 없는 연습 목록에서는 홈 고양이가 받아 둔다. */
function catSay(msg){
  const on=id=>$("#"+id)?.classList.contains("active");
  if(on("gameScreen")&&state.session){quizSay(msg);return;}
  const b=$(on("sumScreen")?"#sumBubble":"#homeBubble");b.innerHTML=`<span><span class="nm">고양고양이</span> ${esc(msg)}</span>`;b.hidden=false;
}
/* 문제 화면: 카드 머리줄 고양이 말풍선(시간 막대 자리)에 잠깐 띄우고, 그 카드가 그대로면 원래 말풍선으로 되돌린다. */
function quizSay(msg){
  const s=state.session,sp=$("#catSpeech");if(!s||!sp)return;
  if(s.opening)quizOpenEnd(s);
  if(!state.quizSayT)state.quizSayBack={text:sp.textContent,hidden:sp.hidden,card:s.currentId,answered:s.answered};
  clearTimeout(state.quizSayT);
  sp.textContent=msg;sp.hidden=false;$("#timeWrap").style.visibility="hidden";
  state.quizSayT=setTimeout(()=>{state.quizSayT=null;const b=state.quizSayBack;
    if(state.session!==s||s.currentId!==b.card||s.answered!==b.answered)return; // 그사이 카드가 바뀌거나 공개됐으면 그쪽이 말풍선을 정한다
    sp.textContent=b.text;sp.hidden=b.hidden;if(!s.answered)$("#timeWrap").style.visibility="";},1600);
}
/* 시작 대사: 첫 카드에서 고양이가 말한다. 읽는 동안(2.6초, 먼저 치기 시작하면 그때까지) 첫 카드 시간은 흐르지 않는다. */
function quizOpen(msg){
  const s=state.session,sp=$("#catSpeech");if(!msg||!s||!sp||s.currentId===null)return;
  sp.textContent=msg;sp.hidden=false;$("#timeWrap").style.visibility="hidden";
  const r=$("#catSpeechReserve");if(r&&msg.length>(r.textContent||"").length)r.textContent=msg; // 말풍선 높이만큼 자리를 잡아 둔다(그 카드 동안 유지해 화면이 들썩이지 않는다)
  s.opening=true;clearTimeout(state.openT);state.openT=setTimeout(()=>quizOpenEnd(s),2600);
}
function quizOpenEnd(s){
  if(!s||!s.opening)return;s.opening=false;clearTimeout(state.openT);
  if(state.session!==s||s.answered)return;
  const sp=$("#catSpeech");sp.textContent="";sp.hidden=true;$("#timeWrap").style.visibility="";
  s.cardStart=s.pausedAt||Date.now(); // 화면을 가린 채 접히면 가린 때부터 잰다(돌아올 때 가린 시간만큼 다시 민다)
}

// A transparent native button sits over the first cell, above the typing input.
// The other cells continue to tap the input directly (including on mobile).
(()=>{
  const hint=$("#hintBtn"),context=$("#hoeCtx"),form=$("#aform");
  let pending=0;
  function positionHint(){
    const s=state.session,cell=context.querySelector(".slot");
    if(!s||s.currentId===null||s.answered||s.copyMode||hint.disabled||!cell){hint.hidden=true;return;}
    const r=cell.getBoundingClientRect(),f=form.getBoundingClientRect();
    if(!r.width||!r.height||!f.width){hint.hidden=true;return;}
    // Extend left of the first glyph; never cover the adjacent letter.
    const width=r.width+6,height=Math.max(44,r.height);
    hint.style.left=(r.left-f.left-6)+"px";
    hint.style.top=(r.top-f.top-(height-r.height)/2)+"px";
    hint.style.width=width+"px";hint.style.height=height+"px";
    hint.hidden=false;
  }
  function schedulePosition(){
    if(pending)return;
    pending=requestAnimationFrame(()=>{pending=0;positionHint();});
  }
  hint.addEventListener("pointerdown",e=>e.preventDefault());
  // 26.10.27 영신 제보(iPhone): 힌트 칸을 누르면 화면이 맨 아래로 내려갔다. 입력칸에 글자를 넣고 커서를 옮길 때
  // iOS가 화면을 끌어내린다. 누르기 전 자리로 되돌린다. 그사이 학생이 직접 스크롤하면 건드리지 않는다.
  function holdScroll(y){
    let moved=false;const stop=()=>{moved=true;};
    window.addEventListener("touchmove",stop,{passive:true});window.addEventListener("wheel",stop,{passive:true});
    const back=()=>{if(!moved&&Math.abs(window.scrollY-y)>4)window.scrollTo(0,y);};
    requestAnimationFrame(back);setTimeout(back,120);
    setTimeout(()=>{back();window.removeEventListener("touchmove",stop);window.removeEventListener("wheel",stop);},360);
  }
  hint.addEventListener("click",e=>{
    e.preventDefault();e.stopPropagation();
    if(hint.disabled||hint.hidden)return;
    const y=window.scrollY;
    giveHint();positionHint();focusAnswerInput();holdScroll(y);
  });
  new MutationObserver(schedulePosition).observe(context,{childList:true,subtree:true});
  new MutationObserver(schedulePosition).observe(hint,{attributes:true,attributeFilter:["disabled"]});
  if(typeof ResizeObserver==="function")new ResizeObserver(schedulePosition).observe(context);
  window.addEventListener("resize",schedulePosition);
  positionHint();
})();

function savedSearchKey(value){return String(value||'').normalize('NFKC').toLowerCase().replace(/[’‘`´]/g,"'").replace(/[‐‑‒–—−]/g,'-').replace(/\s+/g,' ').trim();}
function savedSearchFind(value){
  const query=savedSearchKey(value);if(!/[\p{L}\p{N}]/u.test(query))return [];
  // Index the already loaded course lazily. Examples and notes are deliberately
  // excluded: a word merely mentioned in an explanation is not its headword.
  if(!savedSearchIndex)savedSearchIndex=Array.from(savedCatalog.values(),(item,order)=>{
    const heads=[...new Set([item.word.word,item.word.term].filter(Boolean).map(savedSearchKey))];
    return {item,order,heads,compact:heads.map(s=>s.replace(/[\s'-]/g,'')),meanings:[item.word.meaning,item.word.originalMeaning].filter(Boolean).map(savedSearchKey)};
  });
  const compact=query.replace(/[\s'-]/g,''),matches=[];
  for(const row of savedSearchIndex){
    const rank=row.heads.some(h=>h===query)?0:row.heads.some(h=>h.startsWith(query))?1:row.heads.some(h=>h.includes(query))?2:
      compact&&row.compact.includes(compact)?3:row.meanings.some(m=>m.includes(query))?4:-1;
    if(rank>=0)matches.push({item:row.item,rank,order:row.order});
  }
  return matches.sort((a,b)=>a.rank-b.rank||a.order-b.order).map(row=>row.item);
}

function savedGroups(items){

  const parts=[];let words=[];

    if(words.length&&words.length+group.length>12){parts.push(words);words=[];}
    words.push(...group);

   B1까지만 보는 학생은 25세트까지만. 마더텅·EBS·시험 단어장은 지금 범위 전부. 시험 단어장은 빌더가 PACE_NAME(토익 등)을 준다. */

/* ── 예측. recs는 시간순 [{at,ms,u,k}] (k: n 새 연습, a 다시 푼 연습, w 틀린 것만), target은 {u,ex}.

  return `${t.label}까지 ${paceRange(f.days[0],f.days[1])} · 연습 하나 ${exT}${tr} · ${basis}`.replace(/ · /g,'\u00a0· '); // 줄이 바뀌어도 구분점은 앞말에 붙는다
}
/* 무엇을 말할지: 처음(10판째) > 오랜만 > 하루가 짧음(하루 한 번) > 앞 목표 돌파 > 느려짐 > 빨라짐 > 다섯 판마다 예측. 아니면 원래 대사. */
function paceKind(recs,f,t,meta,now){
  const full=recs.filter(r=>r.k!=='w'),last=recs[recs.length-1],before=recs[recs.length-2];
  const plays=Number.isFinite(meta.total)?meta.total:full.length,since=plays-(meta.n||0),gap=before?Math.floor((paceDayStart(last.at)-paceDayStart(before.at))/864e5):0;
  if(!meta.intro)return 'intro';
  if(gap>=3)return 'absent';
  if(f.mode==='low'&&meta.lowDay!==paceDay(now))return 'low';
  if(t.passed&&meta.target&&meta.target!==t.label)return 'next';
  if(f.trend>=0.2&&plays-(meta.slowAt||0)>=5)return 'slow';
  if(f.trend<=-0.15&&since>=3)return 'fast';
  if(since>=5)return t.next&&!meta.later&&PACE_COURSE==='fable'?'later':'regular';
  return null;
}
function paceLine(kind,f,t,recs,now){
  const mode=f.mode==='daily'?'daily':'hour',pool=Array.isArray(PACE_LINES[kind])?PACE_LINES[kind]:PACE_LINES[kind][mode];
  const before=recs[recs.length-2],last=recs[recs.length-1];
  const v={T:t.label,N:t.next||'',P:t.passed||'',R:paceRange(f.days[0],f.days[1]),RB:f.days[1]+'일',m:Math.round(f.daily||0),p:Math.round(Math.abs(f.trend)*100),
    g:before?Math.floor((paceDayStart(last.at)-paceDayStart(before.at))/864e5):0};
  return paceFill(pool[Math.floor(Math.random()*pool.length)],v);
}
function paceShow(info,ms){
  const now=Date.now(),recs=paceRead(),words=info.partial?info.words:info.e.words;
  if(ms>=5000){
    const fullBefore=recs.filter(r=>r.k!=='w').length;
    recs.push({at:now,ms:Math.round(ms),u:Math.round(paceUnits(words)*10)/10,k:info.partial?'w':info.was?'a':'n'});paceSave(paceKey,recs.slice(-paceKeep));
    // 판 수는 보관(최근 600판)과 따로 센다. 배열 길이로 세면 600판에서 멈춰 다섯 판마다 대사가 끊겼다(26.10.15 아스트라 리뷰 T05).
    if(!info.partial){const m=paceMeta();m.total=(Number.isFinite(m.total)?m.total:fullBefore)+1;paceSave(paceMetaKey,m);}
  }
  const note=paceNoteEl();note.hidden=true;
  if(info.partial)return;
  const t=paceTargets(),f=t&&paceForecast(recs,t,now);if(!f)return;
  note.textContent=paceNote(f,t);note.hidden=false;
  if($("#sumTitle").textContent!=="연습 클리어 ✦")return;   // 세트 정복·엔딩 대사는 그대로 둔다
  const meta=paceMeta(),kind=paceKind(recs,f,t,meta,now),plays=Number.isFinite(meta.total)?meta.total:recs.filter(r=>r.k!=='w').length;
  if(kind){
    $("#sumBubble").innerHTML=`<span><span class="nm">고양고양이</span> ${esc(paceLine(kind,f,t,recs,now))}</span>`;
    meta.n=plays;meta.intro=true;
    if(kind==='low')meta.lowDay=paceDay(now);
    if(kind==='slow')meta.slowAt=plays;
    if(kind==='later')meta.later=true;
  }
  meta.target=t.label;paceSave(paceMetaKey,meta);
}
function paceNoteEl(){
  let el=$("#paceNote");
  if(!el){el=document.createElement('p');el.id='paceNote';el.className='pace-note';el.hidden=true;const b=$("#sumBubble");b.parentNode.insertBefore(el,b.nextSibling);}
  return el;
}
var paceOrigStart=startExercise,paceOrigFinish=finishExercise;
startExercise=function(){const r=paceOrigStart.apply(this,arguments);paceActive=0;paceLast=Date.now();return r;};
finishExercise=function(){
  const s=state.session;
  const info=s&&s.lesson&&s.lesson.kind!=='saved'&&s.exercise?{e:s.exercise,partial:!!s.partial,was:!!getRec(s.lesson.id,s.exercise.title)?.completed,words:s.words}:null;
  paceTick();const ms=paceActive;paceActive=0;paceLast=0;
  const r=paceOrigFinish.apply(this,arguments);
  if(info)try{paceShow(info,ms);}catch(e){}
  return r;
};
function paceInit(){
  ['keydown','pointerdown','input'].forEach(n=>document.addEventListener(n,paceTick,true));
  document.addEventListener('visibilitychange',()=>{if(document.hidden){paceTick();paceLast=0;}else if(state.session)paceLast=Date.now();});
}
paceInit();
/* PACE_END */
renderHome();
</script>
</body>
